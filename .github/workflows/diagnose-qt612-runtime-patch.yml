name: Diagnose isolated Windows Qt 6.12 runtime patch

# Explicit label only; no product workflow, subscription input or release artifact.
on:
  pull_request:
    branches: [test]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: swirl-qt612-runtime-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  qt612-runtime-comparison:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'qa-qt612-runtime-patch' && github.repository == 'SOLHK/Swirl' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/node-probe-render-20261105' && github.base_ref == 'test' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SWIRL_QT612_RUNTIME_PATCH: '1'
      SWIRL_DIAGNOSTIC_PR: '61'
      SWIRL_EXECUTING_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONUTF8: '1'
    steps:
      - name: Checkout the exact PR merge source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select the x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements-qt-sdk.txt
      - name: Prepare a fresh public evidence directory and SDK tools
        id: prepare
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/qt612-runtime-patch'
          if (Test-Path -LiteralPath $evidence) { throw 'Refusing pre-existing diagnostic evidence.' }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          python -m pip install -r tools/requirements-qt-sdk.txt 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'pip.log')
          if ($LASTEXITCODE -ne 0) { throw 'SDK tool installation failed.' }
      - name: Restore archive candidates without saving or trusting an extracted SDK
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/swirl-qt-6.12.0
          key: qt-sdk-${{ runner.os }}-6.12.0-msvc2022-${{ hashFiles('tools/Install-QtSdk.py', 'tools/requirements-qt-sdk.txt') }}
      - name: Verify pure path, identity and failure-preservation boundaries
        id: boundaries
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools/tests -p test_qt612_diagnostic_sdk.py -v 2>&1 | Tee-Object -FilePath 'build-evidence/qt612-runtime-patch/boundary-tests.log'
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic boundary control failed.' }
      - name: Build a pinned Qml module and compose a separate complete derived kit
        id: sdk
        shell: pwsh
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP "qt612-patch-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $archives = Join-Path $env:RUNNER_TEMP 'swirl-qt-6.12.0/archives'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/qt612-runtime-patch/sdk'
          python tools/Build-Qt612QmlDiagnosticSdk.py --work-root $work --evidence-directory $evidence --archive-cache $archives --expected-source-sha "$env:GITHUB_SHA" --expected-pr-head-sha "$env:SWIRL_EXECUTING_PR_HEAD" 2>&1 | Tee-Object -FilePath 'build-evidence/qt612-runtime-patch/sdk-driver.log'
          if ($LASTEXITCODE -ne 0) { throw 'Derived SDK provenance or build closure failed; no fixtures admitted.' }
      - name: Run unchanged fixtures once with each complete runtime and preserve baseline failures
        id: comparison
        if: success() && steps.sdk.outcome == 'success'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP "qt612-compare-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/qt612-runtime-patch/comparison'
          $receipt = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/qt612-runtime-patch/sdk/receipt.json'
          python tools/RunQt612RuntimeComparison.py --sdk-receipt $receipt --work-root $work --evidence-directory $evidence --expected-source-sha "$env:GITHUB_SHA" --expected-pr-head-sha "$env:SWIRL_EXECUTING_PR_HEAD" 2>&1 | Tee-Object -FilePath 'build-evidence/qt612-runtime-patch/comparison-driver.log'
          if ($LASTEXITCODE -ne 0) { throw 'At least one original fixture result failed or comparison collection was incomplete. Stock and patched results remain separate.' }
      - name: Record actual step outcomes, including failed or skipped work
        if: always()
        shell: pwsh
        timeout-minutes: 1
        env:
          SWIRL_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          SWIRL_BOUNDARIES_OUTCOME: ${{ steps.boundaries.outcome }}
          SWIRL_SDK_OUTCOME: ${{ steps.sdk.outcome }}
          SWIRL_COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'build-evidence/qt612-runtime-patch' -Force | Out-Null
          [ordered]@{
            schema=1; executing_workflow_sha=$env:GITHUB_SHA; executing_pr_head_sha=$env:SWIRL_EXECUTING_PR_HEAD
            run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT
            prepare_step=$env:SWIRL_PREPARE_OUTCOME; boundaries_step=$env:SWIRL_BOUNDARIES_OUTCOME
            sdk_step=$env:SWIRL_SDK_OUTCOME; comparison_step=$env:SWIRL_COMPARISON_OUTCOME
            scope='Independent public stock/patched Qt GC comparison only; no product workflow, real subscriptions, native GPU acceptance or Swirl VME-root-cause conclusion.'
            actual_process_module_sampling=$false; real_provider_requests=0
            finished_utc=[DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'build-evidence/qt612-runtime-patch/step-outcomes.json' -Encoding utf8
      - name: Preserve original logs, identities, source and fixture receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: Swirl-Qt612-Isolated-Runtime-Patch-Diagnosis
          path: build-evidence/qt612-runtime-patch/
          if-no-files-found: error
          retention-days: 14

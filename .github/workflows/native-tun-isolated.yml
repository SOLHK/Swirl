name: Native TUN isolated backend

on:
  push:
    branches: [work/native-tun-windows-20261030-isolated, test, main]
    paths:
      - 'core/**'
      - 'scripts/Stage-WindowsRustProduct.ps1'
      - 'tools/Collect-RustDependencies.py'
      - 'tools/Collect-NativeTunAcceptance.ps1'
      - 'tools/Verify-NativeTunAcceptance.py'
      - 'scripts/tests/Test-NativeTunAcceptance.py'
      - 'tools/tests/test_portable_core_boundary.py'
      - '.github/workflows/native-tun-isolated.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'scripts/Stage-WindowsRustProduct.ps1'
      - 'tools/Collect-RustDependencies.py'
      - 'tools/Collect-NativeTunAcceptance.ps1'
      - 'tools/Verify-NativeTunAcceptance.py'
      - 'scripts/tests/Test-NativeTunAcceptance.py'
      - 'tools/tests/test_portable_core_boundary.py'
      - '.github/workflows/native-tun-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tun-isolated-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.os }} native packet and core tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SWIRL_SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stable Rust with lint and formatting
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: core
          key: native-tun-isolated
          cache-on-failure: true
      - name: Source formatting
        run: cargo fmt --all -- --check
      - name: Acceptance evidence rejects unsupported or altered claims
        run: python ../scripts/tests/Test-NativeTunAcceptance.py
      - name: Shared Rust keeps operating-system calls in the platform adapter
        run: python ../tools/tests/test_portable_core_boundary.py
      - name: Stage exact locked dependency notices
        run: |
          cargo metadata --locked --format-version 1 > "${{ runner.temp }}/swirl-native-metadata.json"
          python ../tools/Collect-RustDependencies.py --metadata "${{ runner.temp }}/swirl-native-metadata.json" --inventory "${{ runner.temp }}/swirl-native-notices/DEPENDENCIES.json" --notices "${{ runner.temp }}/swirl-native-notices" --supplemental-inventory DEPENDENCIES.json
          python -c "import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); source=json.loads(pathlib.Path('DEPENDENCIES.json').read_text(encoding='utf-8')); built=json.loads((p/'DEPENDENCIES.json').read_text(encoding='utf-8')); assert source==built; notices=[n for a in source['runtime_artifacts'] for n in a['notices']]+[n for a in source['packages'] for n in a.get('supplemental_notices',[])]; assert all(pathlib.Path(n).read_bytes()==(p/n).read_bytes() for n in notices)" "${{ runner.temp }}/swirl-native-notices"
      - name: Parse Windows product staging script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          foreach ($script in @('../scripts/Stage-WindowsRustProduct.ps1', '../tools/Collect-NativeTunAcceptance.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Lint complete affected crates
        run: cargo clippy --locked -p swirl-tun -p swirl-platform -p swirl-dns -p swirl-transport -p swirl-protocol -p swirl-core -p swirl-api --all-targets -- -D warnings
      - name: Packet, resolver, network transaction and original proxy regressions
        run: cargo test --locked -p swirl-tun -p swirl-platform -p swirl-dns -p swirl-transport -p swirl-protocol -p swirl-core -p swirl-api
      - name: Real loopback TLS fixture preserves its listener after completed client reset
        if: runner.os == 'Windows'
        run: cargo test --locked -p swirl-api --example windows-tun-smoke
      - name: Build actual Rust library and helper
        id: backend_build
        run: cargo build --locked -p swirl-api --lib --bin swirl-tun-helper --release
      - name: Real Wintun scoped TCP UDP and DNS smoke in this disposable VM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $smokePrincipal = [Security.Principal.WindowsPrincipal]::new($smokeIdentity)
          if (-not $smokePrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The explicitly scoped driver smoke requires an elevated disposable runner; it must not be silently skipped.'
          }
          $smokeArchive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $smokeArchive
          if ((Get-FileHash $smokeArchive -Algorithm SHA256).Hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw 'Official Wintun archive hash mismatch.'
          }
          $smokeDirectory = Join-Path $env:RUNNER_TEMP 'swirl-wintun-smoke'
          Expand-Archive -LiteralPath $smokeArchive -DestinationPath $smokeDirectory
          $smokeDriver = Join-Path $smokeDirectory 'wintun/bin/amd64/wintun.dll'
          cargo run --locked --release -p swirl-api --example windows-tun-smoke -- --disposable-network --wintun $smokeDriver 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'swirl-wintun-smoke.log')
          if ($LASTEXITCODE -ne 0) { throw "Scoped Wintun smoke failed with exit code $LASTEXITCODE" }
      - name: Real scoped WFP transaction and application isolation in this disposable VM
        # Driver traffic and WFP are independent evidence. Only proceed after
        # the real format/lint/unit/build chain succeeded; preserve any driver
        # failure as a failed job while collecting the separate WFP result.
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.backend_build.outcome == 'success' }}
        shell: pwsh
        run: |
          # Explicitly limited to this smoke executable and reserved loopback
          # endpoints. No host-wide block, physical DNS or default-route change.
          cargo test --locked -p swirl-platform --example windows-wfp-scoped-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Scoped WFP fixture error/cleanup regression failed.' }
          $receipt = Join-Path $env:RUNNER_TEMP 'swirl-wfp-scoped-receipt.json'
          $log = Join-Path $env:RUNNER_TEMP 'swirl-wfp-scoped-smoke.log'
          cargo run --locked --release -p swirl-platform --example windows-wfp-scoped-smoke -- --disposable-network --receipt $receipt 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Scoped WFP smoke failed with exit code $LASTEXITCODE; retain its receipt for owned cleanup." }
          $final = @(Get-Content -LiteralPath $log | Where-Object { $_.TrimStart().StartsWith('{') })
          if ($final.Count -ne 1) { throw 'Scoped WFP original final evidence is missing or ambiguous.' }
          $summary = $final[0] | ConvertFrom-Json
          if ($summary.ok -ne $true -or $summary.source_sha -ne $env:GITHUB_SHA -or $summary.rules -ne 4) { throw 'Scoped WFP source or rule-scope evidence differs.' }
          foreach ($field in @('transaction_error_rollback','nonce_conflict_refused','persistent_across_engine_reopen','control_endpoints_unchanged','other_application_unchanged','owned_policy_removed','new_flow_block_ipv4_ipv6_tcp_udp')) {
            if ($summary.$field -ne $true) { throw "Scoped WFP assertion is missing: $field" }
          }
          if ($summary.system_kill_switch_acceptance -ne $false -or $summary.boot_acceptance -ne $false -or $summary.existing_flow_revocation_guarantee -ne $false) {
            throw 'Scoped WFP evidence must not be relabelled as system kill-switch or boot acceptance.'
          }
      - name: Preserve native backend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-tun-backend-${{ runner.os }}-${{ github.sha }}
          path: |
            core/target/release/swirl_api.dll
            core/target/release/libswirl_api.so
            core/target/release/swirl-tun-helper.exe
            core/target/release/swirl-tun-helper
            ${{ runner.temp }}/swirl-native-notices/
            ${{ runner.temp }}/swirl-wintun-smoke.log
            ${{ runner.temp }}/swirl-wfp-scoped-smoke.log
            ${{ runner.temp }}/swirl-wfp-scoped-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve driver failure diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-tun-driver-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/swirl-wintun-smoke.log
            ${{ runner.temp }}/swirl-wfp-scoped-smoke.log
            ${{ runner.temp }}/swirl-wfp-scoped-receipt.json
          if-no-files-found: warn

  # The explicit Windows-only smoke owns one temporary adapter and only exact
  # test-destination routes. It never changes physical DNS, firewall rules or
  # default/capture routes. The separate WFP command owns only its application's
  # loopback filters. Both are Server evidence, separate from Windows 11 full
  # capture, physical leakage, system kill-switch, boot and recovery acceptance.

name: Swirl VF P6 native rounding

on:
  push:
    branches: [work/vf-takeover-abc-20261021]
    paths:
      - 'tools/swirl_vf/tools/native_rounding.py'
      - 'tools/swirl_vf/tools/bounded_rebase.py'
      - 'tools/swirl_vf/tests/test_native_rounding.py'
      - 'tools/swirl_vf/tests/test_exact_rebase.py'
      - 'tools/swirl_vf/tests/test_precision_coretext.py'
      - 'tools/swirl_vf/platform/make_rounding_controls.py'
      - 'tools/swirl_vf/platform/precision_rounding_trace.cpp'
      - 'tools/swirl_vf/platform/precision_rounding_trace/**'
      - 'tools/swirl_vf/platform/precision_coretext.swift'
      - 'tools/swirl_vf/platform/probe_precision_coretext.py'
      - '.github/workflows/swirl-vf-p6-rounding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.61.1 numpy==2.2.6 uharfbuzz==0.56.3
      - name: Targeted rounding regressions and retained counterexamples
        run: |
          python -m unittest discover -s tools/swirl_vf/tests -p test_native_rounding.py -v
          python -m unittest discover -s tools/swirl_vf/tests -p test_exact_rebase.py -v
          python -m unittest discover -s tools/swirl_vf/tests -p test_precision_coretext.py -v
      - name: Serialize authored one-face controls and observe HarfBuzz
        run: python tools/swirl_vf/platform/make_rounding_controls.py --output build/p6-private/controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-exact-aggregate-${{ github.sha }}
          path: build/p6-private/controls/summary.json
          retention-days: 7

  coretext:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.61.1 numpy==2.2.6 uharfbuzz==0.56.3
      - run: python tools/swirl_vf/platform/make_rounding_controls.py --output build/p6-private/controls
      - name: Actual CoreText metrics outlines and post-GSUB layout
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/swirl_vf/platform')
          from probe_precision_coretext import run_pair, AXES, Q, R
          from make_rounding_controls import F2_Q, F2_R, F2_USER
          root=Path('build/p6-private')
          for grid,n in [('bounded5',5),('exact16',16)]:
              for case,q,r,axes in [('coefficient',Q,R,AXES),('F2',F2_Q,F2_R,{
                  'reference':dict(zip(('XWDT','XWGT','XHGT'),map(float,F2_Q))), 'target':F2_USER})]:
                  result=run_pair(root/'controls'/f'{grid}-reference.ttf',
                      root/'controls'/f'{grid}-target.ttf', root/f'{grid}-{case}',
                      grid_multiplier=n,axes=axes,q=q,r=r,case_name=f'{grid}-{case}')
                  assert all(result['source_hashes_unchanged'].values())
                  print(json.dumps({k:result[k] for k in ('case_name','os_version',
                      'maximum_native_advance_error','maximum_native_outline_error')}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-coretext-aggregate-${{ github.sha }}
          path: build/p6-private/*-*/summary.json
          retention-days: 7

  windows-native:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.61.1 numpy==2.2.6 uharfbuzz==0.56.3
      - name: Serialize self-authored controls only
        run: |
          python tools/swirl_vf/platform/make_rounding_controls.py --output build/p6-private/controls
          if ($LASTEXITCODE -ne 0) { throw 'Authored control generation failed' }
      - name: Record actual Windows platform without implying Windows 11
        run: |
          $os = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          @{ product=$os.ProductName; build=$os.CurrentBuildNumber; Windows11='NOT_RUN'; original_font='NOT_RUN' } | ConvertTo-Json | Set-Content build/p6-private/controls/windows-platform.json
      - name: Compile focused native trace
        run: |
          cmake -S tools/swirl_vf/platform/precision_rounding_trace -B build/p6-private/probe -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Trace configuration failed' }
          cmake --build build/p6-private/probe --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Trace compilation failed' }
      - name: Measure integer design fields and floating geometry separately
        run: |
          foreach ($grid in @('bounded5','exact16')) {
            foreach ($case in @('coefficient','F2')) {
              $extra = @()
              if ($case -eq 'F2') { $extra = @('--f2-witness') }
              & build/p6-private/probe/Release/precision_rounding_trace.exe "build/p6-private/controls/${grid}-reference.ttf" "build/p6-private/controls/${grid}-target.ttf" "build/p6-private/controls/${grid}-${case}-directwrite.json" @extra
              if ($LASTEXITCODE -ne 0) { throw 'Native identity or protocol failed' }
            }
          }
      - name: Verify the specific coefficient fix without claiming whole-font acceptance
        run: |
          $old = Get-Content build/p6-private/controls/bounded5-coefficient-directwrite.json -Raw | ConvertFrom-Json
          $new = Get-Content build/p6-private/controls/exact16-coefficient-directwrite.json -Raw | ConvertFrom-Json
          if ($old.strict_result -ne 'FAIL') { throw 'Original strict failure unexpectedly changed' }
          if ($new.strict_result -ne 'PASS') { throw 'Exact-grid coefficient witness still fails' }
      - name: Retain the unchanged strict gate on the new nominal-coordinate witness
        run: |
          $r = Get-Content build/p6-private/controls/exact16-F2-directwrite.json -Raw | ConvertFrom-Json
          if (-not $r.native_protocol_completed -or -not $r.source_files_unchanged) { throw 'Native diagnostic incomplete' }
          if (-not $r.within_1_32_native_parity) { throw 'STRICT_NATIVE_ACCEPTANCE_FAIL_RETAINED: 1/32 source-FUnit gate' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-windows-authored-trace-${{ github.sha }}
          path: |
            build/p6-private/controls/*-directwrite.json
            build/p6-private/controls/windows-platform.json
          # Font binaries and arbitrary logs are never exported.
          retention-days: 7

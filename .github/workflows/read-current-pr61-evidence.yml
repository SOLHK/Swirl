name: Read current PR61 artifact evidence

# Read-only original evidence. Never executes installer, DLL, or archive scripts.
on:
  pull_request:
    branches: [test]
    types: [synchronize, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: swirl-pr61-current-evidence-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  reader-controls:
    if: ${{ github.repository == 'SOLHK/Swirl' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/node-probe-render-20261105' && github.base_ref == 'test' && (github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'qa-pr61-current-evidence')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact reader source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run archive and source-boundary controls without network
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/tests/test_current_pr61_artifact_reader.py -v

  read-current-evidence:
    needs: reader-controls
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'qa-pr61-current-evidence' && github.repository == 'SOLHK/Swirl' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/node-probe-render-20261105' && github.base_ref == 'test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [node, controlled, private, package, installer, engine, qt_source]
    steps:
      - name: Checkout the exact reader source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact producer ZIP and emit bounded original text
        shell: bash
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/ReadCurrentPr61Artifacts.py --kind '${{ matrix.kind }}'
      - name: Preserve downloaded original and acquisition receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 5
        with:
          name: Swirl-PR61-Current-Evidence-${{ matrix.kind }}
          path: build-evidence/pr61-current-artifacts/${{ matrix.kind }}/
          if-no-files-found: error
          retention-days: 14

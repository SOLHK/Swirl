name: Build pinned Qt 6.12 Network backport

on:
  push:
    branches: [work/subscription-tun-0245-20261115]
    paths:
      - '.github/workflows/build-qt612-network-backport.yml'
      - 'tools/Build-Qt612NetworkBackport.py'
      - 'tools/qt612-backports.lock.json'
      - 'tools/qt612-product-sdk.lock.json'
      - 'tools/qt612-product-source.lock.json'
      - 'tools/patches/CVE-2026-116337-qtbase-6.12-*.diff'
      - 'tools/repros/qt612-http-bounds/**'
      - 'tools/Build-OpenSslRuntime.py'
      - 'tools/openssl-runtime.lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt612-network-backport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  network-sdk:
    if: github.repository == 'SOLHK/Swirl'
    runs-on: windows-2022
    timeout-minutes: 85
    env:
      PYTHONUTF8: '1'
      VCTIP_NO_TELEMETRY: '1'
    steps:
      - name: Checkout the exact producer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the matching x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: '14.44'
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements-qt-sdk.txt
      - name: Prepare SDK tools
        shell: pwsh
        run: |
          python -m pip install -r tools/requirements-qt-sdk.txt
          if ($LASTEXITCODE -ne 0) { throw 'SDK tools installation failed.' }
      - name: Install the exact official MSVC Qt 6.12 SDK
        shell: pwsh
        timeout-minutes: 12
        run: |
          python tools/Install-QtSdk.py --version 6.12.0 --arch win64_msvc2022_64 --output "$env:RUNNER_TEMP/qt-network-official"
          if ($LASTEXITCODE -ne 0) { throw 'Official SDK installation failed.' }
      - name: Build the pinned OpenSSL runtime and complete development inputs
        shell: pwsh
        timeout-minutes: 25
        run: |
          ./scripts/Build-CiOpenSslRuntime.ps1 -OutputDirectory "$env:RUNNER_TEMP/qt-network-openssl"
      - name: Build and verify QtNetwork with stock negative controls
        shell: pwsh
        timeout-minutes: 45
        run: |
          python tools/Build-Qt612NetworkBackport.py --official-receipt "$env:RUNNER_TEMP/qt-network-official/sdk-install-result.json" --openssl-root "$env:RUNNER_TEMP/qt-network-openssl" --work-root "$env:RUNNER_TEMP/qt-network-backport" --evidence-directory "$env:GITHUB_WORKSPACE/build-evidence/network-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Network backport verification failed.' }
      - name: Preserve exact binaries, corresponding source and original evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Qt612-Network-Backport
          path: build-evidence/
          if-no-files-found: error
          retention-days: 90

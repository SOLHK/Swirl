name: Swirl VF D1-D3 isolated native controls

on:
  push:
    branches: [work/vf-macos-windows-d1-20261021]
    paths:
      - '.github/workflows/swirl-vf-macos-windows-d1.yml'
      - 'tools/swirl_vf/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-synthetic:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install fonttools==4.61.1 numpy==2.2.6 uharfbuzz==0.56.3
      - name: Test original source-substitution and preservation controls
        run: |
          python -m unittest discover -s tools/swirl_vf/tests -p test_macos_source_baseline.py -v
          python -m unittest discover -s tools/swirl_vf/tests -p 'test_d2*.py' -v
          python -m unittest discover -s tools/swirl_vf/tests -p 'test_d3*.py' -v
          python -m unittest discover -s tools/swirl_vf/tests -p test_rebuild_checkpoints.py -v
      - name: Generate only the self-authored two-face fixture
        run: |
          mkdir -p build/d1
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/swirl_vf/platform')
          from test_coretext_extract import make_fixture
          make_fixture(Path('build/d1/self-authored.ttc'))
          PY
      - name: Run exact native source baseline on generated fixture
        run: |
          python tools/swirl_vf/platform/macos_source_baseline.py build/d1/self-authored.ttc --output build/d1/baseline
      - name: Preserve the unchanged strict native metric gate
        id: strict
        run: |
          python tools/swirl_vf/platform/test_coretext_extract.py --output build/d1/strict --require-native
      - name: Independently reconstruct native paths with explicit table metrics
        if: always()
        run: |
          python tools/swirl_vf/platform/test_native_table_metrics.py --output build/d1/table-metrics --require-native
      - name: Verify the GDEF refusal with real native identity and HarfBuzz shaping
        if: always()
        run: |
          python tools/swirl_vf/platform/test_d3_rebuild_guards.py --binary "$PWD/build/d1/table-metrics/coretext_extract" --output build/d3-synthetic-guards
      - name: Independently test frozen metric predictions at fresh UPEMs
        if: always()
        run: |
          python tools/swirl_vf/platform/d2_metric_upem.py --binary "$PWD/build/d1/table-metrics/coretext_extract" --output build/d2-synthetic-upem
      - name: Retain only self-authored synthetic reports, never source fonts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-macos-synthetic-${{ github.sha }}
          path: |
            build/d1/baseline/baseline.json
            build/d1/strict/*.json
            build/d1/table-metrics/*.json
            build/d2-synthetic-upem/summary.json
            build/d3-synthetic-guards/summary.json
          retention-days: 7

  windows-directwrite-synthetic:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and generate original controls
        run: |
          python -m pip install fonttools==4.61.1 numpy==2.2.6
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python tools/swirl_vf/platform/make_standard_fixture.py build/d1/self-authored-standard.ttc
          if ($LASTEXITCODE -ne 0) { throw 'Standard fixture generation failed' }
          python tools/swirl_vf/platform/make_metric_fixture.py build/d1/self-authored-metrics.ttc
          if ($LASTEXITCODE -ne 0) { throw 'Metric fixture generation failed' }
      - name: Test D2 diagnostic preservation controls
        run: |
          python -m unittest discover -s tools/swirl_vf/tests -p 'test_d2*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'D2 diagnostic tests failed' }
          python -m unittest discover -s tools/swirl_vf/tests -p 'test_d3*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'D3 production guard tests failed' }
          python -m unittest discover -s tools/swirl_vf/tests -p test_rebuild_checkpoints.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint recovery tests failed' }
      - name: Run actual DirectWrite all-glyph and five-DPI controls
        run: |
          ./tools/swirl_vf/platform/run_directwrite_probe.ps1 -Font build/d1/self-authored-standard.ttc -OutputDirectory build/d1/standard -AllGlyphs -Render
          if ($LASTEXITCODE -ne 0) { throw 'DirectWrite standard fixture failed' }
          ./tools/swirl_vf/platform/run_directwrite_probe.ps1 -Font build/d1/self-authored-metrics.ttc -OutputDirectory build/d1/metrics -AllGlyphs -Render -Binary build/d1/standard/build/Release/directwrite_probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'DirectWrite production HVAR/VVAR fixture failed' }
      - name: Record actual Windows scope without granting original or desktop acceptance
        shell: bash
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          controls = []
          for label, faces in [('standard', 3), ('metrics', 2)]:
              report = json.loads(Path(f'build/d1/{label}/directwrite-run.json').read_text(encoding='utf-8-sig'))
              assert report['status'] == 'PASS_NATIVE_PROBE' and report['native_exit_code'] == 0
              assert report['native_runtime'] == 'RAN' and report['input_unchanged'] is True
              assert report['native_summary'][0]['faces_passed'] == faces
              assert report['system_installation'] == report['real_swirl_ui'] == 'NOT_TESTED'
              controls.append({'fixture': label, 'faces_passed': faces,
                  'windows_product': report['windows_product'], 'windows_build': report['windows_build'],
                  'raster_count': len(report['rasters']), 'input_sha256': report['input_sha256']})
          result = {'scope': 'self_authored_synthetic_controls_only', 'controls': controls,
              'original_font_acceptance': 'NOT_RUN', 'windows11_desktop_acceptance': 'NOT_RUN',
              'system_installation': 'NOT_TESTED', 'actual_qt_swirl_acceptance': 'NOT_RUN'}
          Path('build/d1/acceptance-scope.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PYCODE
      - name: Retain only self-authored DirectWrite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-windows-server-synthetic-${{ github.sha }}
          path: |
            build/d1/acceptance-scope.json
            build/d1/standard/*.json
            build/d1/standard/*.jsonl
            build/d1/standard/*.log
            build/d1/standard/*.png
            build/d1/metrics/*.json
            build/d1/metrics/*.jsonl
            build/d1/metrics/*.log
            build/d1/metrics/*.png
          retention-days: 7

  original-source-d2:
    # Outline and axis algorithms have not changed in D3. Keep this expensive
    # D2 matrix available explicitly, without repeating it for every guard fix.
    if: github.event_name == 'workflow_dispatch'
    # Exact original only. Native callbacks remain in memory; artifacts are
    # fixed aggregate summaries, never font tables, glyph payloads or logs.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native diagnostic dependencies
        run: python -m pip install fonttools==4.61.1 numpy==2.2.6
      - name: Classify all original strict axis failures and predeclared readback controls
        run: |
          python tools/swirl_vf/platform/d2_axis_readback.py \
            /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc \
            --expected-sha256 39d42acd292ed5c9de5cf185b54a3c460630d610a718ed84c9e4f148e226f890 \
            --output build/d2-private-axis
      - name: Compile unchanged Apple HVF oracle and compare bounded samples in all 32 faces
        run: |
          mkdir -p build/d2
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -mmacosx-version-min=15.4 tools/swirl_vf/platform/hvf_oracle.c -lhvf -o build/d2/hvf_oracle
          python tools/swirl_vf/platform/d2_hvf_faces.py \
            /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc \
            --binary "$PWD/build/d2/hvf_oracle" --output build/d2-private-faces
      - name: Retain aggregate original diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-original-aggregate-${{ github.sha }}
          path: |
            build/d2-private-axis/summary.json
            build/d2-private-faces/summary.json
          retention-days: 7

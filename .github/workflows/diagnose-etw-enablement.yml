name: Diagnose ETW provider enablement only

# This opt-in label event does not run Swirl or change any native UI verdict.
# Remove the temporary label after collecting the single experiment's evidence.
on:
  pull_request:
    branches: [test]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: swirl-etw-enablement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  provider-enablement-only:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'qa-etw-provider-probe' && github.repository == 'SOLHK/Swirl' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/node-probe-render-20261105' && github.base_ref == 'test' }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout the identified probe source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run bounded provider controls without starting Swirl
        id: provider_probe
        shell: pwsh
        env:
          SWIRL_ETW_PROVIDER_PROBE: '1'
          SWIRL_EXECUTING_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA) { throw 'Probe checkout identity mismatch.' }
          & git diff --quiet HEAD -- scripts/Test-EtwProviderEnablement.ps1 .github/workflows/diagnose-etw-enablement.yml
          if ($LASTEXITCODE -ne 0) { throw 'Probe source was modified.' }
          ./scripts/Test-EtwProviderEnablement.ps1 `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'build-evidence/etw-provider-enablement/probe') `
            -ScratchRoot $env:RUNNER_TEMP `
            -ExecutingWorkflowSha $env:GITHUB_SHA `
            -ExecutingPrHeadSha $env:SWIRL_EXECUTING_PR_HEAD
      - name: Record the independent diagnostic outcome
        if: always()
        shell: pwsh
        env:
          SWIRL_PROVIDER_PROBE_OUTCOME: ${{ steps.provider_probe.outcome }}
          SWIRL_EXECUTING_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Path 'build-evidence/etw-provider-enablement' -Force | Out-Null
          [ordered]@{
            schema=1; executing_workflow_sha=$env:GITHUB_SHA; executing_pr_head_sha=$env:SWIRL_EXECUTING_PR_HEAD
            run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; probe_step=$env:SWIRL_PROVIDER_PROBE_OUTCOME
            scope='Provider enablement controls only; no Swirl launch, event export, or current native acceptance.'
            original_failure_run_id=42292503809; original_failure_retained=$true
            finished_utc=[DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath 'build-evidence/etw-provider-enablement/step-outcomes.json' -Encoding utf8
      - name: Preserve control outputs and receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-ETW-Provider-Enablement-Probe
          path: build-evidence/etw-provider-enablement/
          if-no-files-found: error
          retention-days: 14

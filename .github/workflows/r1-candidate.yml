name: R1 removal candidate verification
on:
  push:
    branches: [work/rust-core-full-replacement-20261022]
    paths: ['tools/r1_candidate/**', '.github/workflows/r1-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exactly reviewed source candidate
        run: python tools/r1_candidate/apply.py apply
      - name: Static runtime and CMake dependency guards
        id: guard
        run: |
          python tools/test_rust_only_runtime.py -v
          python tools/test_rust_build_chain.py -v
          git diff --check
      - name: Export exact candidate blobs without changing any ref
        if: steps.guard.outcome == 'success'
        env:
          R1_BLOB_TOKEN: ${{ github.token }}
        run: python tools/r1_candidate/apply.py export
      - uses: actions/upload-artifact@v4
        with:
          name: R1-candidate-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/r1-candidate-blobs.json
          if-no-files-found: error
      - name: Native Rust workspace gates
        working-directory: core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked --workspace --lib --bins
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent protocol and strict public close checks
        env:
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_R1_PUBLIC_NETWORK: '1'
          SWIRL_R1_PUBLIC_REPORT: ${{ runner.temp }}/r1-public-proxy.json
        run: |
          python -m pip install cryptography==50.0.2
          python tools/tests/test_rust_core.py -v
          python tools/tests/test_shadowsocks.py -v
          python tools/tests/test_product_subscription_chain.py -v
          python tools/tests/test_r1_public_proxy.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R1-candidate-public-${{ github.sha }}
          path: ${{ runner.temp }}/r1-public-proxy.json
          if-no-files-found: warn
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exactly reviewed source candidate
        run: python tools/r1_candidate/apply.py apply
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Configure Rust-only MSVC test application
        run: cmake -S src/Swirl.Quick -B build/r1-candidate -G Ninja -DCMAKE_BUILD_TYPE=Release -DSWIRL_BUILD_UI_TESTS=ON
      - name: Compile actual UI and retained regression suites
        id: build
        run: cmake --build build/r1-candidate --target Swirl SwirlRustCoreTests SwirlRustCoreLibraryTests SwirlNodeTests SwirlImportTests SwirlSubscriptionFormatTests SwirlNetworkRegressionTests SwirlDiagnosticTests SwirlTelemetryTests SwirlExtensionTests --parallel 4
      - name: Deploy test dependencies
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime --qmldir src/Swirl.Quick/qml build/r1-candidate/Swirl.exe
          if ($LASTEXITCODE -ne 0) { throw 'UI dependency deployment failed.' }
          windeployqt --release --compiler-runtime build/r1-candidate/SwirlRustCoreTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency deployment failed.' }
      - name: Execute migrated Qt tests and real DLL fixtures
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: ctest --test-dir build/r1-candidate -R '^swirl-(rust-|node-real-chain|import-subscription|subscription-formats|stream-regression|local-extensions|telemetry-accounting|diagnostic-export)' --output-on-failure
      - uses: actions/setup-python@v5
        if: always() && steps.build.outcome == 'success'
        with:
          python-version: '3.14'
      - name: Real Qt import DPAPI reload and independent protocol peers
        if: always() && steps.build.outcome == 'success'
        env:
          SWIRL_RUST_QT_TESTS: ${{ github.workspace }}/build/r1-candidate/SwirlRustCoreTests.exe
          SWIRL_PRODUCT_EVIDENCE: ${{ runner.temp }}/r1-candidate-qt
        shell: pwsh
        run: |
          python -m pip install cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Peer dependency failed.' }
          python tools/tests/test_product_subscription_chain.py ProductQtIntegration -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt product chain failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R1-candidate-Windows-${{ github.sha }}
          path: |
            build/r1-candidate/Testing/Temporary/LastTest.log
            build/r1-candidate/*.xml
            build/r1-candidate/*chain.txt
            build/r1-candidate/*subscription.txt
            build/r1-candidate/*formats.txt
            build/r1-candidate/*regression.txt
            ${{ runner.temp }}/r1-candidate-qt
          if-no-files-found: warn

name: R4 one-time Cargo lock resolution
on:
  push:
    branches: [work/core-rule-routing-20261021]
permissions:
  contents: write
jobs:
  resolve-lock:
    if: github.ref == 'refs/heads/work/core-rule-routing-20261021'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/core-rule-routing-20261021
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve lockfile, preserve it, and remove helper
        shell: bash
        run: |
          set +e
          cd core
          cargo check --workspace
          check_status=$?
          set -e
          cd ..
          git diff --check
          rm .github/workflows/r4-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/Cargo.lock .github/workflows/r4-lock-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "build(core): resolve MRS decoder lockfile"
            git push origin HEAD:work/core-rule-routing-20261021
          fi
          echo "cargo check exit code: $check_status"

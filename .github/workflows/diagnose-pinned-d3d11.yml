name: Diagnose pinned Swirl D3D11 waits

# Explicit old-source experiment, separate from all current-source acceptance.
# Remove the opt-in label after evidence is collected. A cache/artifact miss
# blocks diagnosis; it never admits a rebuilt substitute or narrows UI gates.
on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: swirl-pinned-d3d-etw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-pinned-88cd-d3d-etw:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'SOLHK/Swirl' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/node-probe-render-20261105' && github.base_ref == 'test' && contains(github.event.pull_request.labels.*.name, 'qa-d3d-etw-88cd') }}
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the immutable source that produced the failed native case
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c30304a9946b95de2563a978d1ce9538b6d61485
          persist-credentials: false
      - name: Record the separate workflow and replay source identities
        id: replay_identity
        shell: pwsh
        env:
          SWIRL_EXECUTING_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'build-evidence/d3d-88cd-etw' -Force | Out-Null
          $source = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne 'c30304a9946b95de2563a978d1ce9538b6d61485') { throw 'Pinned replay checkout differs from the failed source.' }
          . ./scripts/Assert-BuildSource.ps1
          Assert-SwirlBuildSource -RepositoryRoot $env:GITHUB_WORKSPACE -ExpectedSourceSha $source
          [ordered]@{
            schema = 1
            scope = 'Old-source diagnostic only; not acceptance of the executing workflow source.'
            original_failure_retained = $true
            replaces_critical_result = $false
            executing_workflow_sha = $env:GITHUB_SHA
            executing_pr_head_sha = $env:SWIRL_EXECUTING_PR_HEAD
            executing_run_id = $env:GITHUB_RUN_ID
            executing_run_attempt = $env:GITHUB_RUN_ATTEMPT
            tested_source_sha = $source
            tested_development_head_sha = '88cd225c6c7284e3701ac67c547e574be259c2b0'
            original_run_id = 42277110326
            original_job_id = 128096155298
            original_workflow_conclusion = 'failure'
            original_artifact_id = 13537408890
            original_artifact_zip_expected_sha256 = '4381f0c378c40c7f172335abc1122cc043310621e962dd33f01c86a22b8403e0'
            original_artifact_zip_independently_hashed_by_this_job = $false
            planned_repetitions = 1
            cases_per_repetition = @(2, 1)
            original_native_deadline_ms = 90000
            original_submission_limit_ms = 40
            started_utc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'build-evidence/d3d-88cd-etw/identity.json' -Encoding utf8
      - name: Prepare the same native Windows display fixture
        shell: pwsh
        run: ./scripts/Set-CiDisplayResolution.ps1
      - name: Restore only the exact already compiled c303 cache
        id: replay_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            build/swirl-quick
            build/swirl-product
          key: apec-qt612-msvc-Windows-59b4e3306e3d2b0956c30227f2b07b0bad7a34b0c9b7b0d7abb39c76e370419d-082b4956bfe1f416398b268e050cb933a8b0b72160d0c2bec1827df3045f0f2c-c30304a9946b95de2563a978d1ce9538b6d61485
          fail-on-cache-miss: true
      - name: Require the exact cache key before any cached executable runs
        shell: pwsh
        env:
          SWIRL_REPLAY_CACHE_HIT: ${{ steps.replay_cache.outputs.cache-hit }}
          SWIRL_REPLAY_CACHE_KEY: ${{ steps.replay_cache.outputs.cache-matched-key }}
        run: |
          if ($env:SWIRL_REPLAY_CACHE_HIT -cne 'true' -or $env:SWIRL_REPLAY_CACHE_KEY -cne 'apec-qt612-msvc-Windows-59b4e3306e3d2b0956c30227f2b07b0bad7a34b0c9b7b0d7abb39c76e370419d-082b4956bfe1f416398b268e050cb933a8b0b72160d0c2bec1827df3045f0f2c-c30304a9946b95de2563a978d1ce9538b6d61485') { throw 'The immutable failed-source compiler cache is unavailable; no replay is admitted.' }
      - name: Read the original failed run's independent runtime inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '13537408890'
          run-id: '42277110326'
          repository: SOLHK/Swirl
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/swirl-88cd-original-engine
      - name: Admit exact cached bytes and reconstruct the clean old runtime
        id: replay_admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          function Replay-Hash([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Replay-PlainPath([string]$Path) {
            $current = [IO.Path]::GetFullPath($Path)
            while ($current) {
              if (Test-Path -LiteralPath $current) {
                if ((Get-Item -LiteralPath $current -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'A linked replay input or output is not admitted.' }
              }
              $parent = [IO.Path]::GetDirectoryName($current.TrimEnd('\', '/'))
              if ($parent -eq $current) { break }
              $current = $parent
            }
          }
          function Replay-RelativePath([string]$Relative, [string]$Root) {
            if ([string]::IsNullOrWhiteSpace($Relative) -or [IO.Path]::IsPathRooted($Relative) -or $Relative.Contains('\') -or $Relative.Contains(':')) { throw 'Invalid relative runtime path.' }
            foreach ($part in $Relative.Split('/')) {
              if ($part -in @('', '.', '..') -or $part -match '[. ]$' -or $part -match '^(?i:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)') { throw 'Ambiguous relative runtime path.' }
            }
            $target = [IO.Path]::GetFullPath((Join-Path $Root $Relative))
            if (-not $target.StartsWith($Root.TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Runtime path escapes its exact root.' }
            Replay-PlainPath $target
            return $target
          }
          $original = Join-Path $env:RUNNER_TEMP 'swirl-88cd-original-engine/build-evidence/d3d11-frame-latency'
          $manifestPath = Join-Path $original 'runtime-manifest.json'
          $receiptPath = Join-Path $original 'receipt.json'
          foreach ($path in @($manifestPath, $receiptPath)) { Replay-PlainPath $path }
          $manifestHash = Replay-Hash $manifestPath
          $receiptHash = Replay-Hash $receiptPath
          if ($manifestHash -cne 'e45ea84f0f4e1329496a99845a974904d03e5fdb303fd19b6335e82ddaff514f' -or $receiptHash -cne 'c2c4784c5e4d69185d22be325943b5a7fdf5bdc8997eb41ca24794ddbd4aa073') { throw 'Original runtime evidence differs from the separately downloaded failed-run artifact.' }
          $originalReceipt = Get-Content -LiteralPath $receiptPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($originalReceipt.sourceSha -cne 'c30304a9946b95de2563a978d1ce9538b6d61485' -or $originalReceipt.pullRequestHeadSha -cne '88cd225c6c7284e3701ac67c547e574be259c2b0' -or $originalReceipt.runId -cne '42277110326' -or $originalReceipt.status -cne 'failed' -or $originalReceipt.executableSha256 -cne 'befabbed6b8879228067a695cfe67350878aea40197ebb3ef2a7ed81f3103a37' -or $originalReceipt.qtCoreVersion -cne '6.12.0.0') { throw 'Original evidence does not identify the expected failed native source.' }
          foreach ($entry in $originalReceipt.sourceFileSha256.PSObject.Properties) {
            $sourcePath = Replay-RelativePath $entry.Name $env:GITHUB_WORKSPACE
            if ((Replay-Hash $sourcePath) -cne [string]$entry.Value) { throw 'Pinned diagnostic source differs from its original receipt.' }
          }
          $cache = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick/Release'))
          $runtime = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'replay-runtime-88cd'))
          Replay-PlainPath $cache
          Replay-PlainPath $runtime
          if (Test-Path -LiteralPath $runtime) { throw 'The fresh replay runtime already exists.' }
          New-Item -ItemType Directory -Path $runtime | Out-Null
          $excluded = @('Swirl-Settings-preview.png', 'Swirl-Inspector-preview.png', 'Swirl-input-diagnostics.txt', 'Swirl-diagnostics.txt', 'Swirl-Compact-preview.png', 'Swirl-Activity-preview.png', 'Swirl-Activity-200-preview.png')
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $omitted = [Collections.Generic.List[string]]::new()
          $copied = [Collections.Generic.List[object]]::new()
          $manifest = @(Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json)
          if ($manifest.Count -ne 1586) { throw 'Unexpected pinned runtime inventory length.' }
          foreach ($entry in $manifest) {
            if ($entry.path -ceq '.' -and $entry.kind -ceq 'directory') { continue }
            if (-not $seen.Add([string]$entry.path)) { throw 'Duplicate runtime path.' }
            $sourceFile = Replay-RelativePath ([string]$entry.path) $cache
            $targetFile = Replay-RelativePath ([string]$entry.path) $runtime
            if ($entry.kind -ceq 'directory') { New-Item -ItemType Directory -Path $targetFile -Force | Out-Null; continue }
            if ($entry.kind -cne 'file' -or [string]$entry.sha256 -cnotmatch '^[0-9a-f]{64}$' -or [long]$entry.bytes -lt 0) { throw 'Malformed pinned runtime file.' }
            if ($excluded -ccontains [string]$entry.path) { $omitted.Add([string]$entry.path); continue }
            if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) { throw "Pinned cached runtime file is missing: $($entry.path)" }
            $sourceItem = Get-Item -LiteralPath $sourceFile -Force
            if ($sourceItem.Length -ne [long]$entry.bytes -or (Replay-Hash $sourceFile) -cne [string]$entry.sha256) { throw "Pinned cached runtime bytes differ: $($entry.path)" }
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($targetFile)) -Force | Out-Null
            Copy-Item -LiteralPath $sourceFile -Destination $targetFile
            (Get-Item -LiteralPath $targetFile).LastWriteTimeUtc = $sourceItem.LastWriteTimeUtc
            if ((Get-Item -LiteralPath $targetFile).Length -ne [long]$entry.bytes -or (Replay-Hash $targetFile) -cne [string]$entry.sha256) { throw 'Copied replay runtime bytes differ from the admitted cache.' }
            $copied.Add([ordered]@{path=[string]$entry.path;bytes=[long]$entry.bytes;sha256=[string]$entry.sha256})
          }
          if ($copied.Count -ne 1511 -or $omitted.Count -ne 7 -or @(Compare-Object $excluded $omitted.ToArray() -CaseSensitive).Count) { throw 'The exact runtime inventory or explicit generated-output omissions changed.' }
          $rust = Get-Content -LiteralPath (Join-Path $runtime 'swirl-rust-build.json') -Raw -Encoding utf8 | ConvertFrom-Json
          if ($rust.source_sha -cne 'c30304a9946b95de2563a978d1ce9538b6d61485' -or $rust.build_id -cne '2c772cf3234a9f49a755572f270f450103937e537135bfe0b458d7c14ed3abe3' -or $rust.abi_version -ne 1 -or $rust.target -cne 'x86_64-pc-windows-msvc') { throw 'The admitted Rust identity does not match the failed source.' }
          . ./scripts/Assert-BuildSource.ps1
          Assert-SwirlBuildSource -RepositoryRoot $env:GITHUB_WORKSPACE -ExpectedSourceSha 'c30304a9946b95de2563a978d1ce9538b6d61485'
          Copy-Item -LiteralPath $receiptPath -Destination 'build-evidence/d3d-88cd-etw/original-failure-receipt.json'
          Copy-Item -LiteralPath $manifestPath -Destination 'build-evidence/d3d-88cd-etw/original-runtime-manifest.json'
          [ordered]@{
            schema=1; admitted=$true; tested_source_sha='c30304a9946b95de2563a978d1ce9538b6d61485'; executing_workflow_sha=$env:GITHUB_SHA
            original_manifest_sha256=$manifestHash; original_receipt_sha256=$receiptHash
            cache_key='apec-qt612-msvc-Windows-59b4e3306e3d2b0956c30227f2b07b0bad7a34b0c9b7b0d7abb39c76e370419d-082b4956bfe1f416398b268e050cb933a8b0b72160d0c2bec1827df3045f0f2c-c30304a9946b95de2563a978d1ce9538b6d61485'
            runtime_files_verified=$copied.Count; excluded_generated_outputs=$omitted.ToArray(); rust=$rust; source_file_sha256=$originalReceipt.sourceFileSha256
            compile_performed=$false; sdk_or_tls_redeployment_performed=$false; original_failure_retained=$true; replaces_critical_result=$false
            copied_files=$copied.ToArray()
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'build-evidence/d3d-88cd-etw/admission.json' -Encoding utf8
      - name: Checkout only the current independently identified ETW driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: diagnostic-driver
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/Test-PinnedD3D11Etw.ps1
            scripts/Test-PinnedD3D11EtwFilter.ps1
      - name: Collect one bounded trace of the unchanged old-source cases
        id: replay_cases
        shell: pwsh
        env:
          SWIRL_EXECUTING_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SWIRL_PINNED_D3D_ETW: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-driver'
          $driverSource = (& git -C $driver rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $driverSource -cne $env:GITHUB_SHA) { throw 'ETW driver checkout identity mismatch.' }
          & git -C $driver diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'ETW driver source was modified.' }
          & (Join-Path $driver 'scripts/Test-PinnedD3D11Etw.ps1') `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -RuntimeDirectory (Join-Path $env:GITHUB_WORKSPACE 'replay-runtime-88cd') `
            -ReferenceExecutable (Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick/Release/Swirl.exe') `
            -OriginalReceipt (Join-Path $env:GITHUB_WORKSPACE 'build-evidence/d3d-88cd-etw/original-failure-receipt.json') `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'build-evidence/d3d-88cd-etw/etw') `
            -ScratchRoot $env:RUNNER_TEMP `
            -ExecutingWorkflowSha $env:GITHUB_SHA `
            -ExecutingPrHeadSha $env:SWIRL_EXECUTING_PR_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The bounded old-source ETW experiment did not complete; inspect its separate trace/native statuses.' }
      - name: Record replay step outcomes even when admission or a case fails
        if: always()
        shell: pwsh
        env:
          SWIRL_REPLAY_IDENTITY: ${{ steps.replay_identity.outcome }}
          SWIRL_REPLAY_CACHE: ${{ steps.replay_cache.outcome }}
          SWIRL_REPLAY_ADMISSION: ${{ steps.replay_admission.outcome }}
          SWIRL_REPLAY_CASES: ${{ steps.replay_cases.outcome }}
        run: |
          New-Item -ItemType Directory -Path 'build-evidence/d3d-88cd-etw' -Force | Out-Null
          [ordered]@{
            schema=1; executing_workflow_sha=$env:GITHUB_SHA; tested_source_sha='c30304a9946b95de2563a978d1ce9538b6d61485'
            identity_step=$env:SWIRL_REPLAY_IDENTITY; cache_step=$env:SWIRL_REPLAY_CACHE
            admission_step=$env:SWIRL_REPLAY_ADMISSION; case_step=$env:SWIRL_REPLAY_CASES
            source_scope='Old source only; current-source critical UI and D3D gates remain independent.'
            finished_utc=[DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath 'build-evidence/d3d-88cd-etw/step-outcomes.json' -Encoding utf8
      - name: Preserve every old-source diagnostic result independently
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Pinned-88cd-D3D11-ETW-Diagnosis
          path: build-evidence/d3d-88cd-etw/
          if-no-files-found: error
          retention-days: 14

      - name: Check Qt Quick UI previews at multiple sizes and scales
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          New-Item -ItemType Directory -Force -Path preview-diagnostics | Out-Null
          Add-Type -AssemblyName System.Drawing
          # These are render/DPR sanity samples, not visual acceptance. Full page
          # continuity stays covered by swirl-all-pages; the user accepts DPI visuals.
          $previews = @(
            @{ file = "Swirl-Activity-preview.png"; page = "activity"; theme = "light"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-Activity-200-preview.png"; page = "activity"; theme = "light"; size = "1464x930"; scale = "2" },
            @{ file = "Swirl-Settings-preview.png"; page = "settings"; theme = "light"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-Inspector-preview.png"; page = "inspector"; theme = "dark"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-Compact-preview.png"; page = "overview"; theme = "light"; size = "800x560"; scale = "1" }
          )
          foreach ($preview in $previews) {
            # Offscreen Windows QPA uses DPR 1; QT_SCALE_FACTOR gives effective scale.
            $env:QT_SCALE_FACTOR = $preview.scale
            $path = Join-Path (Resolve-Path "dist").Path $preview.file
            $args = @("--capture-preview=$path", "--preview-page=$($preview.page)", "--preview-theme=$($preview.theme)", "--preview-size=$($preview.size)")
            if ($preview.bottom) { $args += "--preview-scroll-bottom" }
            $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru -NoNewWindow
            $diag = Join-Path (Resolve-Path "dist").Path "Swirl-diagnostics.txt"
            if (!(Test-Path $diag)) { throw "Missing Qt Quick preview diagnostics: $($preview.file)" }
            Copy-Item -LiteralPath $diag -Destination "preview-diagnostics/$($preview.file).log"
            if ($process.ExitCode -ne 0) {
              Get-Content $diag | Select-Object -Last 160
              throw "Qt Quick preview exited with $($process.ExitCode)"
            }
            # QtMsgType 1/2/3 are warning/critical/fatal. Preview exit 0 alone is insufficient.
            if (Select-String -LiteralPath $diag -Pattern '^[123]:') {
              Get-Content $diag
              throw "Qt Quick preview emitted warnings or errors: $($preview.file)"
            }
            if (!(Test-Path $path)) { throw "Missing screenshot: $path" }
            if ((Get-Item $path).Length -lt 2048) { throw "Screenshot is suspiciously small: $path" }
            $size = $preview.size.Split('x')
            $expectedWidth = [Math]::Round([int]$size[0] * [double]$preview.scale, [MidpointRounding]::AwayFromZero)
            $expectedHeight = [Math]::Round([int]$size[1] * [double]$preview.scale, [MidpointRounding]::AwayFromZero)
            $image = [System.Drawing.Image]::FromFile($path)
            try {
              if ($image.Width -ne $expectedWidth -or $image.Height -ne $expectedHeight) {
                throw "Unexpected preview DPI: $($image.Width)x$($image.Height), expected ${expectedWidth}x${expectedHeight}"
              }
            } finally { $image.Dispose() }
            Write-Host "Verified Qt screenshot: $path (${expectedWidth}x${expectedHeight})"
          }
          Remove-Item Env:QT_SCALE_FACTOR

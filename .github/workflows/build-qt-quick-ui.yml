      - name: Critical UI startup, rendering and interaction checks
        id: critical_ui
        shell: pwsh
        run: |
          $criticalEvidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence'
          New-Item -ItemType Directory -Force -Path $criticalEvidence | Out-Null
          $criticalUiJunit = Join-Path $criticalEvidence 'critical-ui.xml'
          $criticalNetworkJunit = Join-Path $criticalEvidence 'critical-network.xml'
          # Preserve the actual configured test inventory so the staged runs
          # can be audited for complete coverage without executing them twice.
          $inventoryJson = ctest --test-dir build/swirl-quick -C Release --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { throw 'Configured CTest inventory could not be read.' }
          $inventory = ($inventoryJson -join [Environment]::NewLine) | ConvertFrom-Json
          if ($null -eq $inventory.tests -or @($inventory.tests).Count -eq 0) { throw 'Configured CTest inventory is empty.' }
          [ordered]@{source_sha=$env:GITHUB_SHA; inventory=$inventory} | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath 'build-evidence/ctest-inventory.json' -Encoding utf8
          # Run affected UI checks before packaging. The remaining registered suite
          # runs after the test installer is uploaded; these names are excluded there
          # so a required check is never repeated just to change stage ordering.
          ctest --test-dir build/swirl-quick -C Release -R "^swirl-(appearance-ui|node-ui|node-ui-native-scaled|engine-ui|motion|apec-motion|apec-glass|hero|settings-material|navigation-ui|policy-ui|policy-configuration)$" --output-on-failure --no-tests=error --output-junit $criticalUiJunit
          $criticalUiExitCode = $LASTEXITCODE
          # Failure diagnostics rerun policy with the same output directory.
          # Preserve this first execution, including partial failure evidence,
          # before any later checks can throw or that diagnostic can overwrite it.
          $policyEvidence = Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick/policy-evidence'
          $criticalPolicyEvidence = Join-Path $criticalEvidence 'critical-policy-evidence'
          if (Test-Path -LiteralPath $criticalPolicyEvidence) { throw 'First-run policy evidence must have a fresh destination.' }
          if (Test-Path -LiteralPath $policyEvidence -PathType Container) {
            Copy-Item -LiteralPath $policyEvidence -Destination $criticalPolicyEvidence -Recurse -Force -ErrorAction Stop
          }
          if ($criticalUiExitCode -ne 0) {
            Get-Content build/swirl-quick/engine-contract.txt, build/swirl-quick/engine-real.txt -ErrorAction SilentlyContinue
            throw "Critical UI checks failed ($criticalUiExitCode)."
          }
          # Keep the original full-application policy driver and its 120ms
          # assertion before packaging; a standalone QML pass cannot replace it.
          [xml]$criticalUiReport = Get-Content -LiteralPath $criticalUiJunit -Raw
          foreach ($nodeCase in @('swirl-node-ui','swirl-node-ui-native-scaled')) {
            $cases = @($criticalUiReport.SelectNodes("//testcase[@name='$nodeCase']"))
            if ($cases.Count -ne 1 -or $cases[0].status -ne 'run' -or $cases[0].SelectNodes('failure|error|skipped').Count -ne 0) { throw "Required node rendering regression did not pass: $nodeCase" }
          }
          $policyCases = @($criticalUiReport.SelectNodes('//testcase[@name="swirl-policy-ui"]'))
          if ($policyCases.Count -ne 1 -or $policyCases[0].status -ne 'run' -or $policyCases[0].SelectNodes('failure|error|skipped').Count -ne 0) { throw 'The full-application policy regression must actually pass before packaging.' }
          if ($env:SWIRL_CI_NETWORK_CHANGE -eq 'true') {
            ctest --test-dir build/swirl-quick -C Release -R "^swirl-(native-tun-recovery|system-proxy-state|system-proxy-recovery|system-proxy-app-exit|system-proxy-normal-stop|node-real-chain|stream-regression|subscription-download|qt-network-policy|subscription-formats|import-subscription|import-boundaries|gateway-network)$" --output-on-failure --no-tests=error --output-junit $criticalNetworkJunit
            if ($LASTEXITCODE -ne 0) { throw "Critical network/security checks failed ($LASTEXITCODE)." }
            [xml]$markerReport = Get-Content -LiteralPath 'build/swirl-quick/swirl-native-tun-recovery.xml' -Raw
            if (@($markerReport.SelectNodes('//Incident') | Where-Object { $_.type -ne 'pass' }).Count) { throw 'TUN recovery markers contain skipped or failed native assertions.' }
            foreach ($required in @('absentKeyAndValueAreClearWithoutCreatingAnything','pendingAndConfirmedClearHaveStrictDwordValues','malformedMarkerIsUnknownAndMaintenanceDoesNotProceed','accessDeniedIsUnknownAndMaintenanceDoesNotProceed','facadeReportsRecoveryStateImmediately','inheritedPendingMarkerRejectsOrdinaryWorkerWithoutClearingOrRecovering','trustedPhysicalWorkerRetainsTheOtherSessionsPendingMarker','unknownMarkerRejectsEvenTrustedPhysicalWorkerWithoutClearingOrRecovering')) {
              if ($null -eq $markerReport.SelectSingleNode("/TestCase/TestFunction[@name='$required']/Incident[@type='pass']")) { throw "Required TUN recovery marker case did not pass: $required" }
            }
            if ($markerReport.SelectNodes('/TestCase/TestFunction[@name="malformedMarkerIsUnknownAndMaintenanceDoesNotProceed"]/Incident[@type="pass"]').Count -ne 8) { throw 'All eight malformed TUN marker cases must actually run.' }
            if ($markerReport.SelectNodes('/TestCase/TestFunction[@name="facadeReportsRecoveryStateImmediately"]/Incident[@type="pass"]').Count -ne 3) { throw 'All three initial TUN marker states must actually run.' }
            # A CTest suite-level pass must also have current native assertion
            # evidence. Missing rows or platform skips do not meet this gate.
            foreach ($suite in @('state','recovery','app-exit','normal-stop')) {
              $path = "build/swirl-quick/swirl-system-proxy-$suite.xml"
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing native proxy assertions: $suite" }
              [xml]$report = Get-Content -LiteralPath $path -Raw
              $functions = @($report.SelectNodes('/TestCase/TestFunction'))
              $incidents = @($report.SelectNodes('//Incident'))
              if ($functions.Count -eq 0 -or $incidents.Count -eq 0 -or @($incidents | Where-Object { $_.type -ne 'pass' }).Count -gt 0) { throw "Native proxy $suite contains missing, skipped or failed assertions." }
              if ($suite -eq 'recovery') {
                $pac = @($report.SelectNodes('/TestCase/TestFunction[@name="takeoverRestoresPacAndCustomBypass"]/Incident[@type="pass"]/DataTag'))
                $tags = @($pac | ForEach-Object { $_.InnerText })
                if ($tags.Count -ne 2 -or 'pac-only' -notin $tags -or 'manual-and-pac' -notin $tags) { throw 'Both PAC/bypass restore cases must actually run.' }
                foreach ($required in @('abruptOwnerExit','abruptEngineExit','registryOnlyExternalEdit','restoreDistinctStoresAndAbsentValues','takeoverUsesActualRustCoreListenerAndRestoresExactly')) {
                  if ($null -eq $report.SelectSingleNode("/TestCase/TestFunction[@name='$required']/Incident[@type='pass']")) { throw "Required native proxy recovery case did not pass: $required" }
                }
              }
              if ($suite -eq 'app-exit') {
                if ($null -eq $report.SelectSingleNode('/TestCase/TestFunction[@name="listenerProbeDistinguishesClosedAndLivePorts"]/Incident[@type="pass"]')) { throw 'The native closed/live listener probe controls did not pass.' }
                function Assert-NativeTcpState($tcp, [bool]$expectedListener, [string]$label) {
                  $observedListener = $false
                  foreach ($entry in @(@{key='ipv4'; family=2}, @{key='ipv6'; family=23})) {
                    $table = $tcp.($entry.key)
                    if ($null -eq $table -or $table.family -ne $entry.family -or $table.win32_error -ne 0 -or $table.rows -isnot [array]) {
                      throw "Native TCP state was not read successfully: $label/$($entry.key)"
                    }
                    foreach ($row in $table.rows) {
                      if ($row.state -notin (1..12) -or $null -eq $row.pid -or $row.pid -lt 0) { throw "Invalid native TCP row: $label" }
                      if ($row.state -eq 2) { $observedListener = $true } # MIB_TCP_STATE_LISTEN
                    }
                  }
                  if ($observedListener -ne $expectedListener) { throw "Unexpected native listener state: $label" }
                }
                function Assert-ExclusivePortOccupied($probe, [string]$label) {
                  if ($null -eq $probe -or $probe.exclusive_option -isnot [bool] -or -not $probe.exclusive_option -or
                      $probe.bound -isnot [bool] -or $probe.bound -or $probe.listening -isnot [bool] -or $probe.listening -or
                      $probe.stage -cne 'bind' -or $probe.win32_error -notin @(10048,10013)) {
                    throw "The exclusive probe did not reject a live listener: $label"
                  }
                }
                function Assert-NativeListenerReleased($connection, $tcp, $exclusive, [string]$label) {
                  # A connect deadline is only an observation. A known-closed
                  # native control also remained Connecting after 3000 ms.
                  # Require positive kernel ownership evidence for this port.
                  if ($null -eq $connection -or $connection.connected -isnot [bool] -or $connection.connected) {
                    throw "The post-exit connection observation is missing or connected: $label"
                  }
                  Assert-NativeTcpState $tcp $false $label
                  if ($null -eq $exclusive -or $exclusive.exclusive_option -isnot [bool] -or -not $exclusive.exclusive_option -or
                      $exclusive.bound -isnot [bool] -or -not $exclusive.bound -or
                      $exclusive.listening -isnot [bool] -or -not $exclusive.listening -or
                      $exclusive.stage -cne 'listening' -or $exclusive.win32_error -ne 0) {
                    throw "The released port was not exclusively bound and listened on: $label"
                  }
                }
                $controlsPath = 'build/swirl-quick/system-proxy-exit/listener-probe-controls.json'
                if (-not (Test-Path -LiteralPath $controlsPath -PathType Leaf)) { throw 'Missing native listener probe control evidence.' }
                $controls = Get-Content -LiteralPath $controlsPath -Raw | ConvertFrom-Json
                if ($controls.schema -ne 1 -or $controls.source_sha -cne $env:GITHUB_SHA -or $controls.success -isnot [bool] -or -not $controls.success) { throw 'The native listener probe controls have invalid source identity or outcome.' }
                $legacy = $controls.legacy.closed
                if ($null -eq $legacy -or $legacy.deadline_ms -ne 1500 -or $legacy.finished -isnot [bool] -or $legacy.predicate_result -isnot [bool]) { throw 'Missing the original listener-probe observation on a known-closed native port.' }
                Assert-NativeListenerReleased $controls.current.closed $controls.current.closed_tcp_state $controls.current.closed_exclusive_rebind 'closed fixture'
                $live = $controls.current.live
                if ($null -eq $live -or $live.connected -isnot [bool] -or -not $live.connected -or
                    $live.terminal_observed -isnot [bool] -or -not $live.terminal_observed -or
                    $live.refused -isnot [bool] -or $live.refused -or $live.outcome -cne 'connected') { throw 'The native listener probe did not reject a genuinely live listener.' }
                Assert-ExclusivePortOccupied $controls.current.live_exclusive_probe 'live fixture'
                Assert-NativeTcpState $controls.current.live_tcp_state $true 'live fixture'
                if ($controls.current.live_native_listener_observed -isnot [bool] -or -not $controls.current.live_native_listener_observed) { throw 'The TCP state query did not detect the live native control.' }
                foreach ($required in @('ownedSnapshotDistinguishesEmptyPacFromAbsentRegistry','exclusiveListenerProbeRequiresReleasedPortAfterTraffic')) {
                  if ($null -eq $report.SelectSingleNode("/TestCase/TestFunction[@name='$required']/Incident[@type='pass']")) { throw "Required native exit control did not pass: $required" }
                }
                $rows = @($report.SelectNodes('/TestCase/TestFunction[@name="normalApplicationExitRestoresOwnedProxy"]/Incident[@type="pass"]/DataTag'))
                $tags = @($rows | ForEach-Object { $_.InnerText })
                $requiredTags = @('pac-only','manual-and-pac','pac-only-external-edit','manual-and-pac-external-edit','pac-only-lock-contention','pac-only-lock-contention-repeat-2','pac-only-lock-contention-repeat-3','pac-only-lock-contention-repeat-4','pac-only-lock-contention-repeat-5')
                if ($tags.Count -ne $requiredTags.Count -or @($requiredTags | Where-Object { $_ -notin $tags }).Count -gt 0) { throw 'All native application exit, external-edit and release-contention data rows must actually run.' }
                foreach ($tag in $requiredTags) {
                  $requiredStages = @('ready','final','result')
                  if ($tag.StartsWith('pac-only-lock-contention')) { $requiredStages += 'waiting' }
                  foreach ($stage in $requiredStages) {
                    $receipt = "build/swirl-quick/system-proxy-exit/$tag-$stage.json"
                    if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw "Missing native application exit receipt: $tag/$stage" }
                    $data = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
                    if ($data.schema -ne 1 -or $data.source_sha -cne $env:GITHUB_SHA) { throw "Native application exit receipt has the wrong source identity: $tag/$stage" }
                    if ($stage -eq 'final') {
                      foreach ($key in @('close_reply_write_succeeded','close_after_control_disconnect')) {
                        if ($data.$key -isnot [bool] -or -not $data.$key) { throw "Native close-control delivery evidence is incomplete: $tag/$key" }
                      }
                    }
                    if ($stage -eq 'result' -and ($data.success -isnot [bool] -or -not $data.success)) { throw "Native application exit result did not pass: $tag" }
                    if ($stage -eq 'result') {
                      Assert-NativeListenerReleased $data.listener_probe $data.tcp_state_after_exit $data.exclusive_rebind_after_exit $tag
                      Assert-ExclusivePortOccupied $data.live_listener_exclusive_probe $tag
                      foreach ($key in @('close_acknowledged','listener_closed','tcp_tables_readable','no_listening_socket')) {
                        if ($data.$key -isnot [bool] -or -not $data.$key) { throw "Native listener release evidence is incomplete: $tag/$key" }
                      }
                      if ($data.journal_absent_after_exit -isnot [bool] -or -not $data.journal_absent_after_exit -or
                          $null -eq $data.guard_marker_count_after_exit -or $data.guard_marker_count_after_exit -ne 0) {
                        throw "Native journal or guard marker cleanup is incomplete: $tag"
                      }
                    }
                    if ($stage -eq 'waiting') {
                      if ($data.phase -cne 'release-waiting') { throw 'Native release-contention evidence has the wrong phase.' }
                      foreach ($key in @('native_backend','ready','close_requested','proxy_owned','proxy_busy','runtime_alive','runtime_healthy','journal_present')) {
                        if ($data.$key -isnot [bool] -or -not $data.$key) { throw "Native release-contention evidence is incomplete: $key" }
                      }
                      if ($data.fixture_failed -isnot [bool] -or $data.fixture_failed) { throw 'Native release-contention fixture failed.' }
                    }
                  }
                }
              }
              if ($suite -eq 'normal-stop') {
                $rows = @($report.SelectNodes('/TestCase/TestFunction[@name="normalStopRestoresOwnedProxyWhileApplicationRemainsAlive"]/Incident[@type="pass"]/DataTag'))
                $tags = @($rows | ForEach-Object { $_.InnerText })
                $requiredTags = @('pac-only','manual-and-pac','pac-only-external-edit','manual-and-pac-external-edit','pac-only-lock-contention','pac-only-lock-timeout-retry')
                if ($tags.Count -ne $requiredTags.Count -or @($requiredTags | Where-Object { $_ -notin $tags }).Count -gt 0) { throw 'All six native normal-stop cases must actually pass with the application still alive.' }
                foreach ($tag in $requiredTags) {
                  $requiredStages = @('ready','stopped','final','result')
                  if ($tag -in @('pac-only-lock-contention','pac-only-lock-timeout-retry')) { $requiredStages += 'waiting' }
                  if ($tag -eq 'pac-only-lock-timeout-retry') { $requiredStages += 'failed' }
                  foreach ($stage in $requiredStages) {
                    $receipt = "build/swirl-quick/system-proxy-normal-stop/$tag-$stage.json"
                    if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw "Missing native normal-stop receipt: $tag/$stage" }
                    $data = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
                    if ($data.schema -ne 1 -or $data.source_sha -cne $env:GITHUB_SHA) { throw "Native normal-stop receipt has the wrong source identity: $tag/$stage" }
                    if ($stage -eq 'final') {
                      foreach ($key in @('close_reply_write_succeeded','close_after_control_disconnect')) {
                        if ($data.$key -isnot [bool] -or -not $data.$key) { throw "Native close-control delivery evidence is incomplete: $tag/$key" }
                      }
                    }
                    if ($stage -eq 'result') {
                      foreach ($key in @('success','http_roundtrip','socks5_roundtrip','child_normal_exit','close_acknowledged','exact_stop_snapshot','exact_exit_snapshot','winhttp_unchanged','runner_original_restored','app_alive_after_stop','app_alive_after_listener_checks','normal_stop_completed','journal_absent_after_stop','listener_closed','tcp_tables_readable','no_listening_socket')) {
                        if ($data.$key -isnot [bool] -or -not $data.$key) { throw "Native normal-stop result is incomplete: $tag/$key" }
                      }
                      if ($data.child_exit_code -ne 0 -or $null -eq $data.guard_marker_count_after_stop -or $data.guard_marker_count_after_stop -ne 0) { throw "Normal-stop process or guard cleanup failed: $tag" }
                      Assert-NativeListenerReleased $data.listener_probe $data.tcp_state_after_stop $data.exclusive_rebind_after_stop $tag
                      Assert-ExclusivePortOccupied $data.live_listener_exclusive_probe $tag
                      if ($tag -in @('pac-only-lock-contention','pac-only-lock-timeout-retry')) {
                        foreach ($key in @('pending_http_roundtrip','pending_socks5_roundtrip','same_runtime_epoch_while_pending')) {
                          if ($data.$key -isnot [bool] -or -not $data.$key) { throw "The same Rust runtime did not serve real traffic while release was pending: $tag/$key" }
                        }
                      }
                      if ($tag -eq 'pac-only-lock-timeout-retry') {
                        foreach ($key in @('failed_http_roundtrip','failed_socks5_roundtrip','same_runtime_epoch_while_failed')) {
                          if ($data.$key -isnot [bool] -or -not $data.$key) { throw "The same Rust runtime did not survive an actual release timeout: $tag/$key" }
                        }
                        if ($null -eq $data.release_timeout_elapsed_ms -or $data.release_timeout_elapsed_ms -lt 2000) { throw 'The native normal-stop test did not observe the actual two-second release deadline.' }
                      }
                    }
                    if ($stage -in @('waiting','failed','stopped')) {
                      foreach ($key in @('native_backend','ready')) {
                        if ($data.$key -isnot [bool] -or -not $data.$key) { throw "Normal-stop fixture identity is incomplete: $tag/$stage/$key" }
                      }
                      if ($data.close_requested -isnot [bool] -or $data.close_requested -or $data.fixture_failed -isnot [bool] -or $data.fixture_failed) { throw "The application closed or fixture failed before normal-stop verification: $tag/$stage" }
                    }
                    if ($stage -in @('waiting','failed')) {
                      foreach ($key in @('proxy_owned','runtime_alive','runtime_healthy','journal_present')) {
                        if ($data.$key -isnot [bool] -or -not $data.$key) { throw "The owned listener was not retained during normal-stop release: $tag/$stage/$key" }
                      }
                      $expectedPhase = if ($stage -eq 'waiting') { 'normal-stop-waiting' } else { 'normal-stop-failed' }
                      if ($data.phase -cne $expectedPhase -or $data.proxy_busy -isnot [bool] -or $data.proxy_busy -ne ($stage -eq 'waiting')) { throw "Normal-stop release has the wrong pending/failure state: $tag/$stage" }
                    }
                    if ($stage -eq 'stopped') {
                      if ($data.phase -cne 'normal-stopped') { throw "Missing ordinary stop completion: $tag" }
                      foreach ($key in @('proxy_owned','proxy_busy','runtime_alive')) {
                        if ($data.$key -isnot [bool] -or $data.$key) { throw "Normal-stop did not release proxy and Core: $tag/$key" }
                      }
                    }
                  }
                }
              }
            }
          }
      - name: Preserve node probe regression after an early UI failure
        if: ${{ !cancelled() && steps.critical_ui.outcome == 'failure' }}
        shell: pwsh
        run: |
          # An early UI failure otherwise prevents the changed DNS/probe and
          # section-model assertions from running. Keep the failed gate failed,
          # but collect these independent results without repeating a suite
          # that the normal critical-network stage has already executed.
          if (Test-Path -LiteralPath 'build-evidence/critical-network.xml') {
            Write-Host 'The normal critical-network stage already ran; retain its original results.'
            exit 0
          }
          $junit = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/node-diagnostic-regression.xml'
          ctest --test-dir build/swirl-quick -C Release -R '^swirl-(node-real-chain|node-section-model|native-tun-recovery)$' --output-on-failure --no-tests=error --output-junit $junit
          $testExit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $junit -PathType Leaf)) { throw 'Independent node regression evidence is missing.' }
          if ($testExit -ne 0) { throw "Independent node diagnostic regression failed ($testExit)." }
          [xml]$report = Get-Content -LiteralPath $junit -Raw
          foreach ($name in @('swirl-node-real-chain','swirl-node-section-model','swirl-native-tun-recovery')) {
            $cases = @($report.SelectNodes("//testcase[@name='$name']"))
            if ($cases.Count -ne 1 -or $cases[0].status -ne 'run' -or $cases[0].SelectNodes('failure|error|skipped').Count -ne 0) { throw "Independent node regression did not execute successfully: $name" }
          }
      - name: Upload current node regression evidence before production builds

name: Build Swirl Qt Quick UI (Preview)

on:
  push:
    branches: [main, test, work/swirl-apec-v3-20261027]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '1'
  SWIRL_QT_VERSION: '6.12.0'

concurrency:
  group: swirl-quick-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Finish the current verified stage so first-time Qt compilation can save its
  # cache and installer evidence before the next stage starts.
  cancel-in-progress: false

jobs:
  build-qt-ui:
    runs-on: windows-2022
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout original repository and UI branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify changes for full regression scope
        id: ci_scope
        shell: pwsh
        env:
          SWIRL_EVENT_NAME: ${{ github.event_name }}
          SWIRL_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          $base = $env:SWIRL_BASE_SHA
          if ($env:SWIRL_EVENT_NAME -eq 'workflow_dispatch' -or [string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            "SWIRL_CI_UI_ONLY=false" >> $env:GITHUB_ENV
            "SWIRL_CI_NETWORK_CHANGE=true" >> $env:GITHUB_ENV
            Write-Host 'Full regression scope: explicit/manual or initial run.'
            exit 0
          }
          git cat-file -e "$base^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags --depth=1 origin $base
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the event base commit; refusing to narrow test scope.' }
          }
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -eq 0) { throw 'Unable to determine changed files; refusing to narrow test scope.' }
          $nonUi = @($changed | Where-Object { $_ -notmatch '^(src/Swirl\.Quick/qml/|src/Swirl\.Quick/tests/(ApecMotionChecks|ApecGlassChecks|AppearanceChecks|HeroChecks|NavigationChecks|UiQualityChecks|WindowChecks|OverviewChecks)\.(cpp|h)$|AGENTS\.md$)' })
          $uiOnly = $nonUi.Count -eq 0
          "SWIRL_CI_UI_ONLY=$($uiOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "SWIRL_CI_NETWORK_CHANGE=$((!$uiOnly).ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if ($uiOnly) { Write-Host "UI-only change set ($($changed.Count) files); retain critical UI/package checks and defer unrelated network integration tests." }
          else {
            Write-Host "Core, network, security, build, or mixed change set ($($changed.Count) files); require focused network/security tests and full regression."
          }
      - name: Validate scoped Codex proxy launcher
        shell: pwsh
        run: ./tools/tests/Test-CodexProxyLauncher.ps1
      - name: Check cloud-knot path geometry from the production JavaScript
        run: node scripts/tests/Test-CloudKnotGeometry.cjs
      - name: Prepare supported native Windows display for UI checks
        shell: pwsh
        run: ./scripts/Set-CiDisplayResolution.ps1
      - name: Install Rust MSVC tools
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-qt-sdk.txt
            tools/requirements-network-fixtures.txt
            tools/requirements-font-tests.txt
      - name: Install SDK downloader and independent certificate fixtures
        run: python -m pip install -r tools/requirements-qt-sdk.txt -r tools/requirements-network-fixtures.txt -r tools/requirements-font-tests.txt
      - name: Verify canonical brand assets and all six variants
        run: python tools/Generate-BrandAssets.py --check
      - name: Check SDK archive and metadata filesystem boundaries
        shell: pwsh
        run: python tools/tests/test_qt_sdk_installer.py --scratch-root "$env:RUNNER_TEMP/swirl-sdk-installer-tests"
      - name: Check pinned TLS source and fixed package boundaries
        shell: pwsh
        run: |
          python tools/tests/test_openssl_runtime.py --scratch-root "$env:RUNNER_TEMP/swirl-openssl-boundary-tests"
          if ($LASTEXITCODE -ne 0) { throw 'TLS source/receipt boundary checks failed.' }
          ./scripts/tests/Test-RustProductPackagePolicy.ps1
      - name: Check package path policy with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/Test-RustProductPackagePolicy.ps1
      - name: Restore isolated Qt 6.12 SDK archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-qt-6.12.0
          key: qt-sdk-${{ runner.os }}-6.12.0-msvc2022-${{ hashFiles('tools/Install-QtSdk.py', 'tools/requirements-qt-sdk.txt') }}
      - name: Install and verify the official Qt 6.12 MSVC SDK
        shell: pwsh
        run: |
          # Qt 6.12 moved archives into architecture-specific metadata directories.
          # The checked-in downloader verifies the official metadata/archive SHA256s.
          $sdkOutput = Join-Path $env:RUNNER_TEMP 'swirl-qt-6.12.0'
          python tools/Install-QtSdk.py --version $env:SWIRL_QT_VERSION --arch win64_msvc2022_64 --output $sdkOutput
          if ($LASTEXITCODE -ne 0) { throw 'Official Qt SDK installation failed.' }
          $sdk = Get-Content -LiteralPath (Join-Path $sdkOutput 'sdk-install-result.json') -Raw | ConvertFrom-Json
          $qtRoot = (Resolve-Path -LiteralPath $sdk.kit_root).Path
          $version = (& (Join-Path $qtRoot 'bin/qmake.exe') -query QT_VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne $env:SWIRL_QT_VERSION -or $sdk.arch -ne 'win64_msvc2022_64') { throw 'Unexpected Qt version or ABI.' }
          foreach ($component in @('Qt6GuiPrivate', 'Qt6ShaderTools', 'Qt6QuickControls2', 'Qt6Svg', 'Qt6Network')) {
            if (-not (Test-Path -LiteralPath (Join-Path $qtRoot "lib/cmake/$component/${component}Config.cmake"))) { throw "Missing Qt component: $component" }
          }
          "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          (Join-Path $qtRoot 'bin') >> $env:GITHUB_PATH
          $isolatedRoot = Join-Path $env:RUNNER_TEMP 'swirl-apec-ui-isolated'
          New-Item -ItemType Directory -Force -Path $isolatedRoot | Out-Null
          "SWIRL_TEST_ROOT=$isolatedRoot" >> $env:GITHUB_ENV
          $fontFixtures = Join-Path $env:RUNNER_TEMP 'swirl-apec-font-metadata'
          python src/Swirl.Quick/tests/generate_font_metadata_fixtures.py $fontFixtures
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $fontFixtures 'automation.ttf'))) { throw 'Synthetic font fixture generation failed.' }
          "SWIRL_FONT_METADATA_FIXTURES=$fontFixtures" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path build-evidence | Out-Null
          Copy-Item -LiteralPath (Join-Path $sdkOutput 'sdk-install-result.json') -Destination build-evidence/qt-sdk.json
      - name: Record compiler cache identity
        id: compiler
        shell: pwsh
        run: |
          $tools = @('cl.exe','link.exe','cmake.exe') | ForEach-Object { (Get-FileHash -LiteralPath (Get-Command $_ -ErrorAction Stop).Source -Algorithm SHA256).Hash }
          $identity = ([ordered]@{rust=(& rustc -vV | Out-String); tools=$tools; msvc=$env:VCToolsVersion; sdk=$env:WindowsSDKVersion; qt=$env:QT_ROOT_DIR; workspace=$env:GITHUB_WORKSPACE} | ConvertTo-Json -Compress)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          $identity | Set-Content -LiteralPath build-evidence/compiler.json -Encoding utf8
      - name: Record native TLS runtime build tools
        id: tls_tools
        shell: pwsh
        run: ./scripts/Build-CiOpenSslRuntime.ps1 -OutputDirectory "$env:RUNNER_TEMP/swirl-openssl-3.5.9" -PrepareOnly -GitHubEnvironment
      - name: Restore source-verified OpenSSL runtime
        id: tls_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-openssl-3.5.9
          key: openssl-${{ runner.os }}-${{ steps.tls_tools.outputs.identity }}-${{ hashFiles('tools/Build-OpenSslRuntime.py', 'tools/openssl-runtime.lock.json') }}
      - name: Build or verify pinned OpenSSL runtime
        shell: pwsh
        run: ./scripts/Build-CiOpenSslRuntime.ps1 -OutputDirectory "$env:RUNNER_TEMP/swirl-openssl-3.5.9" -GitHubEnvironment
      - name: Save verified TLS compiler outputs before downstream checks
        if: steps.tls_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-openssl-3.5.9
          key: ${{ steps.tls_cache.outputs.cache-primary-key }}
      - name: Restore Qt 6.12 compiler outputs
        id: build_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            build/swirl-quick
            build/swirl-product
          key: apec-qt612-msvc-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            apec-qt612-msvc-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-
      - name: Restore content-verified input timestamps
        shell: pwsh
        run: |
          . ./scripts/BuildInputTimes.ps1
          Sync-SwirlBuildInputTimes -RepositoryRoot $env:GITHUB_WORKSPACE -BuildDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick') -Restore
      - name: Discard restored test evidence before compiling this checkout
        shell: pwsh
        run: |
          # Compiler caches can include captures and logs from their source run.
          # Clear these before configure/build, so even a compiler failure cannot
          # upload old tests as evidence for the current source identity.
          foreach ($directory in @('hero-evidence','navigation-evidence','settings-material-evidence','policy-evidence','activity-layout','liquid-glass-evidence')) {
            Remove-Item -LiteralPath (Join-Path 'build/swirl-quick' $directory) -Recurse -Force -ErrorAction SilentlyContinue
          }
          foreach ($file in @('Testing/Temporary/LastTest.log','engine-contract.txt','engine-real.txt','node-chain.txt','import-subscription.txt','native-engine.txt','stream-regression.txt','subscription-formats.txt')) {
            Remove-Item -LiteralPath (Join-Path 'build/swirl-quick' $file) -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -Path 'build/swirl-quick/*-report.json','build/swirl-quick/activity-feather-*.png','build/swirl-quick/Release/Swirl-*.txt' -File -ErrorAction SilentlyContinue | Remove-Item -Force
      - name: Configure Qt UI independently
        shell: pwsh
        run: |
          $configureArgs = @(
            '-S', 'src/Swirl.Quick', '-B', 'build/swirl-quick',
            '-G', 'Visual Studio 17 2022', '-A', 'x64',
            '-DSWIRL_BUILD_UI_TESTS=ON',
            "-DSWIRL_RUST_TARGET=$env:GITHUB_WORKSPACE/core/target",
            "-DSWIRL_TEST_FONT_DIRECTORY=$env:GITHUB_WORKSPACE/build/swirl-quick/Release/lib/fonts"
          )
          if ($env:SWIRL_CI_NETWORK_CHANGE -eq 'true') {
            # Enable CMake registration without leaking this opt-in into other
            # application tests, which exercise the proxy UI in an isolated fake.
            cmake -E env SWIRL_SYSTEM_PROXY_TEST=1 cmake @configureArgs
          } else {
            cmake @configureArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'Qt UI configuration failed.' }
      - name: Build UI
        id: ui_build
        shell: pwsh
        run: cmake --build build/swirl-quick --config Release --parallel 4
      - name: Bundle UI runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/swirl-quick/Release/Swirl.exe dist/
            Copy-Item build/swirl-quick/Release/Swirl-brand-0217-optical.ico dist/
            python tools/Verify-WindowsIconResources.py --exe dist/Swirl.exe --ico dist/Swirl-brand-0217-optical.ico --output build-evidence/ui-icon-resources.json
            if ($LASTEXITCODE -ne 0) { throw 'The deployed UI icon resources do not match all native ICO frames.' }
          Copy-Item build/swirl-quick/Release/swirl_api.dll,build/swirl-quick/Release/swirl-rust-build.json dist/
          Copy-Item build/swirl-quick/Release/SwirlProxyGuard.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlGatewayGuard.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlScriptRunner.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlCodexLauncher.exe dist/
          Copy-Item tools/SwirlCodexManage.py,tools/SubscriptionCapture.py dist/
          # Copy files into the existing cache directory, never the directory
          # itself into another directory of the same name on a warm build.
          $ruleFiles = Get-ChildItem -LiteralPath 'src/Swirl.Quick/packaging/rules' -File
          foreach ($ruleTarget in @('dist/rules', 'build/swirl-quick/Release/rules')) {
            New-Item -ItemType Directory -Force -Path $ruleTarget | Out-Null
            foreach ($ruleFile in $ruleFiles) {
              $targetFile = Join-Path $ruleTarget $ruleFile.Name
              Copy-Item -LiteralPath $ruleFile.FullName -Destination $targetFile -Force
              if ((Get-FileHash -LiteralPath $targetFile -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $ruleFile.FullName -Algorithm SHA256).Hash) { throw 'Staged rule file differs from the source.' }
            }
          }
          # Qt 6.12 deploys only the Windows QPA plugin by default. The isolated
          # screenshot/input drivers also need offscreen; production staging
          # remains separate and uses the native Windows plugin.
          ./scripts/Copy-VerifiedOpenSslRuntime.ps1 -OpenSslRoot $env:SWIRL_OPENSSL_ROOT -ApplicationDirectory dist -Target VC-WIN64A
          windeployqt --release --openssl-root $env:SWIRL_OPENSSL_ROOT --include-plugins qoffscreen,qopensslbackend --qmldir src/Swirl.Quick/qml dist/Swirl.exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath 'dist/platforms/qoffscreen.dll')) { throw 'The isolated offscreen test runtime is incomplete.' }
          # CTest executes these binaries in the build directory, not dist.
          ./scripts/Copy-VerifiedOpenSslRuntime.ps1 -OpenSslRoot $env:SWIRL_OPENSSL_ROOT -ApplicationDirectory build/swirl-quick/Release -Target VC-WIN64A
          windeployqt --release --openssl-root $env:SWIRL_OPENSSL_ROOT --include-plugins qoffscreen,qopensslbackend --qmldir src/Swirl.Quick/qml build/swirl-quick/Release/Swirl.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt test runtime deployment failed.' }
          & dist/Swirl.exe --tls-runtime-self-test build-evidence/ui-tls-runtime.json
          if ($LASTEXITCODE -ne 0) { throw 'The bundled UI TLS runtime is incomplete or borrowed from PATH.' }
      # Qt's offscreen QPA font database reads appdir/lib/fonts and does not
      # automatically discover the fonts installed on a Windows CI runner.
      # These fixtures are used for synthetic screenshot tests ONLY.
      - name: Stage temporary offscreen screenshot fonts
        shell: pwsh
        run: |
          $fontDir = Join-Path (Resolve-Path "dist").Path "lib/fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          $latin = @("$env:WINDIR/Fonts/segoeui.ttf", "$env:WINDIR/Fonts/arial.ttf") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$latin) { throw "No Latin fallback font found on the Windows runner." }
          Copy-Item -LiteralPath $latin -Destination $fontDir
          # Noto Sans SC is licensed under SIL OFL 1.1 and contains both
          # Simplified Chinese and Latin glyphs. Pin the source revision.
          $notoUrl = "https://raw.githubusercontent.com/google/fonts/bd8f81ddb5c74d5c8897b36ad88b440266245103/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          $notoFile = Join-Path $fontDir "NotoSansSC-VF.ttf"
          Invoke-WebRequest -Uri $notoUrl -OutFile $notoFile -ErrorAction Stop
          if ((Get-Item $notoFile).Length -lt 10000000) { throw "Noto Sans SC fixture download is incomplete." }
          Write-Host "Qt offscreen font fixtures ready; they will NOT be included in the artifact."
          # CTest launches Swirl from the build directory, separate from dist.
          $testFontDir = 'build/swirl-quick/Release/lib/fonts'
          New-Item -ItemType Directory -Force -Path $testFontDir | Out-Null
          Get-ChildItem -LiteralPath $fontDir -File | Copy-Item -Destination $testFontDir -Force
      - name: Critical UI startup, rendering and interaction checks
        shell: pwsh
        run: |
          # Run affected UI checks before packaging. The remaining registered suite
          # runs after the test installer is uploaded; these names are excluded there
          # so a required check is never repeated just to change stage ordering.
          ctest --test-dir build/swirl-quick -C Release -R "^swirl-(appearance-ui|node-ui|engine-ui|motion|apec-motion|apec-glass|hero|settings-material|navigation-ui)$" --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) {
            Get-Content build/swirl-quick/engine-contract.txt, build/swirl-quick/engine-real.txt -ErrorAction SilentlyContinue
            throw "Critical UI checks failed"
          }
          if ($env:SWIRL_CI_NETWORK_CHANGE -eq 'true') {
            ctest --test-dir build/swirl-quick -C Release -R "^swirl-(system-proxy-state|system-proxy-recovery|node-real-chain|stream-regression|subscription-download|qt-network-policy|subscription-formats|import-subscription|import-boundaries|gateway-network)$" --output-on-failure --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw "Critical network/security checks failed ($LASTEXITCODE)." }
          }
      - name: Overview input checks against deployed Qt runtime
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--interaction-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            Get-Content "dist/Swirl-diagnostics.txt" -ErrorAction SilentlyContinue
            throw "Overview input checks failed: $($process.ExitCode)"
          }
      - name: Loopback HTTP capture checks against deployed Qt runtime
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--capture-self-test" -Wait -PassThru -NoNewWindow
          if (Test-Path -LiteralPath 'dist/Swirl-diagnostics.txt') {
            Copy-Item -LiteralPath 'dist/Swirl-diagnostics.txt' -Destination 'build-evidence/capture-self-test.log'
            Select-String -LiteralPath 'build-evidence/capture-self-test.log' -Pattern 'CAPTURE_TLS_RUNTIME|CAPTURE_TLS_CONTROL_ERROR|Capture integration checks' | ForEach-Object Line
          }
          if ($process.ExitCode -ne 0) {
            Get-Content "dist/Swirl-diagnostics.txt" -ErrorAction SilentlyContinue
            throw "HTTP capture checks failed: $($process.ExitCode)"
          }
      - name: Startup and all-pages smoke against deployed Qt runtime
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          # GUI-subsystem executables return immediately from PowerShell's '&' invocation.
          # Explicitly wait for the real Qt process so smoke tests cannot false-pass.
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            $diag = Join-Path (Resolve-Path "dist").Path "Swirl-diagnostics.txt"
            if (Test-Path $diag) { Get-Content $diag | Select-Object -Last 160 }
            throw "Qt Quick startup failed: $($process.ExitCode)"
          }
      - name: Check Qt Quick UI previews at multiple sizes and scales
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          New-Item -ItemType Directory -Force -Path preview-diagnostics | Out-Null
          Add-Type -AssemblyName System.Drawing
          # These are render/DPR sanity samples, not visual acceptance. Full page
          # continuity stays covered by swirl-all-pages; the user accepts DPI visuals.
          $previews = @(
            @{ file = "Swirl-Activity-preview.png"; page = "activity"; theme = "light"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-Activity-200-preview.png"; page = "activity"; theme = "light"; size = "1464x930"; scale = "2" },
            @{ file = "Swirl-Settings-preview.png"; page = "settings"; theme = "light"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-Inspector-preview.png"; page = "inspector"; theme = "dark"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-Compact-preview.png"; page = "overview"; theme = "light"; size = "800x560"; scale = "1" }
          )
          foreach ($preview in $previews) {
            # Offscreen Windows QPA uses DPR 1; QT_SCALE_FACTOR gives effective scale.
            $env:QT_SCALE_FACTOR = $preview.scale
            $path = Join-Path (Resolve-Path "dist").Path $preview.file
            $args = @("--capture-preview=$path", "--preview-page=$($preview.page)", "--preview-theme=$($preview.theme)", "--preview-size=$($preview.size)")
            if ($preview.bottom) { $args += "--preview-scroll-bottom" }
            $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru -NoNewWindow
            $diag = Join-Path (Resolve-Path "dist").Path "Swirl-diagnostics.txt"
            if (!(Test-Path $diag)) { throw "Missing Qt Quick preview diagnostics: $($preview.file)" }
            Copy-Item -LiteralPath $diag -Destination "preview-diagnostics/$($preview.file).log"
            if ($process.ExitCode -ne 0) {
              Get-Content $diag | Select-Object -Last 160
              throw "Qt Quick preview exited with $($process.ExitCode)"
            }
            # QtMsgType 1/2/3 are warning/critical/fatal. Preview exit 0 alone is insufficient.
            if (Select-String -LiteralPath $diag -Pattern '^[123]:') {
              Get-Content $diag
              throw "Qt Quick preview emitted warnings or errors: $($preview.file)"
            }
            if (!(Test-Path $path)) { throw "Missing screenshot: $path" }
            if ((Get-Item $path).Length -lt 2048) { throw "Screenshot is suspiciously small: $path" }
            $size = $preview.size.Split('x')
            $expectedWidth = [Math]::Round([int]$size[0] * [double]$preview.scale, [MidpointRounding]::AwayFromZero)
            $expectedHeight = [Math]::Round([int]$size[1] * [double]$preview.scale, [MidpointRounding]::AwayFromZero)
            $image = [System.Drawing.Image]::FromFile($path)
            try {
              if ($image.Width -ne $expectedWidth -or $image.Height -ne $expectedHeight) {
                throw "Unexpected preview DPI: $($image.Width)x$($image.Height), expected ${expectedWidth}x${expectedHeight}"
              }
            } finally { $image.Dispose() }
            Write-Host "Verified Qt screenshot: $path (${expectedWidth}x${expectedHeight})"
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Upload Qt Quick preview diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Quick-Preview-Diagnostics
          path: preview-diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload rendered Qt Quick UI previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Quick-UI-Previews
          path: dist/Swirl-*-preview.png
          if-no-files-found: warn
          retention-days: 14
      - name: Remove CI-only font fixtures from portable ZIP
        if: always()
        shell: pwsh
        run: |
          $fonts = "dist/lib/fonts"
          if (Test-Path $fonts) {
            $resolvedFonts = (Resolve-Path -LiteralPath $fonts).Path
            $resolvedDist = (Resolve-Path -LiteralPath 'dist').Path.TrimEnd('\')
            if (-not $resolvedFonts.StartsWith($resolvedDist + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Font cleanup escaped the preview payload.' }
            Remove-Item -LiteralPath $resolvedFonts -Recurse -Force
          }
          if (Test-Path $fonts) { throw "Test fonts must not be distributed in Swirl preview." }
      - name: Build and verify independent production files
        shell: pwsh
        run: |
          . ./scripts/Assert-BuildSource.ps1
          Assert-SwirlBuildSource -RepositoryRoot $env:GITHUB_WORKSPACE -ExpectedSourceSha $env:GITHUB_SHA
          cmake -S src/Swirl.Quick -B build/swirl-product -G "Visual Studio 17 2022" -A x64 -DSWIRL_BUILD_UI_TESTS=OFF -DSWIRL_RUST_TARGET="$env:GITHUB_WORKSPACE/core/target"
          if ($LASTEXITCODE -ne 0) { throw 'Production configure failed.' }
          cmake --build build/swirl-product --config Release --target Swirl --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed.' }
          ./scripts/Stage-WindowsRustProduct.ps1 -BuildDirectory build/swirl-product -Destination installer-bin -OpenSslRoot $env:SWIRL_OPENSSL_ROOT
          New-Item -ItemType Directory -Force -Path out | Out-Null
      - name: Start the production Release UI with cold and warm QML caches
        shell: pwsh
        env:
          SWIRL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          SWIRL_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          # The production smoke/font-review combination waits for each actual
          # route's Loader.Ready and transition settlement, rejects QML warnings
          # and uses isolated storage. A
          # plain launch does not honor SWIRL_TEST_ROOT, so do not claim this is
          # a normal user-session or physical Windows 11 desktop acceptance.
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QSG_RHI_BACKEND = 'd3d11'
          Remove-Item Env:QT_QUICK_BACKEND,Env:QT_SCALE_FACTOR,Env:QT_SCREEN_SCALE_FACTORS -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'installer-bin/Swirl.exe').Path
          $manifest = Get-Content -LiteralPath 'installer-bin/package-manifest.json' -Raw | ConvertFrom-Json
          $source = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA -or $manifest.source_sha -cne $source) { throw 'Production UI source identity differs from the tested checkout.' }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/production-ui'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:SWIRL_TEST_ROOT = Join-Path $env:RUNNER_TEMP ('swirl-production-ui-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $env:SWIRL_TEST_ROOT | Out-Null
          $diagnostic = Join-Path (Split-Path $exe) 'Swirl-diagnostics.txt'
          $launches = @()
          try {
            foreach ($phase in @('cold-qml-cache', 'warm-same-qml-cache')) {
              $result = [ordered]@{ phase=$phase; exited=$false; exitCode=$null; diagnosticsPresent=$false; warningsOrErrors=$false; completedPages=0; readyPages=0; passed=$false }
              $process = $null
              try {
                if (Test-Path -LiteralPath $diagnostic) { Remove-Item -LiteralPath $diagnostic }
                $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', '--font-review') -WorkingDirectory $env:SWIRL_TEST_ROOT -PassThru
                $result.exited = $process.WaitForExit(60000)
                if (-not $result.exited) { throw "Production UI $phase exceeded the existing 60-second smoke deadline." }
                $result.exitCode = $process.ExitCode
                if ($process.ExitCode -ne 0) { throw "Production UI $phase failed: $($process.ExitCode)" }
                $result.diagnosticsPresent = Test-Path -LiteralPath $diagnostic -PathType Leaf
                if (-not $result.diagnosticsPresent) { throw "Production UI $phase did not emit its startup diagnostics." }
                $result.warningsOrErrors = [bool](Select-String -LiteralPath $diagnostic -Pattern '^[123]:' -Quiet)
                if ($result.warningsOrErrors) { throw "Production UI $phase emitted Qt warnings or errors." }
                $completed = @(Select-String -LiteralPath $diagnostic -Pattern '^4:\s+SMOKE_PAGES\s+(\d+)\s*$')
                $ready = @(Select-String -LiteralPath $diagnostic -Pattern '^4:\s+FONT_SMOKE_ROUTE_READY\s+(\S+)\s+(\S+)\s*$')
                if ($completed.Count -ne 1) { throw "Production UI $phase lacks an unambiguous all-pages completion marker." }
                $result.completedPages = [int]$completed[0].Matches[0].Groups[1].Value
                $result.readyPages = $ready.Count
                if ($result.completedPages -le 0 -or $result.readyPages -ne $result.completedPages) { throw "Production UI $phase did not confirm every traversed route was ready." }
                foreach ($route in $ready) {
                  $requested = $route.Matches[0].Groups[1].Value.Trim('"')
                  $actual = $route.Matches[0].Groups[2].Value.Trim('"')
                  $expected = if ($requested -in @('requestlogs', 'dashboard')) { 'activity' } else { $requested }
                  if ($actual -cne $expected) { throw "Production UI $phase confirmed a different route: $requested -> $actual" }
                }
                $result.passed = $true
              } finally {
                if ($null -ne $process) {
                  if (-not $process.HasExited) { $process.Kill(); $null = $process.WaitForExit(5000) }
                  $process.Dispose()
                }
                if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                  Copy-Item -LiteralPath $diagnostic -Destination (Join-Path $evidence ($phase + '.log'))
                }
                $launches += $result
              }
            }
          } finally {
            [ordered]@{ source_sha=$source; pr_head_sha=$env:SWIRL_PR_HEAD_SHA; pr_base_sha=$env:SWIRL_PR_BASE_SHA; application_sha256=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant(); ui_tests_compiled=$false; qpa='windows'; requested_rhi='d3d11'; launches=$launches; ordinary_user_session_verified=$false; physical_windows11_dpi_gpu_acceptance='not-run' } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $evidence 'startup.json') -Encoding utf8
          }
      - name: Install NSIS packaging tools
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress --limit-output
          $nsis = "C:/Program Files (x86)/NSIS/makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS installation failed" }
      - name: Build Chinese Swirl installer EXE
        shell: pwsh
        run: |
          $nsis = "C:/Program Files (x86)/NSIS/makensis.exe"
          $appDist = (Resolve-Path "installer-bin").Path
          $outDir = (Resolve-Path "out").Path
          $icon = (Resolve-Path "build/swirl-product/brand/Swirl.ico").Path
          $appVersion = (Get-Content -LiteralPath 'src/Swirl.Quick/PRODUCT_VERSION.txt' -Raw).Trim()
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid PRODUCT_VERSION.txt' }
          $uninstallList=Join-Path $outDir 'Swirl-UninstallFiles.nsh'
          ./scripts/Finalize-WindowsRustProduct.ps1 -ApplicationDirectory $appDist -EvidenceDirectory (Join-Path $outDir 'package-evidence') -UninstallList $uninstallList
          $repo=(Resolve-Path .).Path
          & $nsis /INPUTCHARSET UTF8 "/DAPP_DIST=$appDist" "/DOUT_DIR=$outDir" "/DAPP_ICON=$icon" "/DAPP_VERSION=$appVersion" "/DUNINSTALL_LIST=$uninstallList" "/DREPO_ROOT=$repo" "src/Swirl.Quick/packaging/Swirl.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed ($LASTEXITCODE)" }
          if (!(Test-Path "out/Swirl-Setup.exe")) { throw "Installer missing" }
          if ((Get-Item "out/Swirl-Setup.exe").Length -lt 10000000) { throw "Installer suspiciously small" }
          $exeVersion = (Get-Item -LiteralPath (Join-Path $appDist 'Swirl.exe')).VersionInfo.ProductVersionRaw.ToString()
          $installerVersion = (Get-Item -LiteralPath 'out/Swirl-Setup.exe').VersionInfo.ProductVersionRaw.ToString()
          if ($exeVersion -ne "$appVersion.0" -or $installerVersion -ne "$appVersion.0") { throw 'Source, application and installer versions disagree.' }
          $manifest = Get-Content -LiteralPath (Join-Path $appDist 'package-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:GITHUB_SHA) { throw 'Package source identity differs from this workflow commit.' }
          $scope = if ($env:SWIRL_CI_UI_ONLY -eq 'true') { 'ui-only' } else { 'full' }
          $networkRegression = if ($env:SWIRL_CI_NETWORK_CHANGE -eq 'true') { 'passed' } else { 'not-run-ui-only' }
          [ordered]@{source_sha=$env:GITHUB_SHA;version=$appVersion;qt=$env:SWIRL_QT_VERSION;installer_sha256=(Get-FileHash -LiteralPath 'out/Swirl-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant();regression_scope=$scope;critical_ui_tests='passed';network_regression=$networkRegression;scoped_full_regression='pending';desktop_dpi_acceptance='manual';physical_refresh_rate_acceptance='unverified'} | ConvertTo-Json | Set-Content -LiteralPath out/delivery.json -Encoding utf8
      - name: Upload critical-test Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Windows-Installer-EXE
          path: out/Swirl-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remaining in-scope regression suite after installer is available
        shell: pwsh
        run: |
          $regression = 'failed'
          try {
            # Compiler caches may contain an older report. Only this run's
            # layout result can be reused by the focused DPR matrix below.
            Remove-Item -LiteralPath 'build/swirl-quick/activity-layout/activity-layout-report.json' -ErrorAction SilentlyContinue
            # Critical tests have already passed before packaging. Exclude only
            # those exact tests here to avoid paying for a second execution.
            $excludedTests = 'appearance-ui|node-ui|engine-ui|overview-input|all-pages|motion|apec-motion|apec-glass|hero|settings-material|navigation-ui|capture-network'
            if ($env:SWIRL_CI_UI_ONLY -eq 'true') {
              # UI-only changes still run all parser, policy, storage, and local
              # regressions; skip only suites whose purpose is network/TLS traffic.
              $excludedTests += '|system-proxy-recovery|node-real-chain|stream-regression|subscription-download|qt-network-policy|gateway-network'
              Write-Host 'Deferred for this UI-only diff: node-real-chain, stream-regression, subscription-download, qt-network-policy, gateway-network.'
            } else {
              # These network/security checks already passed before packaging.
              $excludedTests += '|system-proxy-recovery|system-proxy-state|node-real-chain|stream-regression|subscription-download|qt-network-policy|subscription-formats|import-subscription|import-boundaries|gateway-network'
            }
            $exclude = "^swirl-($excludedTests)$"
            ctest --test-dir build/swirl-quick -C Release -E $exclude --output-on-failure --no-tests=error --output-junit build-evidence/full-regression.xml
            if ($LASTEXITCODE -ne 0) { throw "Full regression checks failed ($LASTEXITCODE)." }
            $regression = 'passed'
          } finally {
            $delivery = Get-Content -LiteralPath 'out/delivery.json' -Raw | ConvertFrom-Json
            $delivery | Add-Member -NotePropertyName scoped_full_regression -NotePropertyValue $regression -Force
            $delivery | ConvertTo-Json | Set-Content -LiteralPath 'out/delivery.json' -Encoding utf8
          }
      - name: Verify activity layout and ESC at five effective DPR values
        shell: pwsh
        run: |
          # Reuse the current unscaled layout result, then run only this focused
          # driver at missing DPR values. QT_SCALE_FACTOR multiplies native DPR.
          # The existing test-only viewport permits a real HWND / swapchain to
          # extend beyond this hosted desktop; the driver independently checks
          # native client pixels and complete RHI readback dimensions. These are
          # Qt rendering/input simulations, not physical display acceptance.
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QSG_RHI_BACKEND = 'd3d11'
          Remove-Item Env:QT_QUICK_BACKEND,Env:QT_SCREEN_SCALE_FACTORS,Env:QT_SCALE_FACTOR,Env:SWIRL_LAYOUT_EXPECTED_DPR -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'build/swirl-quick/Release/Swirl.exe').Path
          $root = Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick/activity-layout'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $baselinePath = Join-Path $root 'activity-layout-report.json'
          $diagnostic = Join-Path (Split-Path $exe) 'Swirl-diagnostics.txt'
          $culture = [Globalization.CultureInfo]::InvariantCulture
          function Invoke-ActivityLayout([string]$output, [string]$scaleFactor = '', [double]$expectedDpr = 0) {
            New-Item -ItemType Directory -Force -Path $output | Out-Null
            $reportPath = Join-Path $output 'activity-layout-report.json'
            Remove-Item -LiteralPath $reportPath,$diagnostic -ErrorAction SilentlyContinue
            $env:SWIRL_TEST_ROOT = Join-Path $env:RUNNER_TEMP ('swirl-layout-dpr-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $env:SWIRL_TEST_ROOT | Out-Null
            if ($scaleFactor) { $env:QT_SCALE_FACTOR = $scaleFactor } else { Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue }
            if ($expectedDpr -gt 0) { $env:SWIRL_LAYOUT_EXPECTED_DPR = $expectedDpr.ToString('R', $culture) } else { Remove-Item Env:SWIRL_LAYOUT_EXPECTED_DPR -ErrorAction SilentlyContinue }
            $process = $null
            try {
              $arguments = @('--activity-layout-test', '--preview-page=activity', '--preview-size=1013x672', ('--activity-layout-output="' + $output + '"'))
              $process = Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $env:SWIRL_TEST_ROOT -PassThru
              if (-not $process.WaitForExit(120000)) { throw 'Activity layout exceeded its existing 120-second CTest deadline.' }
              if ($process.ExitCode -ne 0) { throw "Activity layout failed at scale factor $scaleFactor with exit code $($process.ExitCode)." }
              if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Activity layout did not produce a current report.' }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              if ($report.success -ne $true -or $report.failures -ne 0) { throw 'Activity layout reported failed checks.' }
              return $report
            } finally {
              if ($null -ne $process) {
                if (-not $process.HasExited) { $process.Kill(); $null = $process.WaitForExit(5000) }
                $process.Dispose()
              }
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) { Copy-Item -LiteralPath $diagnostic -Destination (Join-Path $output 'qt-diagnostics.txt') }
            }
          }
          $samples = @()
          $matrixResult = 'failed'
          $nativeDpr = 0.0
          try {
            if (-not (Test-Path -LiteralPath $baselinePath -PathType Leaf)) {
              # Keep this gate active if a future UI-only scope omits the
              # baseline from CTest; never interpret missing evidence as green.
              $baseline = Invoke-ActivityLayout $root
            } else { $baseline = Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json }
            $nativeDpr = [double]$baseline.devicePixelRatio
            if ($baseline.success -ne $true -or $baseline.failures -ne 0 -or $baseline.nativeD3D11 -ne $true -or $baseline.scaleFactorEnvironment -or -not [double]::IsFinite($nativeDpr) -or $nativeDpr -le 0) { throw 'The current native-DPR baseline is missing, scaled or unsuccessful.' }
            foreach ($percent in @(100, 125, 150, 175, 200)) {
              $target = $percent / 100.0
              if ([Math]::Abs($nativeDpr - $target) -le 0.01) {
                $report = $baseline
                $factor = ''
                $relativeReport = 'activity-layout-report.json'
              } else {
                $factor = ($target / $nativeDpr).ToString('R', $culture)
                $output = Join-Path $root ('dpi-' + $percent)
                $report = Invoke-ActivityLayout $output $factor $target
                $relativeReport = 'dpi-' + $percent + '/activity-layout-report.json'
              }
              if ([Math]::Abs([double]$report.devicePixelRatio - $target) -gt 0.01 -or $report.nativeD3D11 -ne $true) { throw "The $percent percent layout did not run at the requested DPR and renderer." }
              $samples += [ordered]@{ percent=$percent; expectedDpr=$target; actualDpr=$report.devicePixelRatio; qtScaleFactor=$factor; reusedNativeBaseline=($factor -eq ''); report=$relativeReport; passed=$true }
            }
            if ($samples.Count -ne 5) { throw 'The activity DPR matrix is incomplete.' }
            $matrixResult = 'passed'
          } finally {
            [ordered]@{ source_sha=$env:GITHUB_SHA; nativeBaselineDpr=$nativeDpr; result=$matrixResult; samples=$samples; method='Actual QQuickWindow DPR, Win32 client and full RHI readback; unchanged five-card layout, ESC, interruption and resize checks using Qt scale-factor simulation. The test HWND may extend beyond the hosted desktop.'; physical_windows11_display_scaling='not-run'; cross_monitor_dpi='not-run'; physical_gpu_presentation='not-run' } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $root 'dpi-matrix.json') -Encoding utf8
            $delivery = Get-Content -LiteralPath 'out/delivery.json' -Raw | ConvertFrom-Json
            $delivery | Add-Member -NotePropertyName activity_dpr_simulation -NotePropertyValue $matrixResult -Force
            $delivery | ConvertTo-Json | Set-Content -LiteralPath 'out/delivery.json' -Encoding utf8
          }
      - name: Upload engine and scoped regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Engine-Test-Evidence
          path: |
            build/swirl-quick/Testing/Temporary/LastTest.log
            build-evidence/full-regression.xml
            build/swirl-quick/engine-contract.txt
            build/swirl-quick/engine-real.txt
            build/swirl-quick/node-chain.txt
            build/swirl-quick/import-subscription.txt
            build/swirl-quick/native-engine.txt
            build/swirl-quick/stream-regression.txt
            build/swirl-quick/subscription-formats.txt
            build/swirl-quick/Release/Swirl-appearance.txt
            build/swirl-quick/Release/Swirl-appearance-restore.txt
            build/swirl-quick/motion-report.json
            build/swirl-quick/apec-*-report.json
            build/swirl-quick/activity-details-report.json
            build/swirl-quick/activity-perf-*-report.json
            build/swirl-quick/activity-feather-*.png
            build/swirl-quick/activity-layout/
            build/swirl-quick/policy-evidence/
            build/swirl-quick/liquid-glass-evidence/
            build-evidence/production-ui/
            build/swirl-quick/hero-evidence/
            build/swirl-quick/navigation-evidence/
            build/swirl-quick/settings-material-evidence/
            build/swirl-quick/Release/Swirl-diagnostics.txt
            build/swirl-quick/Release/Swirl-node-ui-diagnostics.txt
            build/swirl-quick/Release/Swirl-motion-diagnostics.txt
            build/swirl-quick/Release/Swirl-policy-ui-diagnostics.txt
            build/swirl-quick/Release/Swirl-hero-diagnostics.txt
          if-no-files-found: warn
      - name: Save reusable compiler outputs
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          . ./scripts/BuildInputTimes.ps1
          Sync-SwirlBuildInputTimes -RepositoryRoot $env:GITHUB_WORKSPACE -BuildDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick')
      - name: Cache compiled Qt and Rust outputs
        if: ${{ !cancelled() && steps.ui_build.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            build/swirl-quick
            build/swirl-product
          key: ${{ steps.build_cache.outputs.cache-primary-key }}
      - name: Preserve SDK and exact-package identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Qt612-Package-Evidence
          path: |
            build-evidence/
            build/swirl-quick/font-*.xml
            out/package-evidence/
            out/delivery.json
            installer-bin/package-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload separate Qt UI preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Quick-UI-win-x64
          path: installer-bin/
          if-no-files-found: error
          retention-days: 14

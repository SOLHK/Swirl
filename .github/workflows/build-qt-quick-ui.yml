name: Build Swirl Qt Quick UI (Preview)

on:
  push:
    branches: [main, test, work/swirl-apec-v3-20261027]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '1'
  SWIRL_QT_VERSION: '6.12.0'

concurrency:
  group: swirl-quick-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # The isolated network development PRs replace only their own obsolete
  # builds. An old icon-tool stall must not keep the corrected installer queued.
  # Other product branches retain their cache and installer evidence unchanged.
  cancel-in-progress: ${{ contains(fromJSON('["work/native-tun-windows-20261030-isolated", "work/native-lan-proxy-20261031", "work/native-lan-gateway-20261031", "work/node-probe-render-20261105"]'), github.head_ref || github.ref_name) }}

jobs:
  build-qt-ui:
    runs-on: windows-2022
    # Cold build plus five real standard-user installer cases used 75 minutes.
    # Keep the remaining regression and DPR gates inside the job budget.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # Read fixed Qt SDK evidence and the opted-in old installer.
    steps:
      - name: Checkout original repository and UI branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify changes for full regression scope
        id: ci_scope
        shell: pwsh
        env:
          SWIRL_EVENT_NAME: ${{ github.event_name }}
          SWIRL_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          $base = $env:SWIRL_BASE_SHA
          if ($env:SWIRL_EVENT_NAME -eq 'workflow_dispatch' -or [string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            "SWIRL_CI_UI_ONLY=false" >> $env:GITHUB_ENV
            "SWIRL_CI_NETWORK_CHANGE=true" >> $env:GITHUB_ENV
            Write-Host 'Full regression scope: explicit/manual or initial run.'
            exit 0
          }
          git cat-file -e "$base^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags --depth=1 origin $base
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the event base commit; refusing to narrow test scope.' }
          }
          $changed = @(git diff --name-only $base $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -eq 0) { throw 'Unable to determine changed files; refusing to narrow test scope.' }
          $nonUi = @($changed | Where-Object { $_ -notmatch '^(src/Swirl\.Quick/qml/|src/Swirl\.Quick/tests/(ApecMotionChecks|ApecGlassChecks|AppearanceChecks|HeroChecks|NavigationChecks|UiQualityChecks|WindowChecks|OverviewChecks)\.(cpp|h)$|AGENTS\.md$)' })
          $uiOnly = $nonUi.Count -eq 0
          "SWIRL_CI_UI_ONLY=$($uiOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "SWIRL_CI_NETWORK_CHANGE=$((!$uiOnly).ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if ($uiOnly) { Write-Host "UI-only change set ($($changed.Count) files); retain critical UI/package checks and defer unrelated network integration tests." }
          else {
            Write-Host "Core, network, security, build, or mixed change set ($($changed.Count) files); require focused network/security tests and full regression."
          }
      - name: Observe fixed Windows PowerShell startup environments
        if: env.SWIRL_CI_NETWORK_CHANGE == 'true'
        shell: pwsh
        run: ./scripts/Measure-WindowsPowerShellStartup.ps1 -OutputPath build-evidence/powershell-startup.json
      - name: Preserve early PowerShell startup observation
        if: always() && env.SWIRL_CI_NETWORK_CHANGE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-WindowsPowerShell-Startup-Observation
          path: build-evidence/powershell-startup.json
          if-no-files-found: error
      - name: Parse diagnostic scripts and compile the read-only Windows interop
        if: env.SWIRL_CI_NETWORK_CHANGE == 'true'
        shell: powershell
        run: |
          foreach ($path in @('scripts/tests/WindowsProxyDiagnostics.ps1','scripts/tests/Test-WindowsProxyQueryOnly.ps1',
              'scripts/tests/Invoke-DisposableWindowsUser.ps1','scripts/tests/Test-WindowsNormalInstaller.ps1',
              'scripts/tests/Test-WindowsFullMotionSmoke.ps1','scripts/tests/Get-WindowsResidualProfileOwners.ps1',
              'scripts/tests/OwnedWindowsProfileCleanup.ps1','scripts/tests/Test-OwnedWindowsProfileCleanup.ps1',
              'scripts/tests/Test-PrivateQtQuotaProfile.ps1','scripts/Select-Qt612ProductSdk.ps1',
              'scripts/Stage-WindowsRustProduct.ps1')) {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ('PowerShell parser rejected '+$path+': '+($errors.Message -join ' ')) }
          }
          # Compile only; no WinINET query or settings access in the host profile.
          . ./scripts/tests/WindowsProxyDiagnostics.ps1
      - name: Compile the actual residual-event filter and run its pure controls
        if: env.SWIRL_CI_NETWORK_CHANGE == 'true'
        shell: pwsh
        run: |
          $path = (Resolve-Path -LiteralPath 'scripts/tests/Get-WindowsResidualProfileOwners.ps1').Path
          $tokens = $null; $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'The actual residual-owner collector did not parse in PowerShell 7.' }
          $definitions = @($ast.FindAll({ param($node)
            $node -is [Management.Automation.Language.CommandAst] -and $node.GetCommandName() -ceq 'Add-Type'
          },$true))
          if ($definitions.Count -ne 1 -or $definitions[0].CommandElements.Count -ne 3 -or
              $definitions[0].CommandElements[1] -isnot [Management.Automation.Language.CommandParameterAst] -or
              $definitions[0].CommandElements[1].ParameterName -cne 'TypeDefinition' -or
              $definitions[0].CommandElements[2] -isnot [Management.Automation.Language.StringConstantExpressionAst] -or
              $definitions[0].CommandElements[2].StringConstantType -ne [Management.Automation.Language.StringConstantType]::SingleQuotedHereString) {
            throw 'The collector native-source boundary changed; do not execute the collector as a fallback.'
          }
          # Compile the same literal used by the real worker. The called method
          # parses synthetic XML only; it does not call Windows event-log APIs.
          Add-Type -TypeDefinition $definitions[0].CommandElements[2].Value
          $controls = [SwirlProfileOwners.Native]::RunEventFilterControls()
          $size = [Runtime.InteropServices.Marshal]::SizeOf([type][SwirlProfileOwners.EventVariant])
          $receipt = [ordered]@{schema=1; source_sha=$env:GITHUB_SHA
            collector_sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            powershell_major=$PSVersionTable.PSVersion.Major; powershell_version=$PSVersionTable.PSVersion.ToString()
            event_variant_size=$size; controls=$controls; native_event_apis_called=$false
            scope='Actual collector C# compilation and synthetic XML controls only; no event log or profile access.'}
          $null = New-Item -ItemType Directory -Path 'build-evidence/profile-event-controls' -Force
          $output = 'build-evidence/profile-event-controls/receipt.json'
          if (Test-Path -LiteralPath $output) { throw 'Refusing to replace an existing filter-control receipt.' }
          $receipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $output -Encoding UTF8
          if ($size -ne 16 -or -not $controls.success -or $controls.total -ne 24 -or $controls.passed -ne 24) {
            throw 'The actual residual-event filter controls or ABI failed.'
          }
      - name: Prove fixed disposable-profile cleanup with actual Win32 controls
        if: env.SWIRL_CI_NETWORK_CHANGE == 'true'
        shell: pwsh
        run: ./scripts/tests/Test-OwnedWindowsProfileCleanup.ps1 -EvidenceDirectory build-evidence/profile-residual-cleanup-controls
      - name: Validate scoped Codex proxy launcher
        shell: pwsh
        run: ./tools/tests/Test-CodexProxyLauncher.ps1
      - name: Check cloud-knot path geometry from the production JavaScript
        run: node scripts/tests/Test-CloudKnotGeometry.cjs
      - name: Prepare supported native Windows display for UI checks
        shell: pwsh
        run: ./scripts/Set-CiDisplayResolution.ps1
      - name: Install Rust MSVC tools
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: profile_python
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            tools/requirements-qt-sdk.txt
            tools/requirements-network-fixtures.txt
            tools/requirements-font-tests.txt
      - name: Bind the residual-owner launcher to the prepared Python interpreter
        shell: pwsh
        env:
          SWIRL_PREPARED_PYTHON: ${{ steps.profile_python.outputs.python-path }}
        run: |
          if (-not [IO.Path]::IsPathRooted($env:SWIRL_PREPARED_PYTHON) -or
              -not (Test-Path -LiteralPath $env:SWIRL_PREPARED_PYTHON -PathType Leaf)) {
            throw 'The prepared residual-owner interpreter path is unavailable.'
          }
          "SWIRL_PROFILE_OWNER_PYTHON=$env:SWIRL_PREPARED_PYTHON" >> $env:GITHUB_ENV
      - name: Check residual-owner diagnostic admission boundaries
        run: python tools/tests/test_windows_profile_owner_diagnostics.py -v
      - name: Install SDK downloader and independent certificate fixtures
        run: python -m pip install -r tools/requirements-qt-sdk.txt -r tools/requirements-network-fixtures.txt -r tools/requirements-font-tests.txt
      - name: Verify canonical brand assets and all six variants
        run: python tools/Generate-BrandAssets.py --check
      - name: Check SDK archive and metadata filesystem boundaries
        shell: pwsh
        run: python tools/tests/test_qt_sdk_installer.py --scratch-root "$env:RUNNER_TEMP/swirl-sdk-installer-tests"
      - name: Check derived Qt SDK and corresponding source boundaries
        shell: pwsh
        run: |
          python tools/tests/test_qt612_product_sdk.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Derived Qt SDK boundary checks failed.' }
          python tools/tests/test_qt612_product_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Qt corresponding source boundary checks failed.' }
      - name: Check pinned TLS source and fixed package boundaries
        shell: pwsh
        run: |
          python tools/tests/test_openssl_runtime.py --scratch-root "$env:RUNNER_TEMP/swirl-openssl-boundary-tests"
          if ($LASTEXITCODE -ne 0) { throw 'TLS source/receipt boundary checks failed.' }
          ./scripts/tests/Test-RustProductPackagePolicy.ps1
      - name: Check package path policy with Windows PowerShell 5.1
        shell: powershell
        run: |
          ./scripts/tests/Test-RustProductPackagePolicy.ps1
          # Compile the actual PE reader under Windows PowerShell 5.1 before
          # the expensive native build; product deployment is verified later.
          . ./scripts/Copy-VerifiedMsvcRuntime.ps1
      - name: Verify user integration transactions with an actual standard-user token
        shell: pwsh
        env:
          SWIRL_DISPOSABLE_INSTALL_TEST: '1'
        run: |
          ./scripts/tests/Test-WindowsUserIntegration.ps1 -ExpectedSourceSha $env:GITHUB_SHA -EvidenceDirectory build-evidence/user-integration-policy
          $policy = Get-Content -LiteralPath 'build-evidence/user-integration-policy/integration-policy.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $runner = Get-Content -LiteralPath 'build-evidence/user-integration-policy/standard-user-runner.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($policy.schema -ne 1 -or -not $policy.success -or $policy.source_sha -cne $env:GITHUB_SHA -or -not $policy.actual_non_admin_token -or -not $policy.actual_x86_powershell -or -not $policy.negative_control.required_assertion_failed) { throw 'Actual standard-user integration transaction evidence is incomplete.' }
          if ($runner.schema -ne 1 -or -not $runner.success -or $runner.forced_termination) { throw 'The temporary standard-user account or its native resources were not cleanly released.' }
      - name: Restore isolated Qt 6.12 SDK archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-qt-6.12.0
          key: qt-sdk-${{ runner.os }}-6.12.0-msvc2022-${{ hashFiles('tools/Install-QtSdk.py', 'tools/requirements-qt-sdk.txt') }}
      - name: Install and verify the official Qt 6.12 MSVC SDK
        shell: pwsh
        run: |
          # Qt 6.12 moved archives into architecture-specific metadata directories.
          # The checked-in downloader verifies the official metadata/archive SHA256s.
          $sdkOutput = Join-Path $env:RUNNER_TEMP 'swirl-qt-6.12.0'
          python tools/Install-QtSdk.py --version $env:SWIRL_QT_VERSION --arch win64_msvc2022_64 --output $sdkOutput
          if ($LASTEXITCODE -ne 0) { throw 'Official Qt SDK installation failed.' }
          $sdk = Get-Content -LiteralPath (Join-Path $sdkOutput 'sdk-install-result.json') -Raw | ConvertFrom-Json
          $qtRoot = (Resolve-Path -LiteralPath $sdk.kit_root).Path
          $version = (& (Join-Path $qtRoot 'bin/qmake.exe') -query QT_VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne $env:SWIRL_QT_VERSION -or $sdk.arch -ne 'win64_msvc2022_64') { throw 'Unexpected Qt version or ABI.' }
          foreach ($component in @('Qt6GuiPrivate', 'Qt6ShaderTools', 'Qt6QuickControls2', 'Qt6Svg', 'Qt6Network')) {
            if (-not (Test-Path -LiteralPath (Join-Path $qtRoot "lib/cmake/$component/${component}Config.cmake"))) { throw "Missing Qt component: $component" }
          }
          "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          (Join-Path $qtRoot 'bin') >> $env:GITHUB_PATH
          $isolatedRoot = Join-Path $env:RUNNER_TEMP 'swirl-apec-ui-isolated'
          New-Item -ItemType Directory -Force -Path $isolatedRoot | Out-Null
          "SWIRL_TEST_ROOT=$isolatedRoot" >> $env:GITHUB_ENV
          $fontFixtures = Join-Path $env:RUNNER_TEMP 'swirl-apec-font-metadata'
          python src/Swirl.Quick/tests/generate_font_metadata_fixtures.py $fontFixtures
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $fontFixtures 'automation.ttf'))) { throw 'Synthetic font fixture generation failed.' }
          "SWIRL_FONT_METADATA_FIXTURES=$fontFixtures" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path build-evidence | Out-Null
          Copy-Item -LiteralPath (Join-Path $sdkOutput 'sdk-install-result.json') -Destination build-evidence/qt-sdk.json
      - name: Select the complete source-verified Qt 6.12 product SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Select-Qt612ProductSdk.ps1 -OfficialReceipt build-evidence/qt-sdk.json -EvidenceDirectory build-evidence/qt-product-sdk
      - name: Restore fixed Qt corresponding source archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-qt-6.12.0-source-cache
          key: qt-corresponding-source-6.12.0-${{ hashFiles('tools/qt612-product-source.lock.json') }}
      - name: Record compiler cache identity
        id: compiler
        shell: pwsh
        run: |
          $tools = @('cl.exe','link.exe','cmake.exe') | ForEach-Object { (Get-FileHash -LiteralPath (Get-Command $_ -ErrorAction Stop).Source -Algorithm SHA256).Hash }
          $qtLock = (Get-FileHash -LiteralPath 'tools/qt612-product-sdk.lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          $identity = ([ordered]@{rust=(& rustc -vV | Out-String); tools=$tools; msvc=$env:VCToolsVersion; sdk=$env:WindowsSDKVersion; qt=$env:QT_ROOT_DIR; qt_content=$env:SWIRL_QT_SELECTED_CONTENT_ID; qt_product_lock=$qtLock; workspace=$env:GITHUB_WORKSPACE} | ConvertTo-Json -Compress)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          $identity | Set-Content -LiteralPath build-evidence/compiler.json -Encoding utf8
      - name: Record native TLS runtime build tools
        id: tls_tools
        shell: pwsh
        run: ./scripts/Build-CiOpenSslRuntime.ps1 -OutputDirectory "$env:RUNNER_TEMP/swirl-openssl-3.5.9" -PrepareOnly -GitHubEnvironment
      - name: Restore source-verified OpenSSL runtime
        id: tls_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-openssl-3.5.9
          key: openssl-${{ runner.os }}-${{ steps.tls_tools.outputs.identity }}-${{ hashFiles('tools/Build-OpenSslRuntime.py', 'tools/openssl-runtime.lock.json') }}
      - name: Build or verify pinned OpenSSL runtime
        shell: pwsh
        run: ./scripts/Build-CiOpenSslRuntime.ps1 -OutputDirectory "$env:RUNNER_TEMP/swirl-openssl-3.5.9" -GitHubEnvironment
      - name: Save verified TLS compiler outputs before downstream checks
        if: steps.tls_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-openssl-3.5.9
          key: ${{ steps.tls_cache.outputs.cache-primary-key }}
      - name: Restore Qt 6.12 compiler outputs
        id: build_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            build/swirl-quick
            build/swirl-product
          key: apec-qt612-product-msvc-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            apec-qt612-product-msvc-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-
      - name: Restore content-verified input timestamps
        shell: pwsh
        run: |
          . ./scripts/BuildInputTimes.ps1
          Sync-SwirlBuildInputTimes -RepositoryRoot $env:GITHUB_WORKSPACE -BuildDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick') -Restore
      - name: Discard restored test evidence before compiling this checkout
        shell: pwsh
        run: |
          # Compiler caches can include captures and logs from their source run.
          # Clear these before configure/build, so even a compiler failure cannot
          # upload old tests as evidence for the current source identity.
          Remove-Item -LiteralPath 'build-evidence/ctest-inventory.json' -Force -ErrorAction SilentlyContinue
          foreach ($directory in @('hero-evidence','navigation-evidence','settings-material-evidence','policy-evidence','activity-layout','liquid-glass-evidence','system-proxy-exit','system-proxy-normal-stop','node-ui-evidence','node-ui-native-evidence')) {
            Remove-Item -LiteralPath (Join-Path 'build/swirl-quick' $directory) -Recurse -Force -ErrorAction SilentlyContinue
          }
          foreach ($file in @('Testing/Temporary/LastTest.log','engine-contract.txt','engine-real.txt','node-chain.txt','node-chain.xml','import-subscription.txt','native-engine.txt','stream-regression.txt','subscription-formats.txt','connection-rows.xml','policy-configuration.xml','policy-configuration.txt','swirl-telemetry-accounting.xml','swirl-system-proxy-state.xml','swirl-native-tun-recovery.xml','swirl-system-proxy-recovery.xml','swirl-system-proxy-app-exit.xml','swirl-system-proxy-normal-stop.xml','swirl-rust-qt-integration.xml')) {
            Remove-Item -LiteralPath (Join-Path 'build/swirl-quick' $file) -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -Path 'build/swirl-quick/*-report.json','build/swirl-quick/activity-feather-*.png','build/swirl-quick/activity-data-*.png','build/swirl-quick/font-*.xml','build/swirl-quick/Release/Swirl-*.txt' -File -ErrorAction SilentlyContinue | Remove-Item -Force
      - name: Configure Qt UI independently
        shell: pwsh
        run: |
          $configureArgs = @(
            '-S', 'src/Swirl.Quick', '-B', 'build/swirl-quick',
            '-G', 'Visual Studio 17 2022', '-A', 'x64',
            '-DSWIRL_BUILD_UI_TESTS=ON',
            '-DSWIRL_BUILD_CORE_TESTS=ON',
            '-DSWIRL_PRIVATE_UI_QUOTA=OFF',
            "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$env:SWIRL_QT_SELECTED_CMAKE",
            "-DSWIRL_RUST_TARGET=$env:GITHUB_WORKSPACE/core/target",
            "-DSWIRL_TEST_FONT_DIRECTORY=$env:GITHUB_WORKSPACE/build/swirl-quick/Release/lib/fonts"
          )
          if ($env:SWIRL_CI_NETWORK_CHANGE -eq 'true') {
            # Enable CMake registration without leaking this opt-in into other
            # application tests, which exercise the proxy UI in an isolated fake.
            cmake -E env SWIRL_SYSTEM_PROXY_TEST=1 SWIRL_NATIVE_TUN_ACCEPTANCE=1 cmake @configureArgs
          } else {
            cmake @configureArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'Qt UI configuration failed.' }
          python tools/Compose-Qt612ProductSdk.py verify --receipt $env:SWIRL_QT_SELECTED_RECEIPT --build-dir build/swirl-quick --phase configured --evidence build-evidence/qt-product-qa-configured
          if ($LASTEXITCODE -ne 0) { throw 'Actual QA Qt target does not match the selected SDK.' }
      - name: Build UI
        id: ui_build
        shell: pwsh
        run: |
          cmake --build build/swirl-quick --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Qt QA build failed.' }
          if (-not (Test-Path -LiteralPath 'build/swirl-quick/Release/SwirlPrivateSubscriptionAcceptance.exe' -PathType Leaf)) {
            throw 'The offline NodeStore installer fixture was not built in the QA configuration.'
          }
      - name: Bundle UI runtime
        shell: pwsh
        run: |
          python tools/Compose-Qt612ProductSdk.py verify --receipt $env:SWIRL_QT_SELECTED_RECEIPT --build-dir build/swirl-quick --phase pre-deploy --evidence build-evidence/qt-product-qa-pre-deploy
          if ($LASTEXITCODE -ne 0) { throw 'QA Qt source, linkage or SDK changed before deployment.' }
          $windeployqt = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          $qtpaths = Join-Path $env:QT_ROOT_DIR 'bin/qtpaths.exe'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/swirl-quick/Release/Swirl.exe dist/
            Copy-Item build/swirl-quick/Release/Swirl-brand-0217-optical.ico dist/
            python tools/Verify-WindowsIconResources.py --exe dist/Swirl.exe --ico dist/Swirl-brand-0217-optical.ico --output build-evidence/ui-icon-resources.json
            if ($LASTEXITCODE -ne 0) { throw 'The deployed UI icon resources do not match all native ICO frames.' }
          Copy-Item build/swirl-quick/Release/swirl_api.dll,build/swirl-quick/Release/swirl-rust-build.json dist/
          Copy-Item build/swirl-quick/Release/SwirlProxyGuard.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlGatewayGuard.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlScriptRunner.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlCodexLauncher.exe dist/
          Copy-Item tools/SwirlCodexManage.py,tools/SubscriptionCapture.py dist/
          # Copy files into the existing cache directory, never the directory
          # itself into another directory of the same name on a warm build.
          $ruleFiles = Get-ChildItem -LiteralPath 'src/Swirl.Quick/packaging/rules' -File
          foreach ($ruleTarget in @('dist/rules', 'build/swirl-quick/Release/rules')) {
            New-Item -ItemType Directory -Force -Path $ruleTarget | Out-Null
            foreach ($ruleFile in $ruleFiles) {
              $targetFile = Join-Path $ruleTarget $ruleFile.Name
              Copy-Item -LiteralPath $ruleFile.FullName -Destination $targetFile -Force
              if ((Get-FileHash -LiteralPath $targetFile -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $ruleFile.FullName -Algorithm SHA256).Hash) { throw 'Staged rule file differs from the source.' }
            }
          }
          # Qt 6.12 deploys only the Windows QPA plugin by default. The isolated
          # screenshot/input drivers also need offscreen; production staging
          # remains separate and uses the native Windows plugin.
          ./scripts/Copy-VerifiedOpenSslRuntime.ps1 -OpenSslRoot $env:SWIRL_OPENSSL_ROOT -ApplicationDirectory dist -Target VC-WIN64A
          & $windeployqt --qtpaths $qtpaths --release --no-compiler-runtime --openssl-root $env:SWIRL_OPENSSL_ROOT --include-plugins qoffscreen,qopensslbackend --qmldir src/Swirl.Quick/qml dist/Swirl.exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath 'dist/platforms/qoffscreen.dll')) { throw 'The isolated offscreen test runtime is incomplete.' }
          # CTest executes these binaries in the build directory, not dist.
          ./scripts/Copy-VerifiedOpenSslRuntime.ps1 -OpenSslRoot $env:SWIRL_OPENSSL_ROOT -ApplicationDirectory build/swirl-quick/Release -Target VC-WIN64A

name: Build Swirl Qt Quick UI (Preview)

on:
  push:
    branches: [test]
    paths:
      - "src/Swirl.Quick/**"
      - ".github/workflows/build-qt-quick-ui.yml"
      - "docs/RELEASE_PROCESS.md"
  pull_request:
    branches: [test, main]
  workflow_dispatch:

concurrency:
  group: swirl-quick-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-qt-ui:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout original repository and UI branch
        uses: actions/checkout@v4
      - name: Set up Qt desktop SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Qt UI independently
        shell: pwsh
        run: cmake -S src/Swirl.Quick -B build/swirl-quick -G "Visual Studio 17 2022" -A x64
      - name: Build UI
        shell: pwsh
        run: cmake --build build/swirl-quick --config Release --parallel
      - name: Bundle UI runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/swirl-quick/Release/SwirlQuick.exe dist/
          windeployqt --release --qmldir src/Swirl.Quick/qml dist/SwirlQuick.exe
      - name: Startup smoke test (offscreen, no network actions)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          & dist/SwirlQuick.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture optional UI screenshots (offscreen software renderer)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          & dist/SwirlQuick.exe --capture-preview=dist/Swirl-Overview-preview.png --preview-page=overview --preview-theme=light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/SwirlQuick.exe --capture-preview=dist/Swirl-Inspector-preview.png --preview-page=inspector --preview-theme=dark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload separate Qt UI preview
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Quick-UI-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

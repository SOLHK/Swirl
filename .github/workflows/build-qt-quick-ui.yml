      - name: Startup and all-pages smoke against deployed Qt runtime
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          # GUI-subsystem executables return immediately from PowerShell's '&' invocation.
          # Explicitly wait for the real Qt process so smoke tests cannot false-pass.
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $diag = Join-Path (Resolve-Path "dist").Path 'Swirl-diagnostics.txt'
          if (Test-Path -LiteralPath $diag) { Remove-Item -LiteralPath $diag -Force }
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          # The next preview launch rewrites this diagnostic file. Preserve the
          # actual deployed smoke, including VME object/context diagnostics.
          New-Item -ItemType Directory -Force -Path build-evidence | Out-Null
          $pagesObserved = $false
          $diagnosticHash = $null
          if (Test-Path -LiteralPath $diag) {
            Copy-Item -LiteralPath $diag -Destination 'build-evidence/deployed-all-pages.log'
            $diagnosticHash = (Get-FileHash -LiteralPath $diag -Algorithm SHA256).Hash.ToLowerInvariant()
            $pagesObserved = [bool](Select-String -LiteralPath $diag -Pattern '^4: SMOKE_PAGES 61\s*$')
          }
          @{schema=1;source_sha=$env:GITHUB_SHA;exe_sha256=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant();diagnostics_sha256=$diagnosticHash;exit_code=$process.ExitCode;smoke_pages_61_observed=$pagesObserved} | ConvertTo-Json | Set-Content -LiteralPath 'build-evidence/deployed-all-pages.json' -Encoding utf8
          if ($process.ExitCode -ne 0) {
            if (Test-Path $diag) { Get-Content $diag | Select-Object -Last 160 }
            throw "Qt Quick startup failed: $($process.ExitCode)"
          }
          if (-not $pagesObserved) { throw 'Deployed all-pages smoke did not record the required 61 routes.' }
      - name: Exercise deployed QA routes with normal animation and VME context diagnostics

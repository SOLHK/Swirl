            ~/.cargo/git
            core/target
            build/swirl-quick
            build/swirl-product
          key: ${{ steps.build_cache.outputs.cache-primary-key }}
      - name: Start the production Release UI with cold and warm QML caches
        shell: pwsh
        env:
          SWIRL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          SWIRL_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          # The production smoke/font-review combination waits for each actual
          # route's Loader.Ready and transition settlement, rejects QML warnings
          # and uses isolated storage. A
          # plain launch does not honor SWIRL_TEST_ROOT, so do not claim this is
          # a normal user-session or physical Windows 11 desktop acceptance.
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QSG_RHI_BACKEND = 'd3d11'
          Remove-Item Env:QT_QUICK_BACKEND,Env:QT_SCALE_FACTOR,Env:QT_SCREEN_SCALE_FACTORS -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'installer-bin/Swirl.exe').Path
          $manifest = Get-Content -LiteralPath 'installer-bin/package-manifest.json' -Raw | ConvertFrom-Json
          $source = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA -or $manifest.source_sha -cne $source) { throw 'Production UI source identity differs from the tested checkout.' }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/production-ui'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:SWIRL_TEST_ROOT = Join-Path $env:RUNNER_TEMP ('swirl-production-ui-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $env:SWIRL_TEST_ROOT | Out-Null
          $qmlCacheRoot = [IO.Path]::GetFullPath((Join-Path $env:SWIRL_TEST_ROOT 'cache/qmlcache')).TrimEnd('\','/')
          function Get-QmlCacheSnapshot {
            $exists = Test-Path -LiteralPath $qmlCacheRoot -PathType Container
            $files = @()
            $directories = @()
            [long]$totalBytes = 0
            if ($exists) {
              $directories = @(Get-ChildItem -LiteralPath $qmlCacheRoot -Directory -Recurse -Force | Sort-Object FullName | ForEach-Object { $_.FullName.Substring($qmlCacheRoot.Length + 1).Replace('\','/') })
              $files = @(Get-ChildItem -LiteralPath $qmlCacheRoot -File -Recurse -Force | Sort-Object FullName | ForEach-Object {
                $totalBytes += $_.Length
                [ordered]@{ path=$_.FullName.Substring($qmlCacheRoot.Length + 1).Replace('\','/'); size=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); lastWriteUtc=$_.LastWriteTimeUtc.ToString('o') }
              })
            }
            return [ordered]@{ capturedUtc=[DateTime]::UtcNow.ToString('o'); root=$qmlCacheRoot; exists=$exists; directories=$directories; fileCount=$files.Count; totalBytes=$totalBytes; files=$files }
          }
          $diagnostic = Join-Path (Split-Path $exe) 'Swirl-diagnostics.txt'
          $launches = @()
          $previousCacheAfter = $null
          $previousCacheIdentity = $null
          try {
            foreach ($phase in @('cold-qml-cache', 'warm-same-qml-cache')) {
              $before = Get-QmlCacheSnapshot
              $handoff = $null
              if ($null -ne $previousCacheAfter) {
                $previousFiles = ConvertTo-Json -InputObject @($previousCacheAfter.files) -Depth 5 -Compress
                $currentFiles = ConvertTo-Json -InputObject @($before.files) -Depth 5 -Compress
                $handoff = [ordered]@{ previousAfterUtc=$previousCacheAfter.capturedUtc; currentBeforeUtc=$before.capturedUtc; sameFileInventory=($previousFiles -ceq $currentFiles); sameRuntimeCachePath=$null }
              }
              $result = [ordered]@{ phase=$phase; startedUtc=$null; finishedUtc=$null; durationMs=$null; exited=$false; exitCode=$null; diagnosticsPresent=$false; warningsOrErrors=$false; completedPages=0; readyPages=0; cacheIdentity=$null; cacheBefore=$before; cacheAfter=$null; cacheHandoff=$handoff; cacheHitVerified=$false; cacheObservation='not-observed'; cacheEvidenceError=$null; passed=$false }
              $process = $null
              $duration = [Diagnostics.Stopwatch]::new()
              try {
                if (Test-Path -LiteralPath $diagnostic) { Remove-Item -LiteralPath $diagnostic }
                $result.startedUtc = [DateTime]::UtcNow.ToString('o')
                $duration.Start()
                $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', '--font-review') -WorkingDirectory $env:SWIRL_TEST_ROOT -PassThru
                $result.exited = $process.WaitForExit(60000)
                $duration.Stop()
                $result.finishedUtc = [DateTime]::UtcNow.ToString('o')
                $result.durationMs = $duration.Elapsed.TotalMilliseconds
                if (-not $result.exited) { throw "Production UI $phase exceeded the existing 60-second smoke deadline." }
                $result.exitCode = $process.ExitCode
                if ($process.ExitCode -ne 0) { throw "Production UI $phase failed: $($process.ExitCode)" }
                $result.diagnosticsPresent = Test-Path -LiteralPath $diagnostic -PathType Leaf
                if (-not $result.diagnosticsPresent) { throw "Production UI $phase did not emit its startup diagnostics." }
                $result.warningsOrErrors = [bool](Select-String -LiteralPath $diagnostic -Pattern '^[123]:' -Quiet)
                if ($result.warningsOrErrors) { throw "Production UI $phase emitted Qt warnings or errors." }
                $cacheMarkers = @(Select-String -LiteralPath $diagnostic -Pattern '^4:\s+QML_CACHE_EVIDENCE\s+(\{.*\})\s*$')
                if ($cacheMarkers.Count -ne 1) { throw "Production UI $phase lacks its actual QML cache identity." }
                $result.cacheIdentity = $cacheMarkers[0].Matches[0].Groups[1].Value | ConvertFrom-Json
                $cachePath = [IO.Path]::GetFullPath([string]$result.cacheIdentity.path).TrimEnd('\','/')
                if (-not $cachePath.StartsWith($qmlCacheRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'The observed QML cache escaped the isolated cache root.' }
                if ($null -ne $handoff) { $handoff.sameRuntimeCachePath = $cachePath.Equals([IO.Path]::GetFullPath([string]$previousCacheIdentity.path).TrimEnd('\','/'), [StringComparison]::OrdinalIgnoreCase) }
                $completed = @(Select-String -LiteralPath $diagnostic -Pattern '^4:\s+SMOKE_PAGES\s+(\d+)\s*$')
                $ready = @(Select-String -LiteralPath $diagnostic -Pattern '^4:\s+FONT_SMOKE_ROUTE_READY\s+(\S+)\s+(\S+)\s*$')
                if ($completed.Count -ne 1) { throw "Production UI $phase lacks an unambiguous all-pages completion marker." }
                $result.completedPages = [int]$completed[0].Matches[0].Groups[1].Value
                $result.readyPages = $ready.Count
                if ($result.completedPages -le 0 -or $result.readyPages -ne $result.completedPages) { throw "Production UI $phase did not confirm every traversed route was ready." }
                foreach ($route in $ready) {
                  $requested = $route.Matches[0].Groups[1].Value.Trim('"')
                  $actual = $route.Matches[0].Groups[2].Value.Trim('"')
                  $expected = if ($requested -in @('requestlogs', 'dashboard')) { 'activity' } else { $requested }
                  if ($actual -cne $expected) { throw "Production UI $phase confirmed a different route: $requested -> $actual" }
                }
                $result.passed = $true
              } finally {
                if ($null -ne $process) {
                  if (-not $process.HasExited) { $process.Kill(); $null = $process.WaitForExit(5000) }
                  $process.Dispose()
                }
                if ($duration.IsRunning) { $duration.Stop() }
                if ($null -eq $result.finishedUtc) {
                  $result.finishedUtc = [DateTime]::UtcNow.ToString('o')
                  $result.durationMs = $duration.Elapsed.TotalMilliseconds
                }
                try {
                  $result.cacheAfter = Get-QmlCacheSnapshot
                  $result.cacheObservation = if ($result.cacheAfter.fileCount -gt 0) { 'disk-cache-files-observed; cache-hits-not-measured' } else { 'no-runtime-disk-cache-files-observed; AOT-or-no-disk-write-not-distinguished' }
                  $previousCacheAfter = $result.cacheAfter
                  $previousCacheIdentity = $result.cacheIdentity
                } catch {
                  $result.cacheEvidenceError = $_.Exception.Message
                  $result.passed = $false
                  throw
                } finally {
                  if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                    Copy-Item -LiteralPath $diagnostic -Destination (Join-Path $evidence ($phase + '.log'))
                  }
                  $launches += $result
                }
              }
            }
          } finally {
            [ordered]@{ source_sha=$source; pr_head_sha=$env:SWIRL_PR_HEAD_SHA; pr_base_sha=$env:SWIRL_PR_BASE_SHA; application_sha256=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant(); ui_tests_compiled=$false; qpa='windows'; requested_rhi='d3d11'; launches=$launches; cacheEvidenceScope='Actual process-reported QML cache identity and before/after file inventories under its isolated root. Reusing a directory or observing files does not prove cache hits; QML AOT may produce no runtime disk-cache files. Startup duration excludes inventory hashing and is not a benchmark.'; ordinary_user_session_verified=$false; physical_windows11_dpi_gpu_acceptance='not-run' } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidence 'startup.json') -Encoding utf8
          }
      - name: Exercise the production Release routes with normal animation
        shell: pwsh
        run: |
          ./scripts/tests/Test-WindowsFullMotionSmoke.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE -RuntimeDirectory installer-bin `
            -ReferenceExecutable build/swirl-product/Release/Swirl.exe `
            -OutputDirectory build-evidence/full-motion-release -ScratchRoot $env:RUNNER_TEMP `
            -WorkflowSha $env:GITHUB_SHA -PullRequestHeadSha '${{ github.event.pull_request.head.sha }}' `
            -ExpectedFlavor release
      - name: Install NSIS packaging tools
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress --limit-output
          $nsis = "C:/Program Files (x86)/NSIS/makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS installation failed" }
      - name: Build Chinese Swirl installer EXE
        shell: pwsh
        run: |
          $nsis = "C:/Program Files (x86)/NSIS/makensis.exe"
          $appDist = (Resolve-Path "installer-bin").Path
          $outDir = (Resolve-Path "out").Path
          $icon = (Resolve-Path "build/swirl-product/brand/Swirl.ico").Path
          $appVersion = (Get-Content -LiteralPath 'src/Swirl.Quick/PRODUCT_VERSION.txt' -Raw).Trim()
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid PRODUCT_VERSION.txt' }
          $uninstallList=Join-Path $outDir 'Swirl-UninstallFiles.nsh'
          ./scripts/Finalize-WindowsRustProduct.ps1 -ApplicationDirectory $appDist -EvidenceDirectory (Join-Path $outDir 'package-evidence') -UninstallList $uninstallList
          $repo=(Resolve-Path .).Path
          & $nsis /INPUTCHARSET UTF8 "/DAPP_DIST=$appDist" "/DOUT_DIR=$outDir" "/DAPP_ICON=$icon" "/DAPP_VERSION=$appVersion" "/DUNINSTALL_LIST=$uninstallList" "/DREPO_ROOT=$repo" "src/Swirl.Quick/packaging/Swirl.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed ($LASTEXITCODE)" }
          if (!(Test-Path "out/Swirl-Setup.exe")) { throw "Installer missing" }
          if ((Get-Item "out/Swirl-Setup.exe").Length -lt 10000000) { throw "Installer suspiciously small" }
          $exeVersion = (Get-Item -LiteralPath (Join-Path $appDist 'Swirl.exe')).VersionInfo.ProductVersionRaw.ToString()
          $installerVersion = (Get-Item -LiteralPath 'out/Swirl-Setup.exe').VersionInfo.ProductVersionRaw.ToString()
          if ($exeVersion -ne "$appVersion.0" -or $installerVersion -ne "$appVersion.0") { throw 'Source, application and installer versions disagree.' }
          $manifest = Get-Content -LiteralPath (Join-Path $appDist 'package-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:GITHUB_SHA) { throw 'Package source identity differs from this workflow commit.' }
          $scope = if ($env:SWIRL_CI_UI_ONLY -eq 'true') { 'ui-only' } else { 'full' }
          $networkRegression = if ($env:SWIRL_CI_NETWORK_CHANGE -eq 'true') { 'passed' } else { 'not-run-ui-only' }
          $qtProduct = Get-Content -LiteralPath $env:SWIRL_QT_SELECTED_RECEIPT -Raw -Encoding UTF8 | ConvertFrom-Json
          $qtSource = Get-Content -LiteralPath 'out/qt-corresponding-source/qt-source-bundle.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($qtProduct.consumer.source_sha -cne $env:GITHUB_SHA -or $qtSource.source_sha -cne $env:GITHUB_SHA -or
              $qtSource.status -cne 'complete') { throw 'Qt binary/source bundle is not paired with this product source.' }
          $qtDependency = [ordered]@{version=$qtProduct.qt_version;source_commit=$qtProduct.qt_source.commit;
            upstream_patch_commit=$qtProduct.qt_patch.upstream_commit;patch_sha256=$qtProduct.qt_patch.sha256;
            selected_content_id=$qtProduct.selected_content_id;derivation_id=$qtProduct.derivation_id;
            qml_dll=$qtProduct.qml_files.'bin/Qt6Qml.dll';producer_run=$qtProduct.producer.run;
            producer_artifact=$qtProduct.artifact.artifact;producer_workflow_conclusion=$qtProduct.original_workflow_conclusion}
          [ordered]@{source_sha=$env:GITHUB_SHA;pr_head_sha=$qtProduct.consumer.pr_head_sha;source_tree_sha=$qtProduct.consumer.tree_sha;
            version=$appVersion;qt=$env:SWIRL_QT_VERSION;qt_dependency=$qtDependency;qt_source_archive=$qtSource.archive;
            qt_source_manifest_sha256=(Get-FileHash -LiteralPath 'out/qt-corresponding-source/qt-source-bundle.json' -Algorithm SHA256).Hash.ToLowerInvariant();
            installer_sha256=(Get-FileHash -LiteralPath 'out/Swirl-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant();regression_scope=$scope;
            critical_ui_tests='passed';network_regression=$networkRegression;qa_full_motion_all_pages='passed-rapid-and-ready-61';
            product_full_motion_all_pages='passed-rapid-and-ready-61';scoped_full_regression='pending';desktop_dpi_acceptance='manual';
            physical_refresh_rate_acceptance='unverified'} | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath out/delivery.json -Encoding utf8
          python tools/Prepare-Qt612ProductSource.py verify-package --bundle-dir out/qt-corresponding-source --package-manifest installer-bin/package-manifest.json --delivery out/delivery.json
          if ($LASTEXITCODE -ne 0) { throw 'The actual installer, deployed Qt files and corresponding source bundle are not paired.' }
      - name: Verify actual production installer lifecycle in an isolated runner directory
        shell: pwsh
        env:
          SWIRL_DISPOSABLE_INSTALL_TEST: '1'
        run: |
          $env:SWIRL_NATIVE_TUN_ACCEPTANCE = if ($env:SWIRL_CI_NETWORK_CHANGE -eq 'true') { '1' } else { '0' }
          ./scripts/tests/Test-WindowsProductionInstaller.ps1 -Installer out/Swirl-Setup.exe -PackageDirectory installer-bin -ExpectedSourceSha $env:GITHUB_SHA -EvidenceDirectory build-evidence/installer-lifecycle
          $lifecycle = Get-Content -LiteralPath 'build-evidence/installer-lifecycle/lifecycle.json' -Raw | ConvertFrom-Json
          if (-not $lifecycle.success -or $lifecycle.source_sha -cne $env:GITHUB_SHA) { throw 'Actual production installer lifecycle evidence is incomplete.' }
          if ($env:SWIRL_NATIVE_TUN_ACCEPTANCE -eq '1' -and
              (-not $lifecycle.tun_pending_uninstall.verified -or -not $lifecycle.tun_pending_uninstall.marker_cleared_by_maintenance -or
               -not $lifecycle.tun_pending_uninstall.journal_empty_after -or -not $lifecycle.tun_pending_uninstall.original_marker_restored)) {
            throw 'Production TUN pending-marker uninstall did not prove its empty-journal maintenance boundary.'
          }
          $delivery = Get-Content -LiteralPath out/delivery.json -Raw | ConvertFrom-Json
          $delivery | Add-Member -NotePropertyName isolated_installer_lifecycle -NotePropertyValue 'passed' -Force
          $maintenance = if ($env:SWIRL_NATIVE_TUN_ACCEPTANCE -eq '1') { 'passed-empty-journal-only' } else { 'not-run-ui-only' }
          $delivery | Add-Member -NotePropertyName native_tun_maintenance_uninstall -NotePropertyValue $maintenance -Force
          $delivery | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath out/delivery.json -Encoding utf8
      - name: Verify normal installer ownership and cleanup as an actual standard user
        shell: pwsh
        env:
          SWIRL_DISPOSABLE_INSTALL_TEST: '1'
        run: |
          ./scripts/tests/Test-WindowsNormalInstaller.ps1 -Installer out/Swirl-Setup.exe -PackageDirectory installer-bin -ExpectedSourceSha $env:GITHUB_SHA -EvidenceDirectory build-evidence/normal-installer-lifecycle -NodeStoreHelper build/swirl-quick/Release/SwirlPrivateSubscriptionAcceptance.exe
          $lifecycle = Get-Content -LiteralPath 'build-evidence/normal-installer-lifecycle/lifecycle.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $runner = Get-Content -LiteralPath 'build-evidence/normal-installer-lifecycle/standard-user-runner.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($lifecycle.schema -ne 1 -or -not $lifecycle.success -or $lifecycle.source_sha -cne $env:GITHUB_SHA -or -not $lifecycle.normal_user_installation -or -not $lifecycle.non_admin_token_verified -or -not $lifecycle.negative_control.required_assertion_failed) { throw 'Actual normal standard-user installer lifecycle evidence is incomplete.' }
          if ($runner.schema -ne 1 -or -not $runner.success -or $runner.forced_termination) { throw 'The installer left temporary standard-user processes, accounts or native resources behind.' }
          $dpapi = $lifecycle.same_package_dpapi_store
          $upgrade = @($lifecycle.cases | Where-Object { $_.case.scenario -ceq 'upgrade' -and -not $_.case.negative })
          if ($null -eq $dpapi -or -not $dpapi.verified -or -not $dpapi.parent_host_scope_forwarded -or -not $dpapi.existing_store_create_refused -or
              $dpapi.scope -cne 'same-package-reinstall-synthetic-v1-node-store' -or $dpapi.previous_release_migration -ne $false -or
              $dpapi.helper_sha256 -cnotmatch '^[0-9a-f]{64}$' -or $dpapi.rust_build_id -cnotmatch '^[0-9a-f]{64}$' -or
              @($dpapi.stages).Count -ne 4 -or $upgrade.Count -ne 1) { throw 'Same-package synthetic DPAPI preservation evidence is missing or has the wrong scope.' }
          $baseline = $dpapi.stages[0].receipt
          foreach ($phase in @('before-reinstall','after-reinstall','after-normal-close','after-uninstall')) {
            $stage = @($dpapi.stages | Where-Object { $_.stage -ceq $phase })
            if ($stage.Count -ne 1) { throw "Missing exact DPAPI preservation phase: $phase" }
            $receipt = $stage[0].receipt
            if ($receipt.schema -ne 1 -or $receipt.kind -cne 'installer-node-store-fixture' -or $receipt.success -ne $true -or
                $receipt.scope -cne $dpapi.scope -or $receipt.operation -cne 'verify' -or $receipt.source_sha -cne $env:GITHUB_SHA -or
                $receipt.user_sid -cne $upgrade[0].case.user_sid -or $receipt.rust_build_id -cne $dpapi.rust_build_id -or
                $receipt.ordinary_profile -ne $true -or $receipt.host_scope_verified -ne $true -or $receipt.store_format -cne 'SWIRLNODE1' -or $receipt.store_write_attempted -ne $false -or
                $receipt.network_requests -ne 0 -or $receipt.engine_started -ne $false -or $receipt.dpapi_roundtrip_verified -ne $true -or
                $receipt.node_count -ne 2 -or $receipt.subscription_count -ne 1 -or $receipt.node_parameters_match -ne $true -or
                $receipt.selection_matches -ne $true -or $receipt.disabled_subscription_matches -ne $true -or
                $receipt.network_configuration_matches -ne $true -or $receipt.plaintext_absent -ne $true -or $receipt.read_only_reload -ne $true -or
                $receipt.ciphertext_sha256 -cnotmatch '^[0-9a-f]{64}$' -or $receipt.selection_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                $receipt.ciphertext_sha256 -cne $baseline.ciphertext_sha256 -or $receipt.selection_sha256 -cne $baseline.selection_sha256) {
              throw "DPAPI semantics, identity or exact preservation failed: $phase"
            }
          }
          $delivery = Get-Content -LiteralPath out/delivery.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $delivery | Add-Member -NotePropertyName normal_standard_user_installer_lifecycle -NotePropertyValue 'passed' -Force
          $delivery | Add-Member -NotePropertyName normal_standard_user_same_package_dpapi_preservation -NotePropertyValue 'passed-synthetic-v1-only' -Force
          $delivery | Add-Member -NotePropertyName previous_release_configuration_upgrade -NotePropertyValue 'not-run' -Force
          $delivery | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath out/delivery.json -Encoding utf8
      - name: Admit the explicitly requested previous-version installer
        if: contains(github.event.pull_request.labels.*.name, 'qa-cross-version-upgrade')
        shell: python
        env:
          SWIRL_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          import datetime, hashlib, json, os, pathlib, re, ssl, subprocess, urllib.error, urllib.parse, urllib.request, zipfile

          class Refused(Exception):
              pass

          def require(condition, code):
              if not condition:
                  raise Refused(code)

          def validate_scope(plan, event, environment):
              pr = event.get('pull_request', {})
              require(environment.get('GITHUB_EVENT_NAME') == 'pull_request' and environment.get('GITHUB_REPOSITORY') == 'SOLHK/Swirl', 'EventScopeMismatch')
              require(plan.get('schema') == 1 and plan.get('scope') == 'optional-pr61-synthetic-cross-version-installer-acceptance', 'InputScopeMismatch')
              require(plan.get('repository') == 'SOLHK/Swirl' and plan.get('pull_request') == 61 and event.get('number') == 61, 'RepositoryOrPrMismatch')
              require(plan.get('head_branch') == 'work/node-probe-render-20261105' and plan.get('base_branch') == 'test', 'InputBranchMismatch')
              require(pr.get('head', {}).get('ref') == plan['head_branch'] and pr.get('base', {}).get('ref') == 'test', 'PrBranchMismatch')
              require(pr.get('head', {}).get('repo', {}).get('full_name') == 'SOLHK/Swirl' and pr.get('base', {}).get('repo', {}).get('full_name') == 'SOLHK/Swirl', 'ForkOrBaseRepositoryRejected')
              require(plan.get('opt_in_label') == 'qa-cross-version-upgrade' and plan['opt_in_label'] in [x.get('name') for x in pr.get('labels', [])], 'ExplicitQaOptInRequired')
              old = plan.get('baseline', {})
              require(plan.get('candidate_version') == '0.2.40' and old.get('version') == '0.2.39', 'VersionPairMismatch')
              require(re.fullmatch('[0-9a-f]{40}', old.get('source_sha', '')) is not None, 'BaselineSourceInvalid')
              for field in ('run_id', 'artifact_id', 'zip_bytes', 'exe_bytes'):
                  require(type(old.get(field)) is int and 0 < old[field] < 100_000_000_000, 'BaselineNumericInputInvalid')
              require(old['zip_bytes'] < 100_000_000 and old['exe_bytes'] < 100_000_000 and old.get('exe_name') == 'Swirl-Setup.exe' and old.get('artifact_name') == 'Swirl-Windows-Installer-EXE', 'BaselinePayloadInputInvalid')
              for field in ('zip_sha256', 'exe_sha256', 'package_manifest_sha256', 'application_sha256', 'rust_build_id'):
                  require(re.fullmatch('[0-9a-f]{64}', old.get(field, '')) is not None, 'BaselineDigestInvalid')
              require(set(plan.get('identical_persistence_sources', {})) == {'src/Swirl.Quick/engine/NodeStore.cpp', 'src/Swirl.Quick/engine/NodeStore.h'}, 'PersistenceInputMismatch')

          def validate_artifact(old, run, artifact):
              require(run.get('id') == old['run_id'] and run.get('repository', {}).get('full_name') == 'SOLHK/Swirl', 'BaselineRunRepositoryMismatch')
              require(run.get('status') == 'completed' and run.get('conclusion') == 'success' and run.get('event') == 'push' and run.get('head_branch') == 'test' and run.get('head_sha') == old['source_sha'], 'BaselineRunNotFinalSuccess')
              require(run.get('path') == '.github/workflows/build-qt-quick-ui.yml', 'BaselineWorkflowMismatch')
              owner = artifact.get('workflow_run', {})
              require(artifact.get('id') == old['artifact_id'] and artifact.get('name') == old['artifact_name'] and owner.get('id') == old['run_id'] and owner.get('head_sha') == old['source_sha'] and owner.get('head_branch') == 'test', 'BaselineArtifactIdentityMismatch')
              require(owner.get('repository_id') == run['repository']['id'] and owner.get('head_repository_id') == run['repository']['id'], 'BaselineArtifactRepositoryMismatch')
              require(artifact.get('expired') is False and datetime.datetime.fromisoformat(artifact['expires_at'].replace('Z', '+00:00')) > datetime.datetime.now(datetime.timezone.utc), 'BaselineArtifactExpired')
              require(artifact.get('size_in_bytes') == old['zip_bytes'] and artifact.get('digest') == 'sha256:' + old['zip_sha256'], 'BaselineArtifactDigestMismatch')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, new_url):
                  return None

          def safe_blob_location(location):
              parsed = urllib.parse.urlsplit(location or '')
              require(parsed.scheme == 'https' and parsed.username is None and parsed.password is None and parsed.port in (None, 443), 'ArtifactRedirectTlsRejected')
              require(parsed.hostname is not None and (parsed.hostname.endswith('.blob.core.windows.net') or parsed.hostname.endswith('.actions.githubusercontent.com')), 'ArtifactRedirectHostRejected')
              return location

          def github_request(path):
              # The credential is restricted to this exact API origin/path.
              request = urllib.request.Request('https://api.github.com/repos/SOLHK/Swirl/' + path, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'Swirl-offline-upgrade-QA', 'X-GitHub-Api-Version': '2022-11-28'})
              request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['SWIRL_ARTIFACT_READ_TOKEN'])
              return request

          def api_json(opener, path):
              with opener.open(github_request(path), timeout=30) as response:
                  raw = response.read(2_000_001)
              require(len(raw) <= 2_000_000, 'GithubMetadataTooLarge')
              return json.loads(raw)

          def extract_exact_installer(archive, output, old):
              with zipfile.ZipFile(archive) as package:
                  entries = package.infolist()
                  require(len(entries) == 1 and entries[0].filename == old['exe_name'] and not entries[0].is_dir() and entries[0].file_size == old['exe_bytes'], 'ArchiveInventoryMismatch')
                  target = output / old['exe_name']
                  digest = hashlib.sha256()
                  count = 0
                  with package.open(entries[0]) as incoming, target.open('xb') as destination:
                      while block := incoming.read(1_048_576):
                          count += len(block)
                          require(count <= old['exe_bytes'], 'InstallerSizeExceeded')
                          digest.update(block)
                          destination.write(block)
                  require(count == old['exe_bytes'] and digest.hexdigest() == old['exe_sha256'], 'InstallerDigestMismatch')
              return target

          def main():
              input_path = pathlib.Path('docs/qa/upgrade-0239-to-0240-baseline.json').resolve()
              input_bytes = input_path.read_bytes()
              plan = json.loads(input_bytes)
              event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              validate_scope(plan, event, os.environ)
              old = plan['baseline']
              source = subprocess.run(['git', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True).stdout.strip()
              require(source == os.environ['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}', source) is not None, 'CandidateCheckoutMismatch')
              require(pathlib.Path('src/Swirl.Quick/PRODUCT_VERSION.txt').read_text().strip() == plan['candidate_version'], 'CandidateVersionMismatch')
              if subprocess.run(['git', 'cat-file', '-e', old['source_sha'] + '^{commit}'], capture_output=True).returncode:
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', old['source_sha']], check=True, capture_output=True)
              require(subprocess.run(['git', 'show', old['source_sha'] + ':src/Swirl.Quick/PRODUCT_VERSION.txt'], check=True, capture_output=True, text=True).stdout.strip() == old['version'], 'BaselineSourceVersionMismatch')
              for path, blob in plan['identical_persistence_sources'].items():
                  require(re.fullmatch('[0-9a-f]{40}', blob) is not None, 'PersistenceBlobInvalid')
                  for revision in (old['source_sha'], source):
                      actual = subprocess.run(['git', 'rev-parse', revision + ':' + path], check=True, capture_output=True, text=True).stdout.strip()
                      require(actual == blob, 'PersistenceSourceChanged')
              opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              run = api_json(opener, 'actions/runs/' + str(old['run_id']))
              artifact = api_json(opener, 'actions/artifacts/' + str(old['artifact_id']))
              validate_artifact(old, run, artifact)
              try:
                  opener.open(github_request('actions/artifacts/' + str(old['artifact_id']) + '/zip'), timeout=30).close()
                  raise Refused('ArtifactRedirectRequired')
              except urllib.error.HTTPError as redirect:
                  require(redirect.code in (302, 303, 307, 308), 'ArtifactApiDownloadRejected')
                  location = safe_blob_location(redirect.headers.get('Location'))
                  redirect.close()
              output = pathlib.Path(os.environ['RUNNER_TEMP']) / ('swirl-cross-version-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              output.mkdir(exist_ok=False)
              archive = output / 'baseline.zip'
              digest = hashlib.sha256()
              count = 0
              # Fresh request, no Authorization header, no automatic redirect.
              # Neither the signed URL nor exception URL enters public output.
              with opener.open(urllib.request.Request(location), timeout=60) as response, archive.open('xb') as destination:
                  require(response.status == 200, 'ArtifactBlobStatusRejected')
                  while block := response.read(1_048_576):
                      count += len(block)
                      require(count <= old['zip_bytes'], 'ArtifactSizeExceeded')
                      digest.update(block)
                      destination.write(block)
              require(count == old['zip_bytes'] and digest.hexdigest() == old['zip_sha256'], 'ArtifactZipDigestMismatch')
              installer = extract_exact_installer(archive, output, old)
              admission = {'schema': 1, 'success': True, 'input_sha256': hashlib.sha256(input_bytes).hexdigest(), 'candidate_source_sha': source, 'candidate_head_sha': event['pull_request']['head']['sha'], 'candidate_version': plan['candidate_version'], 'baseline_source_sha': old['source_sha'], 'baseline_version': old['version'], 'run_id': old['run_id'], 'artifact_id': old['artifact_id'], 'run_final_conclusion': run['conclusion'], 'artifact_expires_at': artifact['expires_at'], 'zip_sha256': digest.hexdigest(), 'zip_bytes': count, 'exe_sha256': old['exe_sha256'], 'exe_bytes': installer.stat().st_size, 'persistence_sources_verified': True, 'original_private_data_used': False, 'provider_requests': 0}
              evidence = pathlib.Path('build-evidence/cross-version-baseline.json')
              evidence.write_text(json.dumps(admission, indent=2) + '\n', encoding='utf-8')
              with pathlib.Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as environment:
                  environment.write('SWIRL_UPGRADE_BASELINE_EXE=' + str(installer.resolve()) + '\n')
              print('Explicit baseline run/source/version, complete ZIP and EXE hashes admitted; no provider traffic.')

          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  reason = str(error) if isinstance(error, Refused) else ('HttpStatus' + str(error.code) if isinstance(error, urllib.error.HTTPError) else type(error).__name__)
                  print('Cross-version baseline refused: ' + reason)
                  pathlib.Path('build-evidence/cross-version-baseline-failure.json').write_text(json.dumps({'success': False, 'source_sha': os.environ.get('GITHUB_SHA'), 'failure_code': reason}) + '\n', encoding='utf-8')
                  raise SystemExit(1) from None
      - name: Verify the opted-in actual 0.2.39 to 0.2.40 upgrade
        if: contains(github.event.pull_request.labels.*.name, 'qa-cross-version-upgrade')
        shell: pwsh
        env:
          SWIRL_DISPOSABLE_INSTALL_TEST: '1'
        run: |
          ./scripts/tests/Test-WindowsNormalInstaller.ps1 -Installer out/Swirl-Setup.exe -PackageDirectory installer-bin -ExpectedSourceSha $env:GITHUB_SHA -EvidenceDirectory build-evidence/cross-version-installer-lifecycle -NodeStoreHelper build/swirl-quick/Release/SwirlPrivateSubscriptionAcceptance.exe -CrossVersionInput docs/qa/upgrade-0239-to-0240-baseline.json -BaselineInstaller $env:SWIRL_UPGRADE_BASELINE_EXE -BaselineAdmission build-evidence/cross-version-baseline.json
          $upgrade = Get-Content -LiteralPath build-evidence/cross-version-installer-lifecycle/cross-version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($upgrade.schema -ne 1 -or -not $upgrade.success -or $upgrade.source_sha -cne $env:GITHUB_SHA -or
              $upgrade.scope -cne 'actual-0239-to-0240-installers-with-current-helper-synthetic-v1-data' -or $upgrade.original_private_profile_tested -ne $false -or
              -not $upgrade.case.cross_version_upgrade.verified -or -not $upgrade.host_system_proxy_unchanged -or
              -not $upgrade.standard_user.success -or $upgrade.standard_user.remaining_job_processes -ne 0 -or $upgrade.standard_user.forced_termination) { throw 'Explicit cross-version installer acceptance is incomplete.' }
          foreach ($phase in @('before-old-start','after-old-close','after-cross-version-install','after-new-normal-close','after-uninstall')) {
            $observed = @($upgrade.case.dpapi_store_preservation.stages | Where-Object { $_.stage -ceq $phase })
            if ($observed.Count -ne 1 -or -not $observed[0].receipt.success -or $observed[0].receipt.source_sha -cne $env:GITHUB_SHA -or
                $observed[0].receipt.network_requests -ne 0 -or $observed[0].receipt.engine_started -ne $false) { throw 'Cross-version offline phase identity is incomplete.' }
          }
          $delivery = Get-Content -LiteralPath out/delivery.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $delivery | Add-Member -NotePropertyName previous_release_configuration_upgrade -NotePropertyValue 'passed-0.2.39-to-0.2.40-current-helper-synthetic-v1-only' -Force
          $delivery | Add-Member -NotePropertyName previous_release_baseline_source_sha -NotePropertyValue $upgrade.baseline.source_sha -Force
          $delivery | Add-Member -NotePropertyName previous_release_baseline_installer_sha256 -NotePropertyValue $upgrade.baseline.exe_sha256 -Force
          $delivery | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath out/delivery.json -Encoding utf8

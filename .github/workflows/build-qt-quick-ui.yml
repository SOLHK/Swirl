      - name: Verify authenticated product broker control without starting TUN
        if: env.SWIRL_CI_NETWORK_CHANGE == 'true'
        shell: pwsh
        run: |
          # This managed Windows runner must already have its administrator
          # token. Never open a new UAC prompt or recover an existing owner.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Broker control CI requires an already-elevated runner token.' }
          } finally { $identity.Dispose() }
          . ./scripts/RustProductPackagePolicy.ps1
          $journal = Join-Path ([Environment]::GetFolderPath('CommonApplicationData')) 'Swirl/NativeTun'
          Assert-SwirlPathWithoutLinks $journal
          if ((Test-Path -LiteralPath $journal) -and
              (-not (Test-Path -LiteralPath $journal -PathType Container) -or @(Get-ChildItem -LiteralPath $journal -Force).Count -ne 0)) {
            throw 'Existing Swirl TUN state must not enter this control-only CI fixture.'
          }
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'build/swirl-quick/native-tun-broker-control'
          $report = Join-Path $fixture 'report.json'
          try {
            # The separate test fixture truthfully retains UI hooks. Its files
            # and manifest never replace the later production-hooks-OFF stage.
            ./scripts/New-NativeTunBrokerControlFixture.ps1 -BuildDirectory build/swirl-quick -UiRuntimeDirectory dist -WintunArchivePath build/swirl-product/dependency-cache/wintun-0.14.1.zip
            $junit = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/native-tun-broker-control.xml'
            ctest --test-dir build/swirl-quick -C Release -R '^swirl-native-tun-broker-control$' --output-on-failure --no-tests=error --output-junit $junit
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated broker control checks failed.' }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if (-not $result.success -or $result.kind -cne 'native-tun-broker-control-test' -or
                $result.source_sha -cne $env:GITHUB_SHA -or -not $result.ui_test_hooks -or $result.native_tun_start_invoked -ne $false) {
              throw 'Broker control evidence is missing its exact source or test-only scope.'
            }
            Write-Host 'Authenticated broker and loopback Core control passed; adapter creation and TUN forwarding were not exercised.'
          } finally {
            if (Test-Path -LiteralPath $report -PathType Leaf) { Copy-Item -LiteralPath $report -Destination build-evidence/native-tun-broker-control.json }
            $marker = Join-Path $fixture 'fixture.json'
            if (Test-Path -LiteralPath $marker -PathType Leaf) { Copy-Item -LiteralPath $marker -Destination build-evidence/native-tun-broker-control-fixture.json }
          }
      - name: Prove normal proxy-stop ordering against the old production controller

        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $diagnostic = Join-Path (Split-Path $exe) 'Swirl-input-diagnostics.txt'
          if (Test-Path -LiteralPath $diagnostic) { Remove-Item -LiteralPath $diagnostic -Force }
          try {
            $process = Start-Process -FilePath $exe -ArgumentList "--interaction-test" -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $diagnostic -ErrorAction SilentlyContinue
              throw "Overview input checks failed: $($process.ExitCode)"
            }
          } finally {
            if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
              Copy-Item -LiteralPath $diagnostic -Destination 'build-evidence/overview-input.log' -Force
            }
          }
      - name: Loopback HTTP capture checks against deployed Qt runtime
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path

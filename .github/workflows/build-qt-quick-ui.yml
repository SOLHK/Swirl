          if ($LASTEXITCODE -ne 0) { throw 'Deployed QA Qt runtime differs from the selected SDK.' }
          python tools/Compose-Qt612ProductSdk.py verify --receipt $env:SWIRL_QT_SELECTED_RECEIPT --build-dir build/swirl-quick --phase post-deploy --runtime-dir build/swirl-quick/Release --evidence build-evidence/qt-product-qa-ctest
          if ($LASTEXITCODE -ne 0) { throw 'CTest Qt runtime differs from the selected SDK.' }

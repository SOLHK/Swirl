name: Build Swirl Qt Quick UI (Preview)

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

concurrency:
  group: swirl-quick-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-qt-ui:
    runs-on: windows-2022
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout original repository and UI branch
        uses: actions/checkout@v4
      - name: Validate scoped Codex proxy launcher
        shell: pwsh
        run: ./tools/tests/Test-CodexProxyLauncher.ps1
      - name: Install Rust MSVC tools
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Set up Qt desktop SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent network test certificate support
        run: python -m pip install cryptography==50.0.2
      - name: Configure Qt UI independently
        shell: pwsh
        run: cmake -S src/Swirl.Quick -B build/swirl-quick -G "Visual Studio 17 2022" -A x64 -DSWIRL_BUILD_UI_TESTS=ON -DSWIRL_TEST_FONT_DIRECTORY="${{ github.workspace }}/build/swirl-quick/Release/lib/fonts"
      - name: Build UI
        shell: pwsh
        run: cmake --build build/swirl-quick --config Release --parallel
      - name: Bundle UI runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/swirl-quick/Release/Swirl.exe dist/
          Copy-Item build/swirl-quick/Release/swirl_api.dll,build/swirl-quick/Release/swirl-rust-build.json dist/
          Copy-Item build/swirl-quick/Release/SwirlProxyGuard.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlGatewayGuard.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlScriptRunner.exe dist/
          Copy-Item build/swirl-quick/Release/SwirlCodexLauncher.exe dist/
          Copy-Item tools/SwirlCodexManage.py,tools/SubscriptionCapture.py dist/
          Copy-Item src/Swirl.Quick/packaging/rules dist/rules -Recurse
          Copy-Item src/Swirl.Quick/packaging/rules build/swirl-quick/Release/rules -Recurse
          windeployqt --release --qmldir src/Swirl.Quick/qml dist/Swirl.exe
      # Qt's offscreen QPA font database reads appdir/lib/fonts and does not
      # automatically discover the fonts installed on a Windows CI runner.
      # These fixtures are used for synthetic screenshot tests ONLY.
      - name: Stage temporary offscreen screenshot fonts
        shell: pwsh
        run: |
          $fontDir = Join-Path (Resolve-Path "dist").Path "lib/fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          $latin = @("$env:WINDIR/Fonts/segoeui.ttf", "$env:WINDIR/Fonts/arial.ttf") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$latin) { throw "No Latin fallback font found on the Windows runner." }
          Copy-Item -LiteralPath $latin -Destination $fontDir
          # Noto Sans SC is licensed under SIL OFL 1.1 and contains both
          # Simplified Chinese and Latin glyphs. Pin the source revision.
          $notoUrl = "https://raw.githubusercontent.com/google/fonts/bd8f81ddb5c74d5c8897b36ad88b440266245103/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          $notoFile = Join-Path $fontDir "NotoSansSC-VF.ttf"
          Invoke-WebRequest -Uri $notoUrl -OutFile $notoFile -ErrorAction Stop
          if ((Get-Item $notoFile).Length -lt 10000000) { throw "Noto Sans SC fixture download is incomplete." }
          Write-Host "Qt offscreen font fixtures ready; they will NOT be included in the artifact."
          # CTest launches Swirl from the build directory, separate from dist.
          New-Item -ItemType Directory -Force "build/swirl-quick/Release/lib" | Out-Null
          Copy-Item -LiteralPath $fontDir -Destination "build/swirl-quick/Release/lib/fonts" -Recurse -Force
      - name: Engine, stream and QML regression checks
        shell: pwsh
        run: |
          # Include registered stream, shared-element and settings regressions.
          # Later steps run the three excluded UI/capture drivers against dist.
          # System proxy recovery needs a separately controlled test environment.
          ctest --test-dir build/swirl-quick -C Release -E "^swirl-(system-proxy-recovery|overview-input|all-pages|capture-network)$" --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            Get-Content build/swirl-quick/engine-contract.txt, build/swirl-quick/engine-real.txt -ErrorAction SilentlyContinue
            throw "Engine checks failed"
          }
      - name: Upload engine test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Engine-Test-Evidence
          path: |
            build/swirl-quick/Testing/Temporary/LastTest.log
            build/swirl-quick/engine-contract.txt
            build/swirl-quick/engine-real.txt
            build/swirl-quick/node-chain.txt
            build/swirl-quick/import-subscription.txt
            build/swirl-quick/native-engine.txt
            build/swirl-quick/stream-regression.txt
            build/swirl-quick/subscription-formats.txt
            build/swirl-quick/Release/Swirl-appearance.txt
            build/swirl-quick/Release/Swirl-appearance-restore.txt
            build/swirl-quick/motion-report.json
            build/swirl-quick/hero-evidence/
            build/swirl-quick/Release/Swirl-diagnostics.txt
            build/swirl-quick/Release/Swirl-node-ui-diagnostics.txt
            build/swirl-quick/Release/Swirl-motion-diagnostics.txt
            build/swirl-quick/Release/Swirl-hero-diagnostics.txt
          if-no-files-found: warn
      - name: Overview mouse and keyboard input checks
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--interaction-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            Get-Content "dist/Swirl-diagnostics.txt" -ErrorAction SilentlyContinue
            throw "Overview input checks failed: $($process.ExitCode)"
          }
      - name: Loopback HTTP capture integration checks
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--capture-self-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            Get-Content "dist/Swirl-diagnostics.txt" -ErrorAction SilentlyContinue
            throw "HTTP capture checks failed: $($process.ExitCode)"
          }
      - name: Startup smoke test (offscreen, capture remains off)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          # GUI-subsystem executables return immediately from PowerShell's '&' invocation.
          # Explicitly wait for the real Qt process so smoke tests cannot false-pass.
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            $diag = Join-Path (Resolve-Path "dist").Path "Swirl-diagnostics.txt"
            if (Test-Path $diag) { Get-Content $diag | Select-Object -Last 160 }
            throw "Qt Quick startup failed: $($process.ExitCode)"
          }
      - name: Check Qt Quick UI previews at multiple sizes and scales
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $exe = (Resolve-Path "dist/Swirl.exe").Path
          New-Item -ItemType Directory -Force -Path preview-diagnostics | Out-Null
          Add-Type -AssemblyName System.Drawing
          $previews = @(
            @{ file = "Swirl-Overview-preview.png"; page = "overview"; theme = "light"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-Overview-125-preview.png"; page = "overview"; theme = "light"; size = "1464x930"; scale = "1.25" },
            @{ file = "Swirl-Overview-150-preview.png"; page = "overview"; theme = "light"; size = "1464x930"; scale = "1.5" },
            @{ file = "Swirl-Overview-200-preview.png"; page = "overview"; theme = "light"; size = "1464x930"; scale = "2" },
            @{ file = "Swirl-Minimum-preview.png"; page = "overview"; theme = "light"; size = "1000x650"; scale = "1" },
            @{ file = "Swirl-Minimum-bottom-preview.png"; page = "overview"; theme = "light"; size = "1000x650"; scale = "1.5"; bottom = $true },
            @{ file = "Swirl-Compact-preview.png"; page = "overview"; theme = "light"; size = "800x560"; scale = "1" },
            @{ file = "Swirl-Compact-200-preview.png"; page = "overview"; theme = "light"; size = "800x560"; scale = "2" },
            @{ file = "Swirl-Large-preview.png"; page = "overview"; theme = "light"; size = "1920x1219"; scale = "1" },
            @{ file = "Swirl-Inspector-preview.png"; page = "inspector"; theme = "dark"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-ModuleHub-preview.png"; page = "featurehub"; theme = "light"; size = "1464x930"; scale = "1" },
            @{ file = "Swirl-DHCP-preview.png"; page = "feature-dhcp"; theme = "light"; size = "1464x930"; scale = "1" }
          )
          foreach ($preview in $previews) {
            # Offscreen Windows QPA uses DPR 1; QT_SCALE_FACTOR gives effective scale.
            $env:QT_SCALE_FACTOR = $preview.scale
            $path = Join-Path (Resolve-Path "dist").Path $preview.file
            $args = @("--capture-preview=$path", "--preview-page=$($preview.page)", "--preview-theme=$($preview.theme)", "--preview-size=$($preview.size)")
            if ($preview.bottom) { $args += "--preview-scroll-bottom" }
            $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru -NoNewWindow
            $diag = Join-Path (Resolve-Path "dist").Path "Swirl-diagnostics.txt"
            if (!(Test-Path $diag)) { throw "Missing Qt Quick preview diagnostics: $($preview.file)" }
            Copy-Item -LiteralPath $diag -Destination "preview-diagnostics/$($preview.file).log"
            if ($process.ExitCode -ne 0) {
              Get-Content $diag | Select-Object -Last 160
              throw "Qt Quick preview exited with $($process.ExitCode)"
            }
            # QtMsgType 1/2/3 are warning/critical/fatal. Preview exit 0 alone is insufficient.
            if (Select-String -LiteralPath $diag -Pattern '^[123]:') {
              Get-Content $diag
              throw "Qt Quick preview emitted warnings or errors: $($preview.file)"
            }
            if (!(Test-Path $path)) { throw "Missing screenshot: $path" }
            if ((Get-Item $path).Length -lt 2048) { throw "Screenshot is suspiciously small: $path" }
            $size = $preview.size.Split('x')
            $expectedWidth = [Math]::Round([int]$size[0] * [double]$preview.scale, [MidpointRounding]::AwayFromZero)
            $expectedHeight = [Math]::Round([int]$size[1] * [double]$preview.scale, [MidpointRounding]::AwayFromZero)
            $image = [System.Drawing.Image]::FromFile($path)
            try {
              if ($image.Width -ne $expectedWidth -or $image.Height -ne $expectedHeight) {
                throw "Unexpected preview DPI: $($image.Width)x$($image.Height), expected ${expectedWidth}x${expectedHeight}"
              }
            } finally { $image.Dispose() }
            Write-Host "Verified Qt screenshot: $path (${expectedWidth}x${expectedHeight})"
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Upload Qt Quick preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Quick-Preview-Diagnostics
          path: preview-diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload rendered Qt Quick UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Quick-UI-Previews
          path: dist/Swirl-*-preview.png
          if-no-files-found: warn
          retention-days: 14
      - name: Remove CI-only font fixtures from portable ZIP
        if: always()
        shell: pwsh
        run: |
          $fonts = "dist/lib/fonts"
          if (Test-Path $fonts) { Remove-Item -LiteralPath $fonts -Recurse -Force }
          if (Test-Path $fonts) { throw "Test fonts must not be distributed in Swirl preview." }
      - name: Build and verify independent production files
        shell: pwsh
        run: |
          cmake -S src/Swirl.Quick -B build/swirl-product -G "Visual Studio 17 2022" -A x64 -DSWIRL_BUILD_UI_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Production configure failed.' }
          cmake --build build/swirl-product --config Release --target Swirl --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed.' }
          ./scripts/Stage-WindowsRustProduct.ps1 -BuildDirectory build/swirl-product -Destination installer-bin
          New-Item -ItemType Directory -Force -Path out | Out-Null
      - name: Install NSIS packaging tools
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress --limit-output
          $nsis = "C:/Program Files (x86)/NSIS/makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS installation failed" }
      - name: Build Chinese Swirl installer EXE
        shell: pwsh
        run: |
          $nsis = "C:/Program Files (x86)/NSIS/makensis.exe"
          $appDist = (Resolve-Path "installer-bin").Path
          $outDir = (Resolve-Path "out").Path
          $icon = (Resolve-Path "build/swirl-product/brand/Swirl.ico").Path
          $appVersion = (Get-Content -LiteralPath 'src/Swirl.Quick/PRODUCT_VERSION.txt' -Raw).Trim()
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid PRODUCT_VERSION.txt' }
          $uninstallList=Join-Path $outDir 'Swirl-UninstallFiles.nsh'
          ./scripts/Finalize-WindowsRustProduct.ps1 -ApplicationDirectory $appDist -EvidenceDirectory (Join-Path $outDir 'package-evidence') -UninstallList $uninstallList
          $repo=(Resolve-Path .).Path
          & $nsis /INPUTCHARSET UTF8 "/DAPP_DIST=$appDist" "/DOUT_DIR=$outDir" "/DAPP_ICON=$icon" "/DAPP_VERSION=$appVersion" "/DUNINSTALL_LIST=$uninstallList" "/DREPO_ROOT=$repo" "src/Swirl.Quick/packaging/Swirl.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed ($LASTEXITCODE)" }
          if (!(Test-Path "out/Swirl-Setup.exe")) { throw "Installer missing" }
          if ((Get-Item "out/Swirl-Setup.exe").Length -lt 10000000) { throw "Installer suspiciously small" }
      - name: Upload Swirl Windows installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Windows-Installer-EXE
          path: out/Swirl-Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload separate Qt UI preview
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Quick-UI-win-x64
          path: installer-bin/
          if-no-files-found: error
          retention-days: 14

  publish-test-exe:
    name: Publish standalone test installer EXE
    needs: build-qt-ui
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified EXE (not a ZIP download for users)
        uses: actions/download-artifact@v4
        with:
          name: Swirl-Windows-Installer-EXE
          path: release
      - name: Upload direct EXE to GitHub prerelease from test commit only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/Swirl-Setup.exe
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="swirl-qt-test-${SHORT_SHA}"
          gh release create "${TAG}" "release/Swirl-Setup.exe#Swirl-Setup.exe" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Swirl · 测试版 ${SHORT_SHA}" \
            --notes "Windows 开发测试版：C++23 / Qt Quick，Swirl 自研 Rust 唯一代理内核，真实节点与订阅、路由和网络活动监控、本机 HTTP/HTTPS 调试。系统代理和证书信任需用户明确启用；TUN、LAN 和网关转发尚未支持；高级协议与实际网络环境的验证范围请查阅随版本文档。没有演示联网成功，未实现功能保持禁用。请勿作为正式版本使用。" \
            --prerelease

      - name: Refuse legacy live QA entry before private paths or self-test dispatch
        shell: pwsh
        run: |
          python tools/tests/test_runtime_acceptance_refusal.py --executable dist/Swirl.exe --expected-source $env:GITHUB_SHA --flavor qa --output build-evidence/runtime-refusal-qa --powershell (Get-Command powershell.exe -ErrorAction Stop).Source --powershell (Get-Command pwsh -ErrorAction Stop).Source
          if ($LASTEXITCODE -ne 0) { throw 'The actual QA executable or legacy PowerShell launcher admitted an unguarded runtime entry.' }
      - name: Verify bounded isolated UI node sessions against owned loopback fixtures
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/tests/test_controlled_node_acceptance.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Controlled UI admission and process retirement checks failed.' }
          $exe = (Resolve-Path 'dist/Swirl.exe').Path
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $coreHash = (Get-FileHash -LiteralPath 'dist/swirl_api.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $fixture = (Resolve-Path 'src/Swirl.Quick/tests/fixtures').Path
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-evidence/controlled-node-sessions'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $admissionModes = @('missing-proof','missing-fixture','preexisting-store','wrong-proof')
          foreach ($mode in (@('positive','wrong-ca','stall','native-watchdog-500ms') + $admissionModes)) {
            $output = Join-Path $env:RUNNER_TEMP ('swirl-controlled-' + $mode + '-' + [guid]::NewGuid().ToString('N'))
            $arguments = @('tools/RunControlledNodeAcceptance.py','--exe',$exe,'--exe-sha256',$exeHash,'--core-sha256',$coreHash,'--expected-source',$env:GITHUB_SHA,'--output-directory',$output,'--qt-root',$env:QT_ROOT_DIR,'--fixture-directory',$fixture)
            if ($mode -eq 'wrong-ca') { $arguments += '--fixture-wrong-ca' }
            if ($mode -in @('stall','native-watchdog-500ms')) { $arguments += '--fixture-stall' }
            if ($mode -eq 'native-watchdog-500ms') { $arguments += '--fixture-native-watchdog-500ms' }
            if ($mode -in $admissionModes) { $arguments += @('--fixture-admission-control',$mode) }
            python @arguments
            $exitCode = $LASTEXITCODE
            $summaryPath = Join-Path $output 'summary.json'
            if (!(Test-Path -LiteralPath $summaryPath -PathType Leaf)) { throw "Missing synthetic UI receipt: $mode" }
            Copy-Item -LiteralPath $summaryPath -Destination (Join-Path $evidence ($mode + '.json'))
            $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
            if ($summary.cases.Count -ne 1 -or $summary.liveReady -ne $false -or
                !$summary.trafficAccountingRequiredForLive -or $summary.persistentBudgetGuardExercised -ne $false -or
                $summary.uiSubscriptionImportExercised -ne $false -or $summary.uiPolicySelectionExercised -ne $false) {
              throw "Synthetic UI scope was not preserved: $mode"
            }
            $case = $summary.cases[0]
            if (!$summary.fixtureOnly -or !$summary.fixture.tasksReleased -or !$case.retirement.processSignaled -or !$case.retirement.ownedJobEmpty -or $case.retirement.error) { throw "Incomplete synthetic UI retirement: $mode" }
            $expectedNativeControl = 0
            if ($mode -eq 'native-watchdog-500ms') { $expectedNativeControl = 1 }
            if ($case.retirement.nativeWatchdog.controlCode -ne $expectedNativeControl) { throw "Native watchdog contract mismatch: $mode" }
            if ($mode -eq 'positive' -and ($exitCode -ne 0 -or !$summary.passed)) { throw 'Selected-node UI HTTP/HTTPS positive control failed.' }
            if ($mode -eq 'wrong-ca' -and ($exitCode -ne 2 -or $summary.passed -or !@($case.result.proxyRequests | Where-Object tlsRejected).Count)) { throw 'Actual UI TLS rejection control failed.' }
            if ($mode -eq 'stall' -and ($exitCode -ne 2 -or $summary.passed -or !$case.retirement.timedOut -or
                !$case.retirement.requestPhaseObserved -or $case.retirement.exitCode -notin @(124,125))) { throw 'Actual UI hard-stop control failed.' }
            if ($mode -eq 'stall') {
              if (!$case.retirement.requestPhaseObserved) { throw 'Actual UI request phase was not observed before the hard stop.' }
              if ($case.retirement.exitCode -eq 124) {
                if (!$case.retirement.nativeWatchdog.triggered -or $case.retirement.nativeWatchdog.phase -ne 'requests' -or
                    $case.retirement.nativeWatchdog.deadlineMs -ne 8000 -or
                    $case.retirement.stopOrigin -notin @('native-watchdog','parent-and-native-watchdog')) {
                  throw 'Native hard-stop exit has no identity-bound request-deadline proof.'
                }
              } elseif ($case.retirement.exitCode -eq 125) {
                if (!$case.retirement.parentTimedOut -or
                    $case.retirement.stopOrigin -notin @('parent-watchdog','parent-and-native-watchdog')) {
                  throw 'Parent hard-stop exit has no independent deadline proof.'
                }
              } else { throw 'The hard-stop control exited without an identified watchdog.' }
            }
            if ($mode -eq 'native-watchdog-500ms' -and ($exitCode -ne 2 -or $summary.passed -or
                $summary.nativeWatchdogControl -ne 'native-watchdog-500ms' -or !$case.retirement.timedOut -or
                !$case.retirement.requestPhaseObserved -or $case.retirement.exitCode -ne 124 -or
                $case.retirement.parentTimedOut -or $case.retirement.stopOrigin -ne 'native-watchdog' -or
                !$case.retirement.nativeWatchdog.triggered -or !$case.retirement.nativeWatchdog.committed -or
                $case.retirement.nativeWatchdog.phase -ne 'requests' -or $case.retirement.nativeWatchdog.deadlineMs -ne 500 -or
                $case.retirement.nativeWatchdog.absoluteLimitMs -ne 28000 -or $summary.fixture.ownershipProofs -ne 1 -or
                $summary.fixture.socksConnections -lt 1)) { throw 'Fixed native 500ms producer control has no committed request stop and retirement proof.' }
            if ($mode -in $admissionModes -and ($exitCode -ne 2 -or $summary.passed -or !$summary.admissionRefused -or
                $case.retirement.exitCode -ne 64 -or $case.retirement.timedOut -or
                $case.result -isnot [pscustomobject] -or @($case.result.psobject.Properties).Count -ne 0 -or
                $summary.fixture.socksConnections -ne 0 -or $summary.fixture.forwarded -ne 0)) {
              throw "Synthetic UI admission control failed: $mode"
            }
          }
          # The negative controls intentionally return 2. Only after every
          # native exit and actual receipt above is checked is this step done.
          exit 0
      - name: Preserve controlled synthetic UI session receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2

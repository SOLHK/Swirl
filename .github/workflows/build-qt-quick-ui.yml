      - name: Upload separate Qt UI preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Quick-UI-win-x64
          path: installer-bin/
          if-no-files-found: error
          retention-days: 14

  observe-fresh-windows-proxy:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    permissions:
      contents: read
    steps:
      - name: Checkout the current diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare the bounded residual-owner collector launcher
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: profile_python
        with:
          python-version: '3.12'
          architecture: x64
      - name: Observe WinINET queries in a fresh actual standard-user profile
        shell: pwsh
        env:
          SWIRL_DISPOSABLE_INSTALL_TEST: '1'
          SWIRL_QUERY_ARCHITECTURE: ${{ matrix.architecture }}
          SWIRL_PROFILE_OWNER_PYTHON: ${{ steps.profile_python.outputs.python-path }}
        run: |
          $architecture = $env:SWIRL_QUERY_ARCHITECTURE
          $evidence = Join-Path $env:GITHUB_WORKSPACE ('build-evidence/proxy-query-only/'+$architecture)
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $arguments = Join-Path $evidence 'child-arguments.json'
          [ordered]@{ExpectedSourceSha=$env:GITHUB_SHA;EvidenceDirectory=$evidence;ExpectedPowerShellArchitecture=$architecture} |
            ConvertTo-Json | Set-Content -LiteralPath $arguments -Encoding UTF8
          ./scripts/tests/Invoke-DisposableWindowsUser.ps1 `
            -Script scripts/tests/Test-WindowsProxyQueryOnly.ps1 `
            -ArgumentsFile $arguments -EvidenceDirectory $evidence -TimeoutSeconds 180 -PowerShellArchitecture $architecture
          $query = Get-Content -LiteralPath (Join-Path $evidence 'proxy-query-only.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $runner = Get-Content -LiteralPath (Join-Path $evidence 'standard-user-runner.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($query.schema -ne 1 -or -not $query.success -or $query.source_sha -cne $env:GITHUB_SHA -or
              -not $query.actual_non_admin_token -or -not $query.actual_standard_user_powershell -or
              $query.architecture -cne $architecture -or -not $query.negative_controls.success) {
            throw 'Fresh-profile query observation or its comparator controls are incomplete.'
          }
          if ($runner.schema -ne 1 -or -not $runner.success -or $runner.forced_termination -or
              $runner.remaining_job_processes -ne 0 -or $runner.powershell_architecture -cne $architecture) {
            throw 'The query-only standard-user process or its native resources were not cleanly released.'
          }
      - name: Preserve the fresh-profile WinINET observation and cleanup result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-WindowsProxy-Query-Observation-${{ matrix.architecture }}
          path: build-evidence/proxy-query-only/
          if-no-files-found: error

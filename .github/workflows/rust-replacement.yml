name: Rust sole runtime R1
on:
  push:
    branches: [work/rust-core-full-replacement-20261022]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-replacement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Rust workspace gates
        working-directory: core
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --workspace --locked --lib --bins
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent proxy and failure tests
        env:
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_RUST_DIAGNOSTIC: ${{ github.workspace }}/core/target/release/swirl-diagnose
          SWIRL_PRODUCT_EVIDENCE: ${{ runner.temp }}/r1-native
        run: |
          python -m pip install cryptography==50.0.2
          python tools/tests/test_rust_core.py -v
          python tools/tests/test_shadowsocks.py -v
          python tools/tests/test_socks5_udp.py -v
          python tools/tests/test_native_probe.py -v
          python tools/tests/test_connection_stages.py -v
          python tools/tests/test_product_subscription_chain.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R1-native-${{ github.sha }}
          path: ${{ runner.temp }}/r1-native
          if-no-files-found: warn
  windows-product:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Rust MSVC x64
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Configure Release with mandatory Rust runtime
        run: cmake -S src/Swirl.Quick -B build/r1 -G "Visual Studio 17 2022" -A x64 -DSWIRL_BUILD_UI_TESTS=ON
      - name: Build actual application and loader tests
        run: cmake --build build/r1 --config Release --target Swirl SwirlRustCoreTests SwirlRustCoreLibraryTests --parallel 4
      - name: Deploy test dependencies and inspect PE imports
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime build/r1/Release/SwirlRustCoreTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt test deployment failed.' }
          dumpbin /HEADERS build/r1/Release/swirl_api.dll | Out-File build/r1/rust-pe-headers.txt
          if ($LASTEXITCODE -ne 0) { throw 'Rust PE inspection failed.' }
          dumpbin /DEPENDENTS build/r1/Release/swirl_api.dll | Out-File build/r1/rust-dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw 'Rust dependency inspection failed.' }
      - name: DLL loader and Qt Rust integration
        run: ctest --test-dir build/r1 -C Release -R "swirl-rust-(library|qt-integration)" --output-on-failure
      - name: Clean directory and actual Swirl.exe roundtrips
        shell: pwsh
        run: ./scripts/Stage-WindowsRustProduct.ps1 -BuildDirectory build/r1 -Destination dist/Swirl-Rust-x64
      - name: Negative packaged DLL gate
        shell: pwsh
        run: |
          $stage=(Resolve-Path dist/Swirl-Rust-x64).Path
          $dll=Join-Path $stage 'swirl_api.dll'
          Move-Item $dll "$dll.absent"
          try {
            $report=Join-Path $env:RUNNER_TEMP 'r1-missing-dll.json'
            $p=Start-Process (Join-Path $stage 'Swirl.exe') -ArgumentList @('--rust-core-self-test', ('"'+$report+'"')) -PassThru
            if (-not $p.WaitForExit(15000)) { $p.Kill(); throw 'Missing DLL check hung.' }
            if ($p.ExitCode -eq 0 -or -not (Test-Path $report)) { throw 'Missing DLL was not rejected.' }
            $result=Get-Content $report -Raw | ConvertFrom-Json
            if ($result.success -or $result.failure -ne 'RustLibraryLoadFailed') { throw 'Wrong missing DLL diagnostic.' }
            Copy-Item $report build/r1/
          } finally { Move-Item "$dll.absent" $dll }
      - name: Start actual Qt UI from clean product directory
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QT_QUICK_BACKEND='software'
          $exe=(Resolve-Path dist/Swirl-Rust-x64/Swirl.exe).Path
          $p=Start-Process $exe -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Swirl UI smoke timed out.' }
          if ($p.ExitCode -ne 0) { throw "Swirl UI smoke failed: $($p.ExitCode)" }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $nsis='C:/Program Files (x86)/NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) { choco install nsis --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed.' } }
          $dist=(Resolve-Path dist).Path
          $stage=(Resolve-Path dist/Swirl-Rust-x64).Path
          $icon=(Resolve-Path build/r1/brand/Swirl.ico).Path
          & $nsis "/DAPP_DIST=$stage" "/DOUT_DIR=$dist" "/DAPP_ICON=$icon" src/Swirl.Quick/packaging/Swirl.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          Compress-Archive -Path "$stage/*" -DestinationPath (Join-Path $dist 'Swirl-Rust-x64.zip')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R1-Windows-evidence-${{ github.sha }}
          path: |
            build/r1/Testing/Temporary/LastTest.log
            build/r1/*integration.xml
            build/r1/rust-*.txt
            build/r1/r1-missing-dll.json
            dist/Swirl-Rust-x64/rust-self-test.json
            dist/Swirl-Rust-x64/package-manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Swirl-Rust-Windows-x64-${{ github.sha }}
          path: |
            dist/Swirl-Rust-x64.zip
            dist/Swirl-Setup.exe
          if-no-files-found: error

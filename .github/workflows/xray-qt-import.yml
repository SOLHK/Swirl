name: Xray Qt import product chain

on:
  push:
    branches: [work/xray-v2ray-qt-import-20261022, work/subscription-native-bridge-20261023, work/subscription-unified-integration-20261023]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-qt-import-${{ github.ref }}
  # Each new stage contains the previous stages. Reserve runners for the
  # newest exact-source acceptance run instead of rebuilding superseded heads.
  cancel-in-progress: true

jobs:
  product-chain:
    name: Qt and Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
          - os: macos-14
            qt-host: mac
            qt-arch: clang_64
          - os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        working-directory: core
        run: cargo +stable fmt --all -- --check
      - name: Check locked Rust workspace
        working-directory: core
        run: cargo +stable check --workspace --locked
      - name: Lint all Rust targets
        working-directory: core
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Test locked Rust workspace
        working-directory: core
        run: cargo +stable test --workspace --locked
      - name: Build actual Rust FFI library
        working-directory: core
        run: cargo +stable build --release --locked -p swirl-api -p swirl-protocol --lib --bins --examples

      - name: Install Qt 6.11.3 SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          # Pinned upstream aqt PR #1000 resolves Qt 6.11's Windows repository layout.
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b' || '' }}
          modules: qtshadertools
          cache: true
      # The Qt action installs its own Python and changes PATH. Pin the
      # acceptance interpreter afterwards so fixture imports and invocations
      # use the same environment on every runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned certificate fixture dependency
        run: python -m pip install cryptography==50.0.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev
      # Both CMake projects use R1's exact-source pairing function and shared
      # Cargo cache. It resolves target-triple/release, verifies the build ID,
      # and stages the actual library; never pass the old target/release DLL.
      - name: Configure complete Windows Rust application
        if: runner.os == 'Windows'
        run: >-
          cmake -S src/Swirl.Quick -B build/xray-app
          -G "Visual Studio 17 2022" -A x64
          -DSWIRL_USE_RUST_CORE=ON -DSWIRL_BUILD_UI_TESTS=OFF -DSWIRL_XRAY_UI_TESTS=ON
          -DSWIRL_RUST_TARGET="${{ github.workspace }}/core/target"
      - name: Build complete Windows application
        if: runner.os == 'Windows'
        run: cmake --build build/xray-app --config Release --target Swirl --parallel 2
      - name: Configure isolated Qt importer tests (Linux and macOS)
        if: runner.os != 'Windows'
        run: >-
          cmake -S src/Swirl.Quick/tests/xray -B build/xray-qt
          -DCMAKE_BUILD_TYPE=Release
          -DSWIRL_RUST_TARGET="${{ github.workspace }}/core/target"
      - name: Configure isolated Qt importer tests (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S src/Swirl.Quick/tests/xray -B build/xray-qt
          -G "Visual Studio 17 2022" -A x64
          -DSWIRL_RUST_TARGET="${{ github.workspace }}/core/target"
      - name: Build actual Qt production importer and tests
        run: cmake --build build/xray-qt --config Release --parallel 2
      - name: Deploy Windows Qt test runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem build/xray-qt/bin -Filter '*Tests.exe' | ForEach-Object {
            windeployqt --release --no-translations $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Qt test runtime deployment failed' }
          }
      - name: Execute Qt import, Rust FFI and platform storage tests
        run: ctest --test-dir build/xray-qt -C Release --output-on-failure --no-tests=error
      - name: Require actual test execution and Windows DPAPI roundtrip
        if: always()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('build/xray-qt')
          if 'Qt=6.11.3\n' not in (root / 'xray-toolchain.txt').read_text():
              raise SystemExit('Importer tests did not compile against the required fixed Qt SDK')
          required = [
              ('swirl-native-node-bridge.xml', set()),
              ('swirl-node-import-scope.xml', set()),
              ('swirl-rust-library-loader.xml', set()),
              ('swirl-system-proxy-state.xml', {'nativeRegistryReaderUsesIsolatedFixture'}
                  if os.environ['RUNNER_OS'] == 'Windows' else set()),
              ('swirl-xray-import.xml', {'allSixProtocolsExposeAuthoritativeNativeCandidates',
                  'socksVersionsKeepValidatedDisplayAndDnsSemantics',
                  'expandedNativeCandidatesKeepServerAccountAndFilteredSourceIndices'}),
              ('swirl-xray-download.xml', {'subscriptionCancellationCannotCancelManualDownload',
                  'synchronousCancellationCannotRestartManualWork'} | (
                  {'subscriptionRefreshCancellationPreservesEncryptedSnapshotAndRetries',
                   'synchronousRefreshCancellationStartsNoDownload'} if os.environ['RUNNER_OS'] == 'Windows' else set())),
              ('swirl-xray-store.xml', {'encryptedDocumentRoundtrip',
                  'expandedServerAccountsReloadCorrectNativeCandidate'}
                  if os.environ['RUNNER_OS'] == 'Windows' else set()),
              ('swirl-xray-catalog.xml', set()), ('swirl-xray-runtime.xml', set()),
          ]
          for filename, mandatory in required:
              report = root / filename
              if not report.is_file():
                  raise SystemExit('Required Qt XML report missing: ' + filename)
              document = ET.parse(report).getroot()
              functions = document.findall('TestFunction')
              tests = [f for f in functions if f.get('name') not in ('initTestCase', 'cleanupTestCase')]
              if not tests:
                  raise SystemExit('Qt report has no executed test functions: ' + filename)
              for function in functions:
                  outcomes = function.findall('Incident')
                  skipped = bool(function.findall('Skip')) or any(
                      m.get('type') == 'skip' for m in function.findall('Message'))
                  if skipped or not outcomes or any(i.get('type') != 'pass' for i in outcomes):
                      raise SystemExit('Qt case failed or skipped: ' + str(function.get('name')))
              if not mandatory.issubset({f.get('name') for f in tests}):
                  raise SystemExit('Required native import or Windows DPAPI case did not execute: ' + filename)
              if filename == 'swirl-xray-catalog.xml' and os.environ['RUNNER_OS'] == 'Windows':
                  expected = {'asyncJsonCommitInvalidatesCompletedAndRunningProbes',
                              'runningSubscriptionRefreshKeepsOwnedRuntimeSnapshot'}
                  if not expected.issubset({f.get('name') for f in tests}):
                      raise SystemExit('Required actual Windows catalog and running-refresh cases did not execute')
              print(filename + ': ' + str(len(tests)) + ' test functions passed, zero skips')
          PY
      - name: Verify independent traffic evidence guards
        run: python tools/tests/test_xray_qt_import.py --self-test
      - name: Install pinned Go for the independent official Xray peer
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build and repeat-verify the pinned official peer
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-qt-peer
        run: python tools/Build-XrayPeer.py --output "$SWIRL_XRAY_PEER_DIR"
      - name: Fetch hash-locked official VMess and Trojan reference servers
        run: python tools/Fetch-TransportPeers.py --output out/xray-qt-peers
      - name: Execute JSON Qt to Rust HTTP and HTTPS across all six protocol families
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-qt-peer
          SWIRL_XRAY_QT_EVIDENCE: ${{ runner.temp }}/swirl-xray-qt-network
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          suffix = '.exe' if os.name == 'nt' else ''
          binaries = {
              'SWIRL_XRAY_QT_TESTS': root / 'build/xray-qt/bin' / ('SwirlXrayRuntimeTests' + suffix),
              'SWIRL_RUST_HARNESS': root / 'core/target/release' / ('swirl-api' + suffix),
              'SWIRL_RUST_INSPECTOR': root / 'core/target/release' / ('swirl-inspect' + suffix),
              'SWIRL_TRANSPORT_CLIENT': root / 'core/target/release/examples' / ('transport-client' + suffix),
          }
          env = os.environ.copy()
          for key, path in binaries.items():
              if not path.is_file():
                  raise SystemExit('Required exact-source executable missing: ' + key)
              env[key] = str(path.resolve())
          env['SWIRL_XRAY_RELEASE_MANIFEST'] = str(root / 'out/xray-qt-peers/manifest.json')
          subprocess.run([sys.executable, 'tools/tests/test_xray_qt_import.py',
                          '--client', 'python-stdlib-ssl'], env=env, check=True, timeout=360)
          PY
      - name: Preserve allowlisted actual-network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xray-Qt-Network-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-qt-network
            ${{ runner.temp }}/swirl-xray-qt-peer/build-manifest.json
            ${{ runner.temp }}/swirl-xray-qt-peer/build.log
            out/xray-qt-peers/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify build did not modify tracked source
        run: git diff --exit-code
      - name: Preserve exact-source test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xray-Qt-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/xray-qt/swirl-native-node-bridge.xml
            build/xray-qt/swirl-node-import-scope.xml
            build/xray-qt/swirl-rust-library-loader.xml
            build/xray-qt/swirl-system-proxy-state.xml
            build/xray-qt/swirl-xray-import.xml
            build/xray-qt/swirl-xray-download.xml
            build/xray-qt/swirl-xray-store.xml
            build/xray-qt/swirl-xray-catalog.xml
            build/xray-qt/swirl-xray-runtime.xml
            build/xray-qt/xray-toolchain.txt
            build/xray-qt/swirl-rust-build.json
            build/xray-qt/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify native application artifacts and source identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('build/xray-app/Release/Swirl.exe', 'build/xray-app/Release/swirl_api.dll')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Required native application artifact missing' }
            Get-FileHash -Algorithm SHA256 -LiteralPath $file
          }
          $tested = (Get-FileHash -Algorithm SHA256 -LiteralPath 'build/xray-qt/bin/swirl_api.dll').Hash
          $packaged = (Get-FileHash -Algorithm SHA256 -LiteralPath 'build/xray-app/Release/swirl_api.dll').Hash
          if ($tested -ne $packaged) { throw 'Packaged Rust DLL differs from the actual tested DLL' }
          $testedIdentity = Get-Content build/xray-qt/bin/swirl-rust-build.json -Raw | ConvertFrom-Json
          $productIdentity = Get-Content build/xray-app/Release/swirl-rust-build.json -Raw | ConvertFrom-Json
          if ($testedIdentity.source_sha -ne $env:GITHUB_SHA -or $productIdentity.source_sha -ne $env:GITHUB_SHA -or $testedIdentity.build_id -ne $productIdentity.build_id) { throw 'Importer and product DLLs do not identify this source commit' }
          $legacy = Get-ChildItem build/xray-app/Release -Recurse -File | Where-Object { $_.Name -match '^(mihomo|clash|xray|v2ray)(\.|-)' }
          if ($legacy) { throw 'Unexpected external proxy runtime in Rust application output' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Application build modified tracked source' }
      - name: Deploy the complete Windows QML application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          windeployqt --release --no-translations --qmldir src/Swirl.Quick/qml build/xray-app/Release/Swirl.exe
          if ($LASTEXITCODE -ne 0) { throw 'Complete QML application deployment failed' }
      - name: Run mounted QML import acceptance and page smoke at two scales
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build/xray-app/Release/Swirl.exe').Path
          $output = Join-Path $env:GITHUB_WORKSPACE 'build/xray-app/ui-evidence'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $profiles = @(
            @{ Name='pages'; Flag='--smoke-test --font-review'; Scale='1'; Log='Swirl-diagnostics.txt'; Marker='SMOKE_PAGES\s+[1-9][0-9]*' },
            @{ Name='json-scale-1'; Flag='--xray-import-ui-test'; Scale='1'; Log='Swirl-xray-ui-diagnostics.txt'; Marker='XRAY_UI_PASS' },
            @{ Name='json-scale-1.5'; Flag='--xray-import-ui-test'; Scale='1.5'; Log='Swirl-xray-ui-diagnostics.txt'; Marker='XRAY_UI_PASS' }
          )
          foreach ($profile in $profiles) {
            $env:SWIRL_TEST_ROOT = Join-Path $env:RUNNER_TEMP ('Swirl JSON UI ' + $profile.Name + ' ' + [guid]::NewGuid())
            New-Item -ItemType Directory -Path $env:SWIRL_TEST_ROOT | Out-Null
            $env:QT_SCALE_FACTOR = $profile.Scale
            $env:SWIRL_EXPECTED_DPR = $profile.Scale
            $log = Join-Path (Split-Path $exe) $profile.Log
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -ArgumentList $profile.Flag -PassThru -NoNewWindow
            $timedOut = -not $process.WaitForExit(90000)
            if ($timedOut) {
              Stop-Process -InputObject $process -Force -ErrorAction SilentlyContinue
              [void]$process.WaitForExit(5000)
            }
            if (Test-Path -LiteralPath $log) {
              Copy-Item -LiteralPath $log -Destination (Join-Path $output ($profile.Name + '.txt'))
              $diagnostics = Get-Content -LiteralPath $log -Raw
            } else { $diagnostics = '' }
            if ($timedOut -or $process.ExitCode -ne 0 -or $diagnostics -notmatch $profile.Marker) {
              Get-Content -LiteralPath (Join-Path $output ($profile.Name + '.txt')) -ErrorAction SilentlyContinue
              throw ('Actual QML acceptance did not pass: ' + $profile.Name)
            }
            if ($profile.Name -eq 'pages') {
              # Reuse the existing load-aware smoke mode; every page must
              # mount and finish its transition before the driver advances.
              $completion = [regex]::Matches($diagnostics, 'SMOKE_PAGES\s+([1-9][0-9]*)')
              $ready = [regex]::Matches($diagnostics, 'FONT_SMOKE_ROUTE_READY\s+(\S+)\s+(\S+)')
              if ($completion.Count -ne 1 -or $ready.Count -ne [int]$completion[0].Groups[1].Value) {
                throw 'Navigation marker did not prove each page was mounted and ready'
              }
              foreach ($route in $ready) {
                # Main.qml intentionally mounts these two existing aliases
                # as activity. Every other requested route must match exactly.
                $expectedRoute = $route.Groups[1].Value
                if ($expectedRoute -in @('dashboard', 'requestlogs')) { $expectedRoute = 'activity' }
                if ($expectedRoute -ne $route.Groups[2].Value) { throw 'Mounted route differs from requested page' }
              }
            }
            Write-Host ($profile.Name + ': exit 0 and required completion marker')
          }
      - name: Preserve mounted Windows QML acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Xray-Qt-UI-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: build/xray-app/ui-evidence
          if-no-files-found: warn
          retention-days: 14

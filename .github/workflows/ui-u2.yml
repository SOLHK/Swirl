name: Swirl U2 portable core and UI
on:
  push:
    branches: [work/ui-window-node-performance-20261023]
    paths: ['core/**', 'src/Swirl.Quick/**', 'tools/tests/test_portable_core_boundary.py', '.github/workflows/ui-u2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swirl-u2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Core gates
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --locked
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked
      - name: Portable dependency boundary
        run: python tools/tests/test_portable_core_boundary.py
      - name: iOS core compile
        if: runner.os == 'macOS'
        working-directory: core
        run: |
          rustup target add --toolchain stable aarch64-apple-ios
          cargo +stable check --workspace --lib --locked --target aarch64-apple-ios
      - name: Android core compile
        if: runner.os == 'Linux'
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          rustup target add --toolchain stable aarch64-linux-android
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk"
          export CC_aarch64_linux_android="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          test -x "$CC_aarch64_linux_android"
          cargo +stable check --workspace --lib --locked --target aarch64-linux-android
      - name: OpenHarmony portable modules compile only
        if: runner.os == 'Linux'
        working-directory: core
        run: |
          rustup target add --toolchain stable aarch64-unknown-linux-ohos
          cargo +stable check --locked -p swirl-subscription -p swirl-platform --target aarch64-unknown-linux-ohos
  qt:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
      - name: Current Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Configure Rust product and UI checks
        run: cmake -S src/Swirl.Quick -B build/u2 -G "Visual Studio 17 2022" -A x64 -DSWIRL_USE_RUST_CORE=ON -DSWIRL_BUILD_UI_TESTS=ON
      - name: Build
        run: cmake --build build/u2 --config Release --parallel 4 --target Swirl SwirlNodeViewModelTests
      - name: Model regression
        run: ctest --test-dir build/u2 -C Release -R '^swirl-node-view-model$' --output-on-failure

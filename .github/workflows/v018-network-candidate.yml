name: Swirl incremental Windows network candidate
on:
  push:
    branches: [work/swirl-018-network-compat-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v018-network-candidate-${{ github.ref }}
  # Complete each independently deliverable installer, then reuse its cache.
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '1'
  SWIRL_SOURCE_SHA: ${{ github.sha }}
jobs:
  rust-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record Rust compiler cache identity
        id: compiler
        shell: bash
        run: echo "hash=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: v018-rust-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            v018-rust-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-
      - name: Portable safety and Rust regression
        id: checks
        working-directory: core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python ../tools/tests/test_portable_core_boundary.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.checks.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_FORCE_STDERR_LOGGING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install Rust MSVC
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          modules: qtshadertools
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-network-fixtures.txt
      - name: Install independent certificate fixtures and NSIS
        shell: pwsh
        run: |
          python -m pip install -r tools/requirements-network-fixtures.txt
          if ($LASTEXITCODE -ne 0) { throw 'Fixture dependencies failed.' }
          if (-not (Test-Path 'C:/Program Files (x86)/NSIS/makensis.exe')) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed.' }
          }
      - name: Offline Codex log classification and privacy regression
        shell: pwsh
        run: |
          ./tools/tests/Test-CodexLogSummary.ps1
          ./scripts/tests/Test-BuildInputTimes.ps1
          ./scripts/tests/Test-BuildSourceGuard.ps1
      - name: Record compiler and CMake cache identity
        id: compiler
        shell: pwsh
        run: |
          $identity=(& rustc -vV | Out-String)+(& cmake --version | Out-String)+$env:VCToolsVersion+$env:WindowsSDKVersion+$env:ImageVersion+$env:QT_ROOT_DIR+$env:GITHUB_WORKSPACE
          $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant()
          "hash=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: build_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            build/v018-network
          key: v018-msvc-ninja-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            v018-msvc-ninja-${{ runner.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('core/Cargo.lock') }}-
      - name: Build and validate the exact-source candidate incrementally
        id: candidate
        shell: pwsh
        run: |
          ./scripts/build-network-candidate.ps1 -QtDir $env:QT_ROOT_DIR -BuildDir build/v018-network -RustTargetDir core/target -OutDir dist/v018-network -Nsis 'C:/Program Files (x86)/NSIS/makensis.exe' -Parallel 4 -DisposableSystemProxyTests
      - name: Save compiler outputs without treating downstream failures as passes
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.candidate.outputs.cache-ready == 'true' && steps.build_cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            build/v018-network
          key: ${{ steps.build_cache.outputs.cache-primary-key }}
      - name: Preserve timing, test and package identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Swirl-network-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/v018-network/evidence
          if-no-files-found: warn
      - name: Preserve controlled-network diagnostic candidate
        if: ${{ success() && steps.candidate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Swirl-0.1.8-network-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/v018-network/Swirl-Setup.exe
            dist/v018-network/evidence/build-timings.json
            dist/v018-network/evidence/package/final-package-verification.json
            tools/Collect-CodexNetworkEvidence.ps1
            tools/CodexLogSummary.psm1
          if-no-files-found: error

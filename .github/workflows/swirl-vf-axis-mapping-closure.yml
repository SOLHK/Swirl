name: Swirl VF native 32-face axis mapping closure diagnosis

on:
  push:
    branches: [work/core-completion-20261017]
    paths:
      - '.github/workflows/swirl-vf-axis-mapping-closure.yml'
      - 'tools/swirl_vf/platform/probe_axis_anchor.py'
      - 'tools/swirl_vf/platform/anchor_construction_harness.py'
      - 'tools/swirl_vf/platform/axis_anchor_cases.py'
      - 'tools/swirl_vf/platform/axis_threshold_cases.py'
      - 'tools/swirl_vf/platform/analyze_axis_quantization.py'
      - 'tools/swirl_vf/platform/calibrate_avar_metrics.py'
      - 'tools/swirl_vf/platform/calibrate_hvf_geometry.py'
      - 'tools/swirl_vf/platform/compare_axis_construction.py'
      - 'tools/swirl_vf/platform/plateau_construction_harness.py'
      - 'tools/swirl_vf/platform/probe_axis_plateau.py'
      - 'tools/swirl_vf/platform/probe_axis_thresholds.py'
      - 'tools/swirl_vf/platform/probe_user_axis_geometry.py'
      - 'tools/swirl_vf/platform/hvf_oracle.c'
      - 'tools/swirl_vf/platform/axis_mapping_closure_cases.py'
      - 'tools/swirl_vf/platform/axis_mapping_closure_archive.py'
      - 'tools/swirl_vf/tests/data/axis_mapping_archive_20261020.json'
      - 'tools/swirl_vf/platform/coretext_extract.swift'
      - 'tools/swirl_vf/platform/diagnose_path_types.py'
      - 'tools/swirl_vf/tools/*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-axis-mapping-closure:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare all archived coordinates and fresh 32-face mixed-axis cases
        run: |
          python -m pip install fonttools==4.61.1 numpy==2.2.6
          python tools/swirl_vf/platform/probe_axis_anchor.py \
            /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc \
            --profile closure_all_faces \
            --output build/axis-mapping-closure-summary/closure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swirl-vf-axis-mapping-closure-${{ github.sha }}
          path: build/axis-mapping-closure-summary/*.json
          retention-days: 7

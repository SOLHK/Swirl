name: Validate Qt-only source tree

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Qt project and reject obsolete WPF/.NET files
        shell: bash
        run: |
          set -euo pipefail
          for path in AdShield AdShield.Tests installer; do
            if [ -e "$path" ]; then
              echo "::error::Obsolete project path remains: $path"
              exit 1
            fi
          done
          if git ls-files | grep -E '(^|/)[^/]+\.(cs|csproj|sln|slnx|xaml)$'; then
            echo "::error::Legacy C# or XAML source remains"
            exit 1
          fi
          test -f src/Swirl.Quick/CMakeLists.txt
          test -f src/Swirl.Quick/qml/Main.qml
          test -f src/Swirl.Quick/network/CaptureService.cpp
          test -f src/Swirl.Quick/packaging/Swirl.nsi
          test -f src/Swirl.Quick/assets/icons/swirl_knot_light.svg
          test -f src/Swirl.Quick/assets/icons/swirl_knot_dark.svg
          test -f src/Swirl.Quick/assets/icons/swirl_knot_mark_light.svg
          test -f src/Swirl.Quick/assets/icons/swirl_knot_mark_dark.svg
          if grep -Eq 'AdShield[/\\]|AdShield\.Tests|installer/AdShield' README.md docs/SURGE_FEATURE_MATRIX.md; then
            echo "::error::Current user documentation still points at removed code"
            exit 1
          fi
          echo "Qt-only tree verified. Build and runtime checks run in build-qt-ui."
      - name: Validate production release gate source
        run: python tools/tests/test_release_gate.py

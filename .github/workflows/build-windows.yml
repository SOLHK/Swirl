name: Validate Qt-only source tree

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Qt project and reject obsolete WPF/.NET files
        shell: bash
        run: |
          set -euo pipefail
          for path in AdShield AdShield.Tests installer; do
            if [ -e "$path" ]; then
              echo "::error::Obsolete project path remains: $path"
              exit 1
            fi
          done
          if git ls-files | grep -E '(^|/)[^/]+\.(cs|csproj|sln|slnx|xaml)$'; then
            echo "::error::Legacy C# or XAML source remains"
            exit 1
          fi
          test -f src/Swirl.Quick/CMakeLists.txt
          test -f src/Swirl.Quick/qml/Main.qml
          test -f src/Swirl.Quick/network/CaptureService.cpp
          test -f src/Swirl.Quick/packaging/Swirl.nsi
          test -f src/Swirl.Quick/assets/icons/swirl_knot_light.svg
          test -f src/Swirl.Quick/assets/icons/swirl_knot_dark.svg
          test -f src/Swirl.Quick/assets/icons/swirl_knot_mark_light.svg
          test -f src/Swirl.Quick/assets/icons/swirl_knot_mark_dark.svg
          if grep -Eq 'AdShield[/\\]|AdShield\.Tests|installer/AdShield' README.md docs/SURGE_FEATURE_MATRIX.md; then
            echo "::error::Current user documentation still points at removed code"
            exit 1
          fi
          echo "Qt-only tree verified. Build and runtime checks run in build-qt-ui."
      - name: Validate production release gate source
        run: python tools/tests/test_release_gate.py
      - name: Require source and dependency graph test prerequisites
        shell: python
        run: |
          import os, re, shutil, subprocess, sys
          if os.name != 'posix' or sys.version_info < (3, 11):
              raise SystemExit('Source guards require POSIX and Python 3.11 or newer.')
          for tool in ('cmake', 'ninja', 'c++', 'git'):
              executable = shutil.which(tool)
              if not executable:
                  raise SystemExit(f'Missing {tool}; dependency graph tests must not be skipped.')
              version = subprocess.check_output([executable, '--version'], text=True)
              print(version.splitlines()[0], flush=True)
              if tool == 'cmake':
                  match = re.search(r'cmake version (\d+)\.(\d+)', version)
                  if not match or tuple(map(int, match.groups())) < (3, 25):
                      raise SystemExit('Dependency graph fixtures require CMake 3.25 or newer.')
      - name: Reject removed runtime sources and product fallback paths
        run: python tools/test_rust_only_runtime.py -v
      - name: Keep native platform dependencies outside common Rust crates
        run: python tools/tests/test_portable_core_boundary.py
      - name: CMake dependency graph regression
        run: python tools/test_rust_build_chain.py -v

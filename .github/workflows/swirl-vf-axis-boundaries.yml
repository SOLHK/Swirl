name: Swirl VF exact native axis boundary observations

on:
  push:
    branches: [work/core-completion-20261017]
    paths:
      - '.github/workflows/swirl-vf-axis-boundaries.yml'
      - 'tools/swirl_vf/platform/probe_axis_readback_boundaries.py'
      - 'tools/swirl_vf/platform/probe_axis_first_writer.py'
      - 'tools/swirl_vf/platform/coretext_extract.swift'
      - 'tools/swirl_vf/tools/verified_axis_oracle.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-axis-boundaries:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original source and compare every predeclared numeric candidate
        run: |
          python -m pip install fonttools==4.61.1 numpy==2.2.6
          python tools/swirl_vf/platform/probe_axis_readback_boundaries.py \
            /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc \
            --mode both --output build/axis-boundary-summary/boundaries.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swirl-vf-axis-boundary-observations-${{ github.sha }}
          path: build/axis-boundary-summary/*.json
          retention-days: 7

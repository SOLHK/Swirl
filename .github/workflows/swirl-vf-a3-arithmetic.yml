name: Swirl VF A3 arithmetic order and default omission

on:
  push:
    branches: [work/vf-axis-a3]
    paths:
      - '.github/workflows/swirl-vf-a3-arithmetic.yml'
      - 'tools/swirl_vf/platform/*axis_a3_arithmetic*.py'
      - 'tools/swirl_vf/platform/axis_a3_default_omission.py'
      - 'tools/swirl_vf/tests/test_axis_a3_arithmetic*.py'
      - 'tools/swirl_vf/tests/test_axis_a3_default_omission.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parsers and required native synthetic libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libharfbuzz0b libfreetype6
          python -m pip install fonttools==4.61.1 numpy==2.2.6
      - name: Run A3 controls and preserve existing input counterexamples
        run: |
          python -c 'import ctypes.util; assert ctypes.util.find_library("harfbuzz") and ctypes.util.find_library("freetype")'
          python -m unittest discover -s tools/swirl_vf/tests -p 'test_axis_a3*.py' -v
          python -m unittest discover -s tools/swirl_vf/tests -p 'test_axis_input_resolution.py' -v

  native-arithmetic:
    needs: independent-controls
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.61.1 numpy==2.2.6
      - name: Evaluate frozen arithmetic rules with real CoreText and Apple HVF
        run: |
          python tools/swirl_vf/platform/probe_axis_a3_arithmetic.py \
            /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc \
            --output build/axis-a3-arithmetic-summary/arithmetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swirl-vf-a3-arithmetic-${{ github.sha }}
          path: build/axis-a3-arithmetic-summary/*.json
          retention-days: 7

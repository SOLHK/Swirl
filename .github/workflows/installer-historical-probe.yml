name: Diagnose historical Windows installer cleanup

# Temporary, evidence-only reproduction. Remove after the cleanup defect is
# confirmed; this historical binary can never satisfy current-source gates.
on:
  push:
    branches: [work/windows-proxy-compat-20261102]
    paths: [.github/workflows/installer-historical-probe.yml]

permissions:
  contents: read
  actions: read

jobs:
  historical-installer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout current diagnostic script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record current script and historical package identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path probe-evidence | Out-Null
          $current=(& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $current -cne $env:GITHUB_SHA) { throw 'Current diagnostic checkout mismatch.' }
          [ordered]@{
            schema=1; diagnostic_only=$true; current_source_acceptance=$false
            diagnostic_commit=$current
            diagnostic_script_sha256=(Get-FileHash -LiteralPath scripts/tests/Test-WindowsProductionInstaller.ps1).Hash.ToLowerInvariant()
            historical_head_sha='24af5838e39b4612321a7ee2b1be11d78fb9b6dd'
            historical_checkout_sha='ceafbef537b9f9f30a0bc13b1dc24f7ff16addfd'
            historical_run_id=41475106009
            installer_artifact_id=13160021695; package_artifact_id=13160625395
            expected_installer_sha256='082c6e60ffa968d0e6d3d8766a055e7dc49b5a6263de1f66c74352218b6ea84b'
            expected_manifest_sha256='95e57c627ba3948422075ea22b731dc3bb77e386719e91cbf2450fb6a0758003'
            windows11_codex_desktop='NOT_RUN'; lifecycle_success=$false
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath probe-evidence/envelope.json -Encoding utf8
      - name: Checkout the exact historical package source separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ceafbef537b9f9f30a0bc13b1dc24f7ff16addfd
          path: historical-checkout
          persist-credentials: false
      - name: Download the fixed historical NSIS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Swirl-Windows-Installer-EXE
          run-id: 41475106009
          github-token: ${{ github.token }}
          path: historical-artifacts/installer
      - name: Download its complete verified production directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Swirl-Quick-UI-win-x64
          run-id: 41475106009
          github-token: ${{ github.token }}
          path: historical-artifacts/package
      - name: Prepare the disposable runner display
        shell: pwsh
        run: ./scripts/Set-CiDisplayResolution.ps1
      - name: Reproduce the strict historical install and uninstall lifecycle
        shell: pwsh
        env:
          SWIRL_DISPOSABLE_INSTALL_TEST: '1'
        run: |
          $ErrorActionPreference='Stop'
          $envelopePath=Join-Path $env:GITHUB_WORKSPACE 'probe-evidence/envelope.json'
          $record=Get-Content -LiteralPath $envelopePath -Raw | ConvertFrom-Json
          $historical=Join-Path $env:GITHUB_WORKSPACE 'historical-checkout'
          $source=(& git -C $historical rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $record.historical_checkout_sha) { throw 'Historical checkout mismatch.' }
          $setup=Join-Path $env:GITHUB_WORKSPACE 'historical-artifacts/installer/Swirl-Setup.exe'
          $package=Join-Path $env:GITHUB_WORKSPACE 'historical-artifacts/package'
          $setupHash=(Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant()
          $manifestHash=(Get-FileHash -LiteralPath (Join-Path $package 'package-manifest.json')).Hash.ToLowerInvariant()
          if ($setupHash -cne $record.expected_installer_sha256 -or $manifestHash -cne $record.expected_manifest_sha256) {
            throw 'Historical artifact bytes differ from the reviewed immutable package.'
          }
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts/tests/Test-WindowsProductionInstaller.ps1'
          if ((Get-FileHash -LiteralPath $script).Hash.ToLowerInvariant() -cne $record.diagnostic_script_sha256) { throw 'Diagnostic script identity changed.' }
          $copiedScript=Join-Path $historical 'scripts/tests/Test-WindowsProductionInstaller.ps1'
          Copy-Item -LiteralPath $script -Destination $copiedScript -Force
          if ((Get-FileHash -LiteralPath $copiedScript).Hash.ToLowerInvariant() -cne $record.diagnostic_script_sha256) { throw 'Copied diagnostic script identity changed.' }
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'probe-evidence/lifecycle'
          try {
            & $copiedScript -Installer $setup -PackageDirectory $package -ExpectedSourceSha $source -EvidenceDirectory $evidence
          } finally {
            $report=Join-Path $evidence 'lifecycle.json'
            if (Test-Path -LiteralPath $report) {
              $lifecycle=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              $record.lifecycle_success=[bool]$lifecycle.success
            }
            $record | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $envelopePath -Encoding utf8
          }
      - name: Preserve historical diagnostic evidence even when cleanup fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Historical-Installer-Cleanup-Diagnostic
          path: |
            probe-evidence/
            build-evidence/ci-display.json
          if-no-files-found: error
          retention-days: 14

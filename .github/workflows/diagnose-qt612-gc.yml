name: Diagnose Windows Qt 6.12 GC fixtures

# One explicit label event builds fresh fixtures. This is not Swirl UI acceptance.
on:
  pull_request:
    branches: [test]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: swirl-qt612-gc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SWIRL_QT_VERSION: '6.12.0'

jobs:
  qt612-gc-fixtures:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'qa-qt612-gc-probe' && github.repository == 'SOLHK/Swirl' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/node-probe-render-20261105' && github.base_ref == 'test' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout the identified fixture source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements-qt-sdk.txt
      - name: Prepare fresh evidence and SDK tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('build/qt612-gc-probe','build-evidence/qt612-gc-probe')) {
            if (Test-Path -LiteralPath $path) { throw "Refusing pre-existing fixture output: $path" }
          }
          New-Item -ItemType Directory -Path 'build-evidence/qt612-gc-probe' | Out-Null
          python -m pip install -r tools/requirements-qt-sdk.txt
          if ($LASTEXITCODE -ne 0) { throw 'SDK tool installation failed.' }
      - name: Restore official Qt SDK archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/swirl-qt-6.12.0
          key: qt-sdk-${{ runner.os }}-6.12.0-msvc2022-${{ hashFiles('tools/Install-QtSdk.py', 'tools/requirements-qt-sdk.txt') }}
      - name: Install and verify official Qt 6.12 MSVC SDK including cache hits
        id: sdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkOutput = Join-Path $env:RUNNER_TEMP 'swirl-qt-6.12.0'
          python tools/Install-QtSdk.py --version $env:SWIRL_QT_VERSION --arch win64_msvc2022_64 --output $sdkOutput
          if ($LASTEXITCODE -ne 0) { throw 'Official Qt SDK installation failed.' }
          $sdk = Get-Content -LiteralPath (Join-Path $sdkOutput 'sdk-install-result.json') -Raw | ConvertFrom-Json
          $qtRoot = (Resolve-Path -LiteralPath $sdk.kit_root).Path
          $version = (& (Join-Path $qtRoot 'bin/qmake.exe') -query QT_VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne $env:SWIRL_QT_VERSION -or $sdk.arch -ne 'win64_msvc2022_64') { throw 'Unexpected Qt version or ABI.' }
          foreach ($component in @('Qt6QmlPrivate','Qt6Quick','Qt6QuickControls2')) {
            if (-not (Test-Path -LiteralPath (Join-Path $qtRoot "lib/cmake/$component/${component}Config.cmake"))) { throw "Missing Qt component: $component" }
          }
          "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          (Join-Path $qtRoot 'bin') >> $env:GITHUB_PATH
          Copy-Item -LiteralPath (Join-Path $sdkOutput 'sdk-install-result.json') -Destination 'build-evidence/qt612-gc-probe/qt-sdk.json'
      - name: Build both fixtures from this checkout without a compiler-output cache
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S tools/repros/qt612-popup-gc -B build/qt612-gc-probe -G 'Visual Studio 17 2022' -A x64 2>&1 | Tee-Object -FilePath 'build-evidence/qt612-gc-probe/configure.log'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture configure failed.' }
          cmake --build build/qt612-gc-probe --config Release --target PopupGcFixture SweepSlotsProbe --parallel 2 2>&1 | Tee-Object -FilePath 'build-evidence/qt612-gc-probe/build.log'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed.' }
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'build/qt612-gc-probe/runtime'
          New-Item -ItemType Directory -Path $runtime | Out-Null
          foreach ($exe in @('PopupGcFixture.exe','SweepSlotsProbe.exe')) {
            Copy-Item -LiteralPath "build/qt612-gc-probe/Release/$exe" -Destination $runtime
            & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --no-translations --include-plugins qoffscreen --qmldir tools/repros/qt612-popup-gc (Join-Path $runtime $exe) 2>&1 | Tee-Object -FilePath "build-evidence/qt612-gc-probe/deploy-$exe.log"
            if ($LASTEXITCODE -ne 0) { throw "Fixture deployment failed: $exe" }
          }
          "[Paths]`nPrefix=.`nPlugins=.`nQmlImports=qml`n" | Set-Content -LiteralPath (Join-Path $runtime 'qt.conf') -Encoding ascii
          $sdkHash = (Get-FileHash -LiteralPath "$env:QT_ROOT_DIR/bin/Qt6Qml.dll" -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath (Join-Path $runtime 'Qt6Qml.dll') -Algorithm SHA256).Hash -cne $sdkHash) { throw 'Deployed Qt QML identity differs from the verified SDK.' }
          $offscreenSource = Join-Path $env:QT_ROOT_DIR 'plugins/platforms/qoffscreen.dll'
          $offscreenCopy = Join-Path $runtime 'platforms/qoffscreen.dll'
          if (-not (Test-Path -LiteralPath $offscreenCopy -PathType Leaf)) { throw 'The explicit offscreen platform plugin was not deployed.' }
          $offscreenHash = (Get-FileHash -LiteralPath $offscreenSource -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath $offscreenCopy -Algorithm SHA256).Hash -cne $offscreenHash) { throw 'Deployed offscreen plugin differs from the verified SDK.' }
          # Windows offscreen QPA does not discover system fonts. Stage one
          # temporary Latin font outside the uploaded evidence tree.
          $fontDir = Join-Path $runtime 'lib/fonts'
          New-Item -ItemType Directory -Path $fontDir -Force | Out-Null
          $fontSource = @("$env:WINDIR/Fonts/segoeui.ttf", "$env:WINDIR/Fonts/arial.ttf") | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $fontSource) { throw 'No temporary Latin font is available for the fixture.' }
          $fontCopy = Join-Path $fontDir ([IO.Path]::GetFileName($fontSource))
          Copy-Item -LiteralPath $fontSource -Destination $fontCopy
          $fontHash = (Get-FileHash -LiteralPath $fontSource -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath $fontCopy -Algorithm SHA256).Hash -cne $fontHash) { throw 'Temporary font differs from the runner source.' }
          [ordered]@{
            schema=1; source_sha=$env:GITHUB_SHA
            qoffscreen=[ordered]@{ sdk_path=$offscreenSource; deployed_path=$offscreenCopy; sdk_sha256=$offscreenHash.ToLowerInvariant(); deployed_sha256=(Get-FileHash -LiteralPath $offscreenCopy -Algorithm SHA256).Hash.ToLowerInvariant() }
            temporary_font=[ordered]@{ source_path=$fontSource; deployed_path=$fontCopy; source_sha256=$fontHash.ToLowerInvariant(); deployed_sha256=(Get-FileHash -LiteralPath $fontCopy -Algorithm SHA256).Hash.ToLowerInvariant(); source_bytes=(Get-Item -LiteralPath $fontSource).Length; deployed_bytes=(Get-Item -LiteralPath $fontCopy).Length; font_directory=$fontDir; font_file_uploaded=$false }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'build-evidence/qt612-gc-probe/runtime-prerequisites.json' -Encoding utf8
      - name: Run all three independent eight-second cases and aggregate afterwards
        id: probe
        shell: pwsh
        env:
          SWIRL_QT612_GC_PROBE: '1'
          SWIRL_EXECUTING_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/RunQt612GcProbe.py --runtime-directory build/qt612-gc-probe/runtime --qt-root "$env:QT_ROOT_DIR" --output-directory build-evidence/qt612-gc-probe/cases --expected-source-sha "$env:GITHUB_SHA" --expected-pr-head-sha "$env:SWIRL_EXECUTING_PR_HEAD"
          if ($LASTEXITCODE -ne 0) { throw 'At least one fixture failed, timed out, warned, or remained inconclusive. All available case receipts are retained.' }
      - name: Record actual workflow step outcomes
        if: always()
        shell: pwsh
        env:
          SWIRL_SDK_OUTCOME: ${{ steps.sdk.outcome }}
          SWIRL_BUILD_OUTCOME: ${{ steps.build.outcome }}
          SWIRL_PROBE_OUTCOME: ${{ steps.probe.outcome }}
          SWIRL_EXECUTING_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Path 'build-evidence/qt612-gc-probe' -Force | Out-Null
          [ordered]@{
            schema=1; executing_workflow_sha=$env:GITHUB_SHA; executing_pr_head_sha=$env:SWIRL_EXECUTING_PR_HEAD
            run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT
            sdk_step=$env:SWIRL_SDK_OUTCOME; build_step=$env:SWIRL_BUILD_OUTCOME; probe_step=$env:SWIRL_PROBE_OUTCOME
            scope='Only freshly built public Qt GC fixtures, offscreen/software; no Swirl, real subscription, native GPU acceptance, or VME-root-cause conclusion.'
            finished_utc=[DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath 'build-evidence/qt612-gc-probe/step-outcomes.json' -Encoding utf8
      - name: Preserve all original fixture outputs and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swirl-Qt612-GC-Fixture-Diagnosis
          path: build-evidence/qt612-gc-probe/
          if-no-files-found: error
          retention-days: 14

name: Swirl VF D3 preserve reviewed local checkpoint
on:
  push:
    branches: [work/vf-macos-windows-d1-20261021]
    paths: ['.github/workflows/swirl-vf-d3-save-checkpoint.yml']
permissions:
  contents: write
jobs:
  preserve:
    if: github.repository == 'SOLHK/Swirl' && github.ref == 'refs/heads/work/vf-macos-windows-d1-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve the local commit without rewriting either history
        env:
          SAVED_LOCAL_COMMIT: ''
        run: |
          python - <<'PY'
          import os, base64, subprocess
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          raw = base64.b64decode(os.environ['SAVED_LOCAL_COMMIT'], validate=True)
          expected = '971c1d750d061983fa7147e16f1098420e03cb46'
          assert git('hash-object', '-t', 'commit', '--stdin', input=raw) == expected
          assert raw.startswith(b'tree 551fdb836b44472020fd5a6842e42bf7ba7f7535\nparent 57ffd081b850a094eaa2f93c557cc91f1a5047a2\n')
          # Its tree is the exact reviewed remote checkpoint, already on GitHub.
          assert git('rev-parse', '1c90c4d93527b20c0430e59973ad80885b55b889^{tree}') == '551fdb836b44472020fd5a6842e42bf7ba7f7535'
          assert git('hash-object', '-t', 'commit', '-w', '--stdin', input=raw) == expected
          PY
          git config user.name 'Swirl checkpoint preservation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff 971c1d750d061983fa7147e16f1098420e03cb46 -m 'Preserve reviewed local D3 checkpoint alongside its remote tree'
          git diff --exit-code "$GITHUB_SHA" HEAD
          git push origin HEAD:refs/heads/work/vf-macos-windows-d1-20261021

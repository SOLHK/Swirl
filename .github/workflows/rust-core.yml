name: Swirl Rust Core
on:
  push:
    branches: [test, main, work/core-completion-20261017]
  pull_request:
    branches: [test, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --workspace --lib --bins
      - run: cargo build --release --locked -p swirl-transport --example reality-client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent portable protocol peers
        run: |
          python -m pip install cryptography==50.0.2
          python ../tools/tests/generate_reality_vectors.py --check
          python ../tools/tests/generate_vision_vectors.py --check
          export SWIRL_RUST_HARNESS="$PWD/target/release/swirl-api"
          export SWIRL_RUST_INSPECTOR="$PWD/target/release/swirl-inspect"
          export SWIRL_RUST_DIAGNOSTIC="$PWD/target/release/swirl-diagnose"
          export SWIRL_REALITY_CLIENT="$PWD/target/release/examples/reality-client"
          test -x "$SWIRL_RUST_HARNESS"
          test -x "$SWIRL_RUST_INSPECTOR"
          test -x "$SWIRL_RUST_DIAGNOSTIC"
          test -x "$SWIRL_REALITY_CLIENT"
          python ../tools/tests/test_reality_peer.py
          python ../tools/tests/test_reality_tls.py
          python ../tools/tests/test_rust_core.py
          python ../tools/tests/test_shadowsocks.py
          python ../tools/tests/test_dns_tls.py
          python ../tools/tests/test_dns_https.py
          python ../tools/tests/test_socks4.py
          python ../tools/tests/test_websocket_transport.py
          python ../tools/tests/test_core_development.py
          python ../tools/tests/test_policy_groups.py
          python ../tools/tests/test_dns_negative.py
          python ../tools/tests/test_native_probe.py
          python ../tools/tests/test_connection_stages.py
          python ../tools/tests/test_connectivity_diagnostics.py
          python ../tools/tests/test_subscription_import.py
          python ../tools/tests/test_socks5_udp.py
      - name: Subscription to native proxy and target
        working-directory: .
        shell: bash
        env:
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_PRODUCT_EVIDENCE: ${{ runner.temp }}/swirl-product-chain-rust
        run: |
          set -euo pipefail
          test -x "$SWIRL_RUST_HARNESS"
          test -x "$SWIRL_RUST_INSPECTOR"
          python tools/tests/test_product_subscription_chain.py -v
      - name: Preserve subscription product rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Product-Chain-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-product-chain-rust
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned Go for the independent Xray peer
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build pinned Xray and verify REALITY interoperability
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_XRAY_EVIDENCE: ${{ runner.temp }}/swirl-xray-results
          SWIRL_REALITY_CLIENT: ${{ github.workspace }}/core/target/release/examples/reality-client
        run: |
          set -euo pipefail
          python tools/Build-XrayPeer.py --output "$SWIRL_XRAY_PEER_DIR"
          python tools/tests/test_reality_xray.py
      - name: Preserve Xray build identity and raw interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Xray-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-xray-results
          if-no-files-found: error
          retention-days: 14
      - name: Build native Vision client and verify Xray interoperability
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_VISION_EVIDENCE: ${{ runner.temp }}/swirl-vision-results
          SWIRL_VISION_CLIENT: ${{ github.workspace }}/core/target/release/examples/vision-client
        run: |
          set -euo pipefail
          mkdir -p "$SWIRL_VISION_EVIDENCE"
          cargo build --manifest-path core/Cargo.toml --release --locked -p swirl-protocol --example vision-client 2>&1 | tee "$SWIRL_VISION_EVIDENCE/client-build.log"
          test -x "$SWIRL_VISION_CLIENT"
          python tools/tests/test_vision_xray.py 2>&1 | tee "$SWIRL_VISION_EVIDENCE/peer-test.log"
      - name: Preserve Vision client and full Xray interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Vision-Xray-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-vision-results
          if-no-files-found: error
          retention-days: 14
      - name: Native public HTTPS and DoH verification
        if: runner.os == 'Linux'
        run: python ../tools/Verify-PublicRustCore.py --harness target/release/swirl-api --output ../CORE_PUBLIC_NETWORK.json
      - name: Preserve public network evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Core-Public-Network
          path: CORE_PUBLIC_NETWORK.json
          retention-days: 7
  windows-rust:
    runs-on: windows-2022
    # Includes the complete native application after the existing Qt/Core gates.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --workspace --lib --bins
      - name: Build native REALITY TLS peer client
        shell: pwsh
        run: |
          cargo build --release --locked -p swirl-transport --example reality-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent TLS and protocol peers
        id: independent_windows_peers
        shell: pwsh
        run: |
          python -m pip install cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/generate_reality_vectors.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/generate_vision_vectors.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWIRL_RUST_HARNESS=(Resolve-Path target/release/swirl-api.exe).Path
          $env:SWIRL_RUST_INSPECTOR=(Resolve-Path target/release/swirl-inspect.exe).Path
          $env:SWIRL_RUST_DIAGNOSTIC=(Resolve-Path target/release/swirl-diagnose.exe).Path
          $env:SWIRL_REALITY_CLIENT=(Resolve-Path target/release/examples/reality-client.exe).Path
          if (-not (Test-Path $env:SWIRL_RUST_HARNESS -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_INSPECTOR -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_DIAGNOSTIC -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_REALITY_CLIENT -PathType Leaf)) { throw 'Required Rust test binary missing' }
          python ../tools/tests/test_reality_peer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_reality_tls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_rust_core.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_shadowsocks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_tls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_https.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_socks4.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_websocket_transport.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_core_development.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_policy_groups.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_negative.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_native_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_connection_stages.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_connectivity_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_subscription_import.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_socks5_udp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_subscription_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_codex_management.py
      - name: Diagnose hosted Windows port allocation after a peer failure
        if: failure() && steps.independent_windows_peers.conclusion == 'failure'
        shell: pwsh
        run: |
          # Read only: retain the failed test's outcome and host reservation facts.
          # TCP and UDP have separate dynamic/excluded port ranges on Windows.
          netsh interface ipv4 show dynamicport tcp
          netsh interface ipv4 show dynamicport udp
          netsh interface ipv4 show excludedportrange protocol=tcp
          netsh interface ipv4 show excludedportrange protocol=udp
          netsh interface ipv6 show dynamicport tcp
          netsh interface ipv6 show dynamicport udp
          netsh interface ipv6 show excludedportrange protocol=tcp
          netsh interface ipv6 show excludedportrange protocol=udp
      - name: Subscription to native proxy and target
        working-directory: .
        shell: pwsh
        env:
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api.exe
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect.exe
          SWIRL_PRODUCT_EVIDENCE: ${{ runner.temp }}/swirl-product-chain-rust
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:SWIRL_RUST_HARNESS -PathType Leaf)) { throw 'Required product chain binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_INSPECTOR -PathType Leaf)) { throw 'Required product chain binary missing' }
          python tools/tests/test_product_subscription_chain.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve subscription product rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Product-Chain-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-product-chain-rust
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned Go for the independent Xray peer
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build pinned Xray and verify REALITY interoperability
        working-directory: .
        shell: pwsh
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_XRAY_EVIDENCE: ${{ runner.temp }}/swirl-xray-results
          SWIRL_REALITY_CLIENT: ${{ github.workspace }}/core/target/release/examples/reality-client.exe
        run: |
          python tools/Build-XrayPeer.py --output "$env:SWIRL_XRAY_PEER_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_reality_xray.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Xray build identity and raw interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Xray-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-xray-results
          if-no-files-found: error
          retention-days: 14
      - name: Build native Vision client and verify Xray interoperability
        working-directory: .
        shell: pwsh
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_VISION_EVIDENCE: ${{ runner.temp }}/swirl-vision-results
          SWIRL_VISION_CLIENT: ${{ github.workspace }}/core/target/release/examples/vision-client.exe
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:SWIRL_VISION_EVIDENCE | Out-Null
          cargo build --manifest-path core/Cargo.toml --release --locked -p swirl-protocol --example vision-client 2>&1 | Tee-Object -FilePath "$env:SWIRL_VISION_EVIDENCE/client-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $env:SWIRL_VISION_CLIENT -PathType Leaf)) { throw 'Required Vision Release client missing' }
          python tools/tests/test_vision_xray.py 2>&1 | Tee-Object -FilePath "$env:SWIRL_VISION_EVIDENCE/peer-test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Vision client and full Xray interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Vision-Xray-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-vision-results
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Swirl-Rust-Core-Windows
          path: |
            core/target/release/swirl_api.dll
            core/target/release/swirl-api.exe
            core/target/release/swirl-inspect.exe
            core/target/release/swirl-diagnose.exe
            core/Cargo.lock
            tools/SwirlCodexManage.py
            tools/SubscriptionCapture.py
            docs/CODEX_PROXY_MANAGEMENT.md
      - name: Install Qt for Rust control adapter
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Build Qt to Rust integration test
        working-directory: .
        run: |
          cmake -S src/Swirl.Quick -B build/rust-qt -G "Visual Studio 17 2022" -A x64 -DSWIRL_USE_RUST_CORE=ON -DSWIRL_BUILD_UI_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/rust-qt --config Release --target SwirlRustCoreTests SwirlStoragePathsTests SwirlImportTests --parallel
      - name: Reject native DNS policy in compatibility builds without starting a core
        working-directory: .
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          cmake -S src/Swirl.Quick -B build/compat-dns -G "Visual Studio 17 2022" -A x64 -DSWIRL_USE_RUST_CORE=OFF -DSWIRL_BUILD_UI_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/compat-dns --config Release --target SwirlEngineTests SwirlImportTests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          windeployqt --release build/compat-dns/Release/SwirlEngineTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWIRL_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'swirl-compat-dns-tests'
          New-Item -ItemType Directory -Force -Path $env:SWIRL_TEST_ROOT | Out-Null
          ctest --test-dir build/compat-dns -C Release -R '^swirl-(native-dns-compatibility-guard|import-boundaries)$' --output-on-failure -V
          $compatQtExit = $LASTEXITCODE
          foreach ($compatQtReport in @(
            'build/compat-dns/swirl-native-dns-compatibility-guard.xml',
            'build/compat-dns/swirl-import-boundaries.xml'
          )) {
            if (-not (Test-Path $compatQtReport -PathType Leaf)) { throw 'Required compatibility Qt XML report missing' }
            Get-Content -LiteralPath $compatQtReport
          }
          if ($compatQtExit -ne 0) { exit $compatQtExit }
      - name: Run Qt to Rust integration without Mihomo
        working-directory: .
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          windeployqt --release build/rust-qt/Release/SwirlRustCoreTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWIRL_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'swirl-native-qt-tests'
          New-Item -ItemType Directory -Force -Path $env:SWIRL_TEST_ROOT | Out-Null
          ctest --test-dir build/rust-qt -C Release -R '^swirl-(rust-qt-integration|storage-paths|import-boundaries)$' --output-on-failure -V
          $nativeQtExit = $LASTEXITCODE
          foreach ($nativeQtReport in @(
            'build/rust-qt/swirl-rust-qt-integration.xml',
            'build/rust-qt/swirl-import-boundaries.xml'
          )) {
            if (-not (Test-Path $nativeQtReport -PathType Leaf)) { throw 'Required native Qt XML report missing' }
            Get-Content -LiteralPath $nativeQtReport
          }
          if ($nativeQtExit -ne 0) { exit $nativeQtExit }
          $env:SWIRL_RUST_HARNESS=(Resolve-Path core/target/release/swirl-api.exe).Path
          $env:SWIRL_RUST_QT_TESTS=(Resolve-Path build/rust-qt/Release/SwirlRustCoreTests.exe).Path
          python tools/tests/test_shadowsocks.py ShadowsocksTests.test_qt_facade_http_obfs_with_udp_declared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_rust_core.py RustCoreIntegration.test_vless_qt_data_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_socks4.py Socks4Integration.test_qt_imported_socks4_and_4a_data_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_websocket_transport.py WebSocketTransportTests.test_qt_vless_websocket_data_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_socks5_udp.py Socks5UdpIntegration.test_qt_imported_socks5_udp_data_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Subscription through persisted Qt product configuration
        working-directory: .
        shell: pwsh
        env:
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api.exe
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect.exe
          SWIRL_PRODUCT_EVIDENCE: ${{ runner.temp }}/swirl-product-chain-qt
          SWIRL_RUST_QT_TESTS: ${{ github.workspace }}/build/rust-qt/Release/SwirlRustCoreTests.exe
          SWIRL_TEST_ROOT: ${{ runner.temp }}/swirl-product-qt-tests
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:SWIRL_RUST_HARNESS -PathType Leaf)) { throw 'Required product chain binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_INSPECTOR -PathType Leaf)) { throw 'Required product chain binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_QT_TESTS -PathType Leaf)) { throw 'Required product chain binary missing' }
          New-Item -ItemType Directory -Force -Path $env:SWIRL_TEST_ROOT | Out-Null
          python tools/tests/test_product_subscription_chain.py ProductQtIntegration -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve subscription product qt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Product-Chain-${{ runner.os }}-qt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-product-chain-qt
          if-no-files-found: error
          retention-days: 14
      - name: Build complete native Rust application
        working-directory: .
        run: |
          cmake --build build/rust-qt --config Release --target Swirl --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/rust-qt/Release/Swirl.exe -PathType Leaf)) { throw 'Native Swirl executable missing after build' }
      - name: Preserve isolated Qt test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Rust-Qt-Tests-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/rust-qt/swirl-rust-qt-integration.xml
            build/rust-qt/swirl-import-boundaries.xml
            build/compat-dns/swirl-native-dns-compatibility-guard.xml
            build/compat-dns/swirl-import-boundaries.xml
          if-no-files-found: warn
          retention-days: 7

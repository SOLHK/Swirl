name: Swirl Rust Core
on:
  push:
    branches: [test, main, work/core-completion-20261017]
  pull_request:
    branches: [test, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --workspace --lib --bins
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent portable protocol peers
        run: |
          python -m pip install cryptography==50.0.2
          export SWIRL_RUST_HARNESS="$PWD/target/release/swirl-api"
          export SWIRL_RUST_INSPECTOR="$PWD/target/release/swirl-inspect"
          export SWIRL_RUST_DIAGNOSTIC="$PWD/target/release/swirl-diagnose"
          test -x "$SWIRL_RUST_HARNESS"
          test -x "$SWIRL_RUST_INSPECTOR"
          test -x "$SWIRL_RUST_DIAGNOSTIC"
          python ../tools/tests/test_rust_core.py
          python ../tools/tests/test_shadowsocks.py
          python ../tools/tests/test_dns_tls.py
          python ../tools/tests/test_dns_https.py
          python ../tools/tests/test_socks4.py
          python ../tools/tests/test_websocket_transport.py
          python ../tools/tests/test_core_development.py
          python ../tools/tests/test_policy_groups.py
          python ../tools/tests/test_dns_negative.py
          python ../tools/tests/test_native_probe.py
          python ../tools/tests/test_connection_stages.py
          python ../tools/tests/test_connectivity_diagnostics.py
          python ../tools/tests/test_subscription_import.py
      - name: Native public HTTPS and DoH verification
        if: runner.os == 'Linux'
        run: python ../tools/Verify-PublicRustCore.py --harness target/release/swirl-api --output ../CORE_PUBLIC_NETWORK.json
      - name: Preserve public network evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Core-Public-Network
          path: CORE_PUBLIC_NETWORK.json
          retention-days: 7
  windows-rust:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --workspace --lib --bins
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent TLS and protocol peers
        shell: pwsh
        run: |
          python -m pip install cryptography==50.0.2
          $env:SWIRL_RUST_HARNESS=(Resolve-Path target/release/swirl-api.exe).Path
          $env:SWIRL_RUST_INSPECTOR=(Resolve-Path target/release/swirl-inspect.exe).Path
          $env:SWIRL_RUST_DIAGNOSTIC=(Resolve-Path target/release/swirl-diagnose.exe).Path
          if (-not (Test-Path $env:SWIRL_RUST_HARNESS -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_INSPECTOR -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_DIAGNOSTIC -PathType Leaf)) { throw 'Required Rust test binary missing' }
          python ../tools/tests/test_rust_core.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_shadowsocks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_tls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_https.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_socks4.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_websocket_transport.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_core_development.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_policy_groups.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_negative.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_native_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_connection_stages.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_connectivity_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_subscription_import.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_subscription_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_codex_management.py
      - uses: actions/upload-artifact@v4
        with:
          name: Swirl-Rust-Core-Windows
          path: |
            core/target/release/swirl_api.dll
            core/target/release/swirl-api.exe
            core/target/release/swirl-inspect.exe
            core/target/release/swirl-diagnose.exe
            core/Cargo.lock
            tools/SwirlCodexManage.py
            tools/SubscriptionCapture.py
            docs/CODEX_PROXY_MANAGEMENT.md
      - name: Install Qt for Rust control adapter
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Build Qt to Rust integration test
        working-directory: .
        run: |
          cmake -S src/Swirl.Quick -B build/rust-qt -G "Visual Studio 17 2022" -A x64 -DSWIRL_USE_RUST_CORE=ON -DSWIRL_BUILD_UI_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/rust-qt --config Release --target SwirlRustCoreTests SwirlStoragePathsTests SwirlImportTests --parallel
      - name: Reject native DNS policy in compatibility builds without starting a core
        working-directory: .
        run: |
          cmake -S src/Swirl.Quick -B build/compat-dns -G "Visual Studio 17 2022" -A x64 -DSWIRL_USE_RUST_CORE=OFF -DSWIRL_BUILD_UI_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/compat-dns --config Release --target SwirlEngineTests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          windeployqt --release build/compat-dns/Release/SwirlEngineTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWIRL_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'swirl-compat-dns-tests'
          New-Item -ItemType Directory -Force -Path $env:SWIRL_TEST_ROOT | Out-Null
          ctest --test-dir build/compat-dns -C Release -R '^swirl-native-dns-compatibility-guard$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Qt to Rust integration without Mihomo
        working-directory: .
        run: |
          windeployqt --release build/rust-qt/Release/SwirlRustCoreTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWIRL_TEST_ROOT=Join-Path $env:RUNNER_TEMP 'swirl-native-qt-tests'
          New-Item -ItemType Directory -Force -Path $env:SWIRL_TEST_ROOT | Out-Null
          ctest --test-dir build/rust-qt -C Release -R '^swirl-(rust-qt-integration|storage-paths|import-boundaries)$' --output-on-failure
          $nativeQtExit = $LASTEXITCODE
          $nativeQtReport = 'build/rust-qt/swirl-rust-qt-integration.xml'
          if (-not (Test-Path $nativeQtReport -PathType Leaf)) { throw 'Required native Qt XML report missing' }
          Get-Content -LiteralPath $nativeQtReport
          if ($nativeQtExit -ne 0) { exit $nativeQtExit }
          $env:SWIRL_RUST_HARNESS=(Resolve-Path core/target/release/swirl-api.exe).Path
          $env:SWIRL_RUST_QT_TESTS=(Resolve-Path build/rust-qt/Release/SwirlRustCoreTests.exe).Path
          python tools/tests/test_shadowsocks.py ShadowsocksTests.test_qt_facade_http_obfs_with_udp_declared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_rust_core.py RustCoreIntegration.test_vless_qt_data_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_socks4.py Socks4Integration.test_qt_imported_socks4_and_4a_data_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_websocket_transport.py WebSocketTransportTests.test_qt_vless_websocket_data_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Swirl Rust Core
on:
  push:
    branches: [test, main, work/core-completion-20261017, work/core-rule-routing-20261021, work/rust-core-network-fixes-20261021, work/xray-v2ray-json-import-20261021]
  pull_request:
    branches: [test, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --workspace --lib --bins
      - run: cargo build --release --locked -p swirl-transport --example reality-client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent portable protocol peers
        run: |
          python -m pip install cryptography==50.0.2
          python ../tools/tests/generate_reality_vectors.py --check
          python ../tools/tests/generate_vision_vectors.py --check
          export SWIRL_RUST_HARNESS="$PWD/target/release/swirl-api"
          export SWIRL_RUST_INSPECTOR="$PWD/target/release/swirl-inspect"
          export SWIRL_RUST_DIAGNOSTIC="$PWD/target/release/swirl-diagnose"
          export SWIRL_REALITY_CLIENT="$PWD/target/release/examples/reality-client"
          test -x "$SWIRL_RUST_HARNESS"
          test -x "$SWIRL_RUST_INSPECTOR"
          test -x "$SWIRL_RUST_DIAGNOSTIC"
          test -x "$SWIRL_REALITY_CLIENT"
          python ../tools/tests/test_reality_peer.py
          python ../tools/tests/test_reality_tls.py
          python ../tools/tests/test_rust_core.py
          python ../tools/tests/test_shadowsocks.py
          python ../tools/tests/test_dns_tls.py
          python ../tools/tests/test_dns_https.py
          python ../tools/tests/test_socks4.py
          python ../tools/tests/test_websocket_transport.py
          python ../tools/tests/test_core_development.py
          python ../tools/tests/test_policy_groups.py
          python ../tools/tests/test_dns_negative.py
          python ../tools/tests/test_native_probe.py
          python ../tools/tests/test_connection_stages.py
          python ../tools/tests/test_connectivity_diagnostics.py
          python ../tools/tests/test_subscription_import.py
          python ../tools/tests/test_socks5_udp.py
      - name: Subscription to native proxy and target
        working-directory: .
        shell: bash
        env:
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_PRODUCT_EVIDENCE: ${{ runner.temp }}/swirl-product-chain-rust
        run: |
          set -euo pipefail
          test -x "$SWIRL_RUST_HARNESS"
          test -x "$SWIRL_RUST_INSPECTOR"
          python tools/tests/test_product_subscription_chain.py -v
      - name: Preserve subscription product rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Product-Chain-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-product-chain-rust
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned Go for the independent Xray peer
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build pinned Xray and verify REALITY interoperability
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_XRAY_EVIDENCE: ${{ runner.temp }}/swirl-xray-results
          SWIRL_REALITY_CLIENT: ${{ github.workspace }}/core/target/release/examples/reality-client
        run: |
          set -euo pipefail
          python tools/Build-XrayPeer.py --output "$SWIRL_XRAY_PEER_DIR"
          python tools/tests/test_reality_xray.py
      - name: Preserve Xray build identity and raw interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Xray-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-xray-results
          if-no-files-found: error
          retention-days: 14
      - name: Build native Vision client and verify Xray interoperability
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_VISION_EVIDENCE: ${{ runner.temp }}/swirl-vision-results
          SWIRL_VISION_CLIENT: ${{ github.workspace }}/core/target/release/examples/vision-client
        run: |
          set -euo pipefail
          mkdir -p "$SWIRL_VISION_EVIDENCE"
          cargo build --manifest-path core/Cargo.toml --release --locked -p swirl-protocol --example vision-client 2>&1 | tee "$SWIRL_VISION_EVIDENCE/client-build.log"
          test -x "$SWIRL_VISION_CLIENT"
          python tools/tests/test_vision_xray.py 2>&1 | tee "$SWIRL_VISION_EVIDENCE/peer-test.log"
      - name: Preserve Vision client and full Xray interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Vision-Xray-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-vision-results
          if-no-files-found: error
          retention-days: 14
      - name: Build native ClientHello and verify independent Chrome133 fingerprint
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_FINGERPRINT_EVIDENCE: ${{ runner.temp }}/swirl-fingerprint-results
          SWIRL_REALITY_HELLO: ${{ github.workspace }}/core/target/release/examples/reality-hello
        run: |
          set -euo pipefail
          mkdir -p "$SWIRL_FINGERPRINT_EVIDENCE"
          cargo build --manifest-path core/Cargo.toml --release --locked -p swirl-transport --example reality-hello 2>&1 | tee "$SWIRL_FINGERPRINT_EVIDENCE/client-build.log"
          test -x "$SWIRL_REALITY_HELLO"
          test -x "$SWIRL_XRAY_PEER_DIR/utls-hello"
          python tools/tests/test_reality_fingerprint.py 2>&1 | tee "$SWIRL_FINGERPRINT_EVIDENCE/oracle-test.log"
      - name: Preserve raw ClientHello and independent uTLS fingerprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Chrome133-Fingerprint-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-fingerprint-results
          if-no-files-found: error
          retention-days: 14
      - name: Production REALITY Runtime through full Xray to HTTP and HTTPS
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_REALITY_RUNTIME_EVIDENCE: ${{ runner.temp }}/swirl-reality-runtime-rust
        run: |
          set -euo pipefail
          python tools/tests/test_reality_runtime.py
      - name: Preserve production REALITY Runtime rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Runtime-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-reality-runtime-rust
          if-no-files-found: error
          retention-days: 14
      - name: Production REALITY + Vision Runtime through full Xray to HTTP and HTTPS
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_REALITY_RUNTIME_EVIDENCE: ${{ runner.temp }}/swirl-reality-vision-runtime-rust
        run: |
          set -euo pipefail
          python tools/tests/test_reality_runtime.py --vision
      - name: Preserve production REALITY + Vision Runtime rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Vision-Runtime-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-reality-vision-runtime-rust
          if-no-files-found: error
          retention-days: 14
      - name: Native REALITY to independent public HTTP and HTTPS
        if: runner.os == 'Linux'
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_PUBLIC_REALITY_OUTPUT: ${{ runner.temp }}/swirl-public-reality/report.json
        run: |
          set -euo pipefail
          python tools/Verify-PublicRealityRuntime.py --harness core/target/release/swirl-api --inspector core/target/release/swirl-inspect --xray-peer-dir "$SWIRL_XRAY_PEER_DIR" --output "$SWIRL_PUBLIC_REALITY_OUTPUT"
      - name: Preserve public REALITY Runtime evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Public-REALITY-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-public-reality
          if-no-files-found: error
          retention-days: 14
      - name: Native REALITY + Vision to independent public HTTP and HTTPS
        if: runner.os == 'Linux'
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_PUBLIC_REALITY_OUTPUT: ${{ runner.temp }}/swirl-public-reality-vision/report.json
        run: |
          set -euo pipefail
          python tools/Verify-PublicRealityRuntime.py --harness core/target/release/swirl-api --inspector core/target/release/swirl-inspect --xray-peer-dir "$SWIRL_XRAY_PEER_DIR" --output "$SWIRL_PUBLIC_REALITY_OUTPUT" --vision
      - name: Preserve public REALITY + Vision Runtime evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Public-REALITY-Vision-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-public-reality-vision
          if-no-files-found: error
          retention-days: 14
      - name: Production REALITY + Chrome133 Runtime through full Xray to HTTP and HTTPS
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_REALITY_RUNTIME_EVIDENCE: ${{ runner.temp }}/swirl-reality-runtime-chrome133-rust
        run: |
          set -euo pipefail
          python tools/tests/test_reality_runtime.py --fingerprint chrome
      - name: Preserve production REALITY + Chrome133 Runtime rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Runtime-Chrome133-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-reality-runtime-chrome133-rust
          if-no-files-found: error
          retention-days: 14
      - name: Production REALITY + Vision + Chrome133 Runtime through full Xray to HTTP and HTTPS
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect
          SWIRL_REALITY_RUNTIME_EVIDENCE: ${{ runner.temp }}/swirl-reality-vision-runtime-chrome133-rust
        run: |
          set -euo pipefail
          python tools/tests/test_reality_runtime.py --vision --fingerprint chrome
      - name: Preserve production REALITY + Vision + Chrome133 Runtime rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Vision-Runtime-Chrome133-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-reality-vision-runtime-chrome133-rust
          if-no-files-found: error
          retention-days: 14
      - name: Native REALITY + Chrome133 to independent public HTTP and HTTPS
        if: runner.os == 'Linux'
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_PUBLIC_REALITY_OUTPUT: ${{ runner.temp }}/swirl-public-reality-chrome133/report.json
        run: |
          set -euo pipefail
          python tools/Verify-PublicRealityRuntime.py --harness core/target/release/swirl-api --inspector core/target/release/swirl-inspect --xray-peer-dir "$SWIRL_XRAY_PEER_DIR" --output "$SWIRL_PUBLIC_REALITY_OUTPUT" --fingerprint chrome
      - name: Preserve public REALITY + Chrome133 Runtime evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Public-REALITY-Chrome133-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-public-reality-chrome133
          if-no-files-found: error
          retention-days: 14
      - name: Native REALITY + Vision + Chrome133 to independent public HTTP and HTTPS
        if: runner.os == 'Linux'
        working-directory: .
        shell: bash
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_PUBLIC_REALITY_OUTPUT: ${{ runner.temp }}/swirl-public-reality-vision-chrome133/report.json
        run: |
          set -euo pipefail
          python tools/Verify-PublicRealityRuntime.py --harness core/target/release/swirl-api --inspector core/target/release/swirl-inspect --xray-peer-dir "$SWIRL_XRAY_PEER_DIR" --output "$SWIRL_PUBLIC_REALITY_OUTPUT" --vision --fingerprint chrome
      - name: Preserve public REALITY + Vision + Chrome133 Runtime evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Public-REALITY-Vision-Chrome133-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-public-reality-vision-chrome133
          if-no-files-found: error
          retention-days: 14
      - name: Native public HTTPS and DoH verification
        if: runner.os == 'Linux'
        run: python ../tools/Verify-PublicRustCore.py --harness target/release/swirl-api --output ../CORE_PUBLIC_NETWORK.json
      - name: Preserve public network evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Core-Public-Network
          path: CORE_PUBLIC_NETWORK.json
          retention-days: 7
  windows-rust:
    runs-on: windows-2022
    # Includes the complete native application after the existing Qt/Core gates.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --workspace --lib --bins
      - name: Build native REALITY TLS peer client
        shell: pwsh
        run: |
          cargo build --release --locked -p swirl-transport --example reality-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows Rust rule package assets
        working-directory: .
        shell: pwsh
        run: ./tools/tests/Test-WindowsRustRulePackage.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Independent TLS and protocol peers
        id: independent_windows_peers
        shell: pwsh
        run: |
          python -m pip install cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/generate_reality_vectors.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/generate_vision_vectors.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWIRL_RUST_HARNESS=(Resolve-Path target/release/swirl-api.exe).Path
          $env:SWIRL_RUST_INSPECTOR=(Resolve-Path target/release/swirl-inspect.exe).Path
          $env:SWIRL_RUST_DIAGNOSTIC=(Resolve-Path target/release/swirl-diagnose.exe).Path
          $env:SWIRL_REALITY_CLIENT=(Resolve-Path target/release/examples/reality-client.exe).Path
          if (-not (Test-Path $env:SWIRL_RUST_HARNESS -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_INSPECTOR -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_DIAGNOSTIC -PathType Leaf)) { throw 'Required Rust test binary missing' }
          if (-not (Test-Path $env:SWIRL_REALITY_CLIENT -PathType Leaf)) { throw 'Required Rust test binary missing' }
          python ../tools/tests/test_reality_peer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_reality_tls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_rust_core.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_shadowsocks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_tls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_https.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_socks4.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_websocket_transport.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_core_development.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_policy_groups.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_dns_negative.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_native_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_connection_stages.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_connectivity_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_subscription_import.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_socks5_udp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_subscription_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/tests/test_codex_management.py
      - name: Diagnose hosted Windows port allocation after a peer failure
        if: failure() && steps.independent_windows_peers.conclusion == 'failure'
        shell: pwsh
        run: |
          # Read only: retain the failed test's outcome and host reservation facts.
          # TCP and UDP have separate dynamic/excluded port ranges on Windows.
          netsh interface ipv4 show dynamicport tcp
          netsh interface ipv4 show dynamicport udp
          netsh interface ipv4 show excludedportrange protocol=tcp
          netsh interface ipv4 show excludedportrange protocol=udp
          netsh interface ipv6 show dynamicport tcp
          netsh interface ipv6 show dynamicport udp
          netsh interface ipv6 show excludedportrange protocol=tcp
          netsh interface ipv6 show excludedportrange protocol=udp
          # This is a later snapshot, not proof of the failed port's earlier owner.
          # Keep local endpoint/state/PID evidence without process command lines.
          Get-NetTCPConnection -ErrorAction Continue | Sort-Object LocalPort,LocalAddress | Select-Object LocalAddress,LocalPort,State,OwningProcess | Format-Table -AutoSize
          Get-NetUDPEndpoint -ErrorAction Continue | Sort-Object LocalPort,LocalAddress | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize
      - name: Subscription to native proxy and target
        working-directory: .
        shell: pwsh
        env:
          SWIRL_RUST_HARNESS: ${{ github.workspace }}/core/target/release/swirl-api.exe
          SWIRL_RUST_INSPECTOR: ${{ github.workspace }}/core/target/release/swirl-inspect.exe
          SWIRL_PRODUCT_EVIDENCE: ${{ runner.temp }}/swirl-product-chain-rust
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:SWIRL_RUST_HARNESS -PathType Leaf)) { throw 'Required product chain binary missing' }
          if (-not (Test-Path $env:SWIRL_RUST_INSPECTOR -PathType Leaf)) { throw 'Required product chain binary missing' }
          python tools/tests/test_product_subscription_chain.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve subscription product rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-Product-Chain-${{ runner.os }}-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swirl-product-chain-rust
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned Go for the independent Xray peer
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build pinned Xray and verify REALITY interoperability
        working-directory: .
        shell: pwsh
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_XRAY_EVIDENCE: ${{ runner.temp }}/swirl-xray-results
          SWIRL_REALITY_CLIENT: ${{ github.workspace }}/core/target/release/examples/reality-client.exe
        run: |
          python tools/Build-XrayPeer.py --output "$env:SWIRL_XRAY_PEER_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_reality_xray.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Xray build identity and raw interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swirl-REALITY-Xray-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swirl-xray-peer/build.log
            ${{ runner.temp }}/swirl-xray-peer/build-manifest.json
            ${{ runner.temp }}/swirl-xray-results
          if-no-files-found: error
          retention-days: 14
      - name: Build native Vision client and verify Xray interoperability
        working-directory: .
        shell: pwsh
        env:
          SWIRL_XRAY_PEER_DIR: ${{ runner.temp }}/swirl-xray-peer
          SWIRL_VISION_EVIDENCE: ${{ runner.temp }}/swirl-vision-results
          SWIRL_VISION_CLIENT: ${{ github.workspace }}/core/target/release/examples/vision-client.exe
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:SWIRL_VISION_EVIDENCE | Out-Null
          cargo build --manifest-path core/Cargo.toml --release --locked -p swirl-protocol --example vision-client 2>&1 | Tee-Object -FilePath "$env:SWIRL_VISION_EVIDENCE/client-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

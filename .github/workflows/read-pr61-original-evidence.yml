name: Read fixed PR61 original evidence

# Exact original artifacts only; this workflow does not run Swirl or node tests.
on:
  pull_request:
    branches: [test]
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: swirl-pr61-artifact-read-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  read-original-evidence:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'qa-pr61-artifact-read' && github.repository == 'SOLHK/Swirl' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/node-probe-render-20261105' && github.base_ref == 'test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kind: [package, node, sdk]
    steps:
      - name: Checkout the exact reader source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate reader syntax
        shell: bash
        run: python -m py_compile tools/ReadPr61ArtifactEvidence.py
      - name: Verify fixed ZIP bytes and emit bounded original text
        shell: bash
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python tools/ReadPr61ArtifactEvidence.py --kind '${{ matrix.kind }}'
      - name: Preserve original ZIP and verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: Swirl-PR61-Original-Evidence-${{ matrix.kind }}
          path: build-evidence/pr61-original-artifacts/${{ matrix.kind }}/
          if-no-files-found: error
          retention-days: 14

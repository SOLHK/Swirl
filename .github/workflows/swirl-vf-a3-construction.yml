name: Swirl VF A3 native input and constructor precision

on:
  push:
    branches: [work/vf-axis-a3]
    paths:
      - '.github/workflows/swirl-vf-a3-construction.yml'
      - 'tools/swirl_vf/platform/axis_a3_constructor_harness.py'
      - 'tools/swirl_vf/platform/probe_axis_a3_construction.py'
      - 'tools/swirl_vf/platform/axis_a3_input_cases.py'
      - 'tools/swirl_vf/tests/test_axis_a3_constructor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.61.1 numpy==2.2.6
      - run: python -m unittest discover -s tools/swirl_vf/tests -p 'test_axis_a3*.py' -v

  native-input-construction:
    needs: independent-controls
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.61.1 numpy==2.2.6
      - name: Observe exact input bits, nine constructors, opposite orders and declared replay
        run: |
          python tools/swirl_vf/platform/probe_axis_a3_construction.py \
            /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc \
            --output build/axis-a3-construction-summary/construction.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swirl-vf-a3-construction-${{ github.sha }}
          path: build/axis-a3-construction-summary/*.json
          retention-days: 7

name: Swirl VF B1 native metric discrimination

on:
  push:
    branches: [work/vf-metrics-b1]
    paths:
      - '.github/workflows/swirl-vf-b1-metrics.yml'
      - 'tools/swirl_vf/tests/test_metric_b1_public_output.py'
      # The frozen first-stage experiment does not rerun for new follow-up
      # modules or workflows. Its strict failure log is retained as evidence.
      - 'tools/swirl_vf/platform/b1_metric_discriminator.py'
      - 'tools/swirl_vf/platform/b1_metric_fixture.py'
      - 'tools/swirl_vf/platform/b1_metric_probe.swift'
      - 'tools/swirl_vf/platform/b1_original_metric_check.py'
      - 'tools/swirl_vf/tests/test_metric_b1_discriminator.py'
      - 'tools/swirl_vf/tests/test_metric_b1_fixture.py'
      - 'tools/swirl_vf/tests/test_metric_b1_original_check.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swirl-vf-b1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original fixture storage and all existing source regressions
        run: |
          python -m pip install fonttools==4.61.1 numpy==2.2.6
          python -m unittest discover -s tools/swirl_vf/tests -v
          python -m unittest discover -s tools/swirl_vf/audit -p 'test_*.py' -v

  apple-discriminator:
    needs: python
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record native environment and dependencies
        run: |
          mkdir -p build/b1-environment
          git rev-parse HEAD > build/b1-environment/commit.txt
          sw_vers > build/b1-environment/macos.txt
          xcodebuild -version > build/b1-environment/xcode.txt
          python -m pip install fonttools==4.61.1 numpy==2.2.6
      - name: UPEM paired four-channel measurements and independent reverse replay
        run: |
          python tools/swirl_vf/platform/b1_metric_discriminator.py --output build/b1-discriminator --require-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swirl-vf-b1-discriminator-${{ github.sha }}
          path: |
            build/b1-environment/*.txt
            build/b1-discriminator/*.json
            build/b1-discriminator/*.log
            build/b1-discriminator/raw/*.json
            build/b1-discriminator/raw/*.log
            build/b1-discriminator/fixtures/manifest.json
          retention-days: 14

  unchanged-strict-gates:
    needs: [python, apple-discriminator]
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install fonttools==4.61.1 numpy==2.2.6
      - name: Preserve the unchanged 849 versus 850 reference gate
        id: reference
        run: |
          python tools/swirl_vf/platform/test_coretext_extract.py --output build/b1-strict-reference --require-native
      - name: Strict original metric and vertical X representation checks
        if: always()
        run: |
          # Only the aggregate allowlist reaches logs/artifacts, including failures.
          set +e
          python tools/swirl_vf/platform/b1_original_metric_check.py \
            --source /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc \
            --binary "$PWD/build/b1-strict-reference/coretext_extract" \
            --output build/b1-original-metrics-public.json > "$RUNNER_TEMP/b1-original-private-process.log" 2>&1
          gate_status=$?
          set -e
          if [ -f build/b1-original-metrics-public.json ]; then
            cat build/b1-original-metrics-public.json
          fi
          exit "$gate_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swirl-vf-b1-strict-gates-${{ github.sha }}
          path: |
            build/b1-strict-reference/*.json
            build/b1-strict-reference/*.log
            build/b1-original-metrics-public.json
          retention-days: 14


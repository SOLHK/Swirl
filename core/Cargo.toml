[workspace]
resolver = "3"
members = ["crates/swirl-subscription", "crates/swirl-dns", "crates/swirl-routing", "crates/swirl-protocol", "crates/swirl-transport", "crates/swirl-core", "crates/swirl-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
socket2 = "0.6.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
httparse = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
sha2 = "0.10"
ring = "0.17"
md-5 = "0.10"
zeroize = "1"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
ml-kem = { version = "=0.3.3", features = ["zeroize"] }
x509-cert = { version = "=0.3.0", default-features = false }
der = { version = "=0.8.2", default-features = false, features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
url = "2"
percent-encoding = "2"
swirl-subscription = { path = "crates/swirl-subscription" }
swirl-dns = { path = "crates/swirl-dns" }
swirl-routing = { path = "crates/swirl-routing" }
swirl-protocol = { path = "crates/swirl-protocol" }
swirl-transport = { path = "crates/swirl-transport" }
swirl-core = { path = "crates/swirl-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

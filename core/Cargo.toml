[workspace]
resolver = "3"
exclude = ["vendor/rustls"]
members = ["crates/swirl-platform", "crates/swirl-subscription", "crates/swirl-dns", "crates/swirl-routing", "crates/swirl-protocol", "crates/swirl-transport", "crates/swirl-core", "crates/swirl-api", "crates/swirl-wintun", "crates/swirl-tun"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
socket2 = "0.6.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
httparse = "1"
h2 = "=0.4.20"
http = "=1.5.0"
bytes = "=1.12.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "brotli"] }
webpki-roots = "1"
sha2 = "0.10"
ring = "0.17"
aes = "=0.8.4"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
blake2 = "=0.10.6"
blake3 = "=1.8.7"
md-5 = "0.10"
zeroize = "1"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
ml-kem = { version = "=0.3.3", features = ["zeroize"] }
x509-cert = { version = "=0.3.0", default-features = false }
der = { version = "=0.8.2", default-features = false, features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
url = "2"
percent-encoding = "2"
swirl-subscription = { path = "crates/swirl-subscription" }
swirl-dns = { path = "crates/swirl-dns" }
swirl-routing = { path = "crates/swirl-routing" }
swirl-protocol = { path = "crates/swirl-protocol" }
swirl-transport = { path = "crates/swirl-transport" }
swirl-core = { path = "crates/swirl-core" }
swirl-platform = { path = "crates/swirl-platform" }
swirl-wintun = { path = "crates/swirl-wintun" }
swirl-tun = { path = "crates/swirl-tun" }
# 0BSD userspace TCP. Pinned below the 0.13+ MSRV jump so the workspace
# rust-version stays the floor. Wintun itself is not a crate dependency.
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-reno", "iface-max-addr-count-8", "iface-max-route-count-4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Minimal opt-in REALITY first-flight adapter; upstream provenance and licenses
# are retained in vendor/rustls/SWIRL-PATCH.md.
[patch.crates-io]
rustls = { path = "vendor/rustls" }

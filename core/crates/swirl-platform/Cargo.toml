[package]
name = "swirl-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ipnet.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
wintun = "=0.5.1"
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

# Only private Windows DLL/system-directory/socket FFI wrappers opt out.
# All other modules remain deny(unsafe_code); the workspace still forbids it.
[lints.rust]
unsafe_code = "deny"

[package]
name = "swirl-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
[features]
private-acceptance = ["swirl-transport/private-acceptance"]
private-acceptance-worker = ["private-acceptance", "swirl-transport/private-acceptance-worker", "dep:base64", "dep:tokio-rustls"]
private-acceptance-ui = ["private-acceptance-worker", "swirl-transport/private-acceptance-ui"]
[[bin]]
name = "swirl-private-worker"
path = "src/bin/swirl-private-worker.rs"
required-features = ["private-acceptance-worker"]
[[test]]
name = "private_worker"
path = "tests/private_worker.rs"
required-features = ["private-acceptance-worker"]
[[test]]
name = "private_ui_quota"
path = "tests/private_ui_quota.rs"
required-features = ["private-acceptance-ui"]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
swirl-dns.workspace = true
swirl-protocol.workspace = true
swirl-core = { workspace = true, features = ["native-tun"] }
swirl-subscription.workspace = true
swirl-transport.workspace = true
swirl-platform.workspace = true
swirl-tun.workspace = true
ipnet.workspace = true
ring.workspace = true
base64 = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
[dev-dependencies]
base64.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }

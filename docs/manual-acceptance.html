<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swirl · 人工验收</title>
<style>
:root{font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI",sans-serif;color:#17181b;background:#f3f4f7;color-scheme:light dark}*{box-sizing:border-box}body{max-width:1080px;margin:auto;padding:32px 24px 80px}header{position:sticky;top:0;background:#f3f4f7ed;backdrop-filter:blur(18px);padding:12px 0;z-index:2}h1{margin:0;font-size:28px}p{line-height:1.65;color:#505967}button,input,select,textarea{font:inherit}button{border:1px solid #c5c9d1;border-radius:16px;background:white;color:#17181b;padding:9px 16px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #287de8;outline-offset:3px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.progress{margin-left:auto;color:#4f5868}article{margin:20px 0;padding:24px;border:1px solid #e0e3e8;background:white;border-radius:26px}h2{font-size:19px;margin:0 0 14px}.expect{padding:12px 16px;border-radius:15px;background:#eff5fd;line-height:1.6}li{line-height:1.7;margin:4px 0}label{display:block;margin-top:16px;font-weight:500}textarea,input,select{display:block;width:100%;margin-top:8px;padding:10px 12px;border:1px solid #bec5d0;border-radius:12px;background:#fff;color:#17181b}textarea{resize:vertical;min-height:76px}select{max-width:220px}small{font-weight:400;color:#586271}.notice{border-left:4px solid #287de8;padding-left:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:16px}#saveState{font-size:13px;color:#586271}article[data-status="未通过"]{border-color:#cf3029}article[data-status="通过"]{border-color:#00852a}@media(max-width:640px){body{padding:16px}.meta{grid-template-columns:1fr}article{padding:18px}.progress{margin-left:0}}@media(prefers-color-scheme:dark){:root{background:#202125;color:#f5f5f5}header{background:#202125ed}p,.progress,small,#saveState{color:#c0c6d0}article{background:#292b30;border-color:#474b53}button,input,select,textarea{background:#34373e;color:#f5f5f5;border-color:#69727f}.expect{background:#26374e}}@media print{header{position:static}nav{display:none}article{break-inside:avoid}textarea{min-height:100px}}
</style>
<header><h1>Swirl · 人工验收</h1><p>由你使用真实环境填写。所有项目初始均为“未测试”。本页完全本地运行。</p><nav><button id="export">导出结果 JSON</button><button id="import">导入结果</button><button id="print">打印 / 保存 PDF</button><span class="progress" id="progress"></span></nav><div role="status" id="saveState"></div></header>
<p class="notice">页面会尽力保存到当前浏览器的本地存储。请完成后导出 JSON 留存并交回；文件网址的存储行为可能随浏览器变化。不要填写订阅密钥、访问令牌或完整敏感日志。</p>
<div class="meta"><label>构建版本 / Git 提交<input id="build" placeholder="见随包交付说明"></label><label>系统、显示器、刷新率与测试日期<input id="environment" placeholder="Windows / 16英寸2K / 120Hz / 日期"></label></div>
<main id="cases"></main><input type="file" id="file" accept="application/json,.json" hidden>
<script>
'use strict';
const cases=[
['codex-connect','Codex 经系统代理连接',['启动本次构建，选择你自己的节点并连接。','在设置中主动启用 Swirl 系统代理，确认状态显示已接管。','按你的日常方式启动 Codex 并发送一条消息。'],'系统代理显示真实接管状态；Codex 能完成请求。服务端错误需要保留错误信息，不能据此直接认定 Swirl 故障。'],
['codex-reconnect','Reconnecting 1/5 复现',['保持 Swirl 系统代理开启。','在 Codex 连续进行多轮真实对话。','记录是否出现 Reconnecting 1/5、出现时间与最终恢复或失败情况。'],'连接正常或失败有可对照的时间证据；不得把未观察到重连写成服务端永不失败。'],
['long-session','长时间对话与长任务',['使用 Codex 执行你常用的长任务，至少覆盖以往容易断连的时长。','记录开始、结束时间，期间不要更改节点。','若中断，保留 Swirl 本地事件与 Codex 显示的时间和错误。'],'Swirl 不因控制接口采样、短请求诊断超时或空闲策略主动切断业务隧道。'],
['switch-node','切换节点',['在 Codex 任务运行时从节点 A 切换到已配置的节点 B。','观察原任务和下一次新请求。','记录切换是否需要重启引擎、是否提示配置已变动。'],'运行配置内切换不重启整个引擎，原连接可继续留在原出口，新连接使用新节点。原上游已失效的连接仍可能中断。'],
['diagnostics','端口、CONNECT、HTTPS 与 WebSocket',['在设置的本地连接诊断中检查监听端口。','填入你允许访问的 HTTPS URL 和 WebSocket URL，再主动发起诊断。','分别记录 HTTP CONNECT 状态、TLS / HTTPS 结果、WS Upgrade 与帧验证结果。'],'每项显示独立的真实结果；端口开放不冒充节点可用，CONNECT 成功不冒充 TLS / WebSocket 成功。'],
['proxy-restore','系统代理恢复与竞争修改',['记录接管前的代理 / PAC / 自动检测设置。','启用后正常停止 Swirl，核对设置恢复。','可选：重新接管后用任务管理器结束 Swirl，等待恢复助手处理；再验证其他代理软件主动改设置时 Swirl 不覆盖它。'],'正常退出与异常退出有恢复路径；仅恢复仍属于本次 Swirl 的配置，不覆盖其他软件后来的改动。'],
['font-100','字体 · Windows 100%',['将 Windows 显示缩放设为 100%。','查看字体页、活动页、节点页、输入框、按钮、下拉框及二级页面。','等待动画结束；拖动到对应显示器后再次观察，并查看不同字体的真实预览。'],'静态文字清晰、无残留缩放模糊或裁切；Windows 自动字体顺序为 HarmonyOS Sans SC → Microsoft YaHei UI → 系统回退。'],
['font-125','字体 · Windows 125%',['将 Windows 显示缩放设为 125%。','检查与上一项相同的页面、字体列表和编辑控件。','若使用多屏，将窗口移到另一缩放比例的屏幕并移回。'],'125% 原生 DPI 生效；文字基线、字号和控件边界稳定，无二次整页放大。'],
['font-150','字体 · Windows 150%',['将 Windows 显示缩放设为 150%。','检查字体、活动与节点页，输入中文并打开下拉菜单。','等待进入和返回动画结束后观察。'],'文字清晰且布局可滚动、无被遮挡控件和异常合成粗体。'],
['font-200','字体 · Windows 200%',['将 Windows 显示缩放设为 200%。','检查最小窗口与最大化窗口的核心页面。','核对输入框和字体预览文字。'],'高 DPI 下仍按逻辑尺寸布局；文字可辨、重要内容不重叠。'],
['activity','活动页与真实流量',['开启代理后访问你允许的站点或运行你的任务。','打开活动页，观察上传、下载、当前连接、今日 / 本月流量和趋势。','停止引擎，检查状态是否更新；重启后检查今日 / 本月历史统计。'],'数值来自真实认证引擎采样；首个样本等待速率差值；停止时显示未连接。今日 / 本月统计沿用本地真实历史，采样中断不会伪造新样本。'],
['node-list','节点列表滚动、筛选和选择',['导入或使用你已有节点，组合地区、协议、来源筛选。','滚到列表顶部和底部，使用鼠标和键盘选择。','快速选择不同节点，核对右侧详情是否对应当前选择。'],'表头固定且不遮挡第一行；行高、hover 与选中状态一致；地区来源筛选保留，详情响应准确。'],
['node-detail','节点详情、请求与端口',['选择名称很长的节点，检查换行与完整名称提示。','检查连接、测试、编辑和删除按钮；使用你允许的 URL 发起真实请求。','修改端口前核对连接状态，记录实际结果与错误。'],'卡片随内容占用合理高度；URL / 端口布局紧凑，真实请求结果与当前节点一致，不沿用过期成功状态。'],
['continuous-motion','链接的一镜到底与返回',['打开当前模块中心，点击设置入口卡片；再验证活动页的原有连续入口。','进入后点击返回，再尝试在动画中快速切换、按返回。','分别在可用的 60 / 120 / 240Hz 下观察；不支持的刷新率写明未测试。'],'卡片表面连续展开与收回，返回方向对应，无背景闪烁和最终文字模糊；无关导航保持原方式。'],
['compatibility','不遵循系统代理的软件',['使用设置页提供的环境变量建议，只在你主动打开的 PowerShell 会话中设置 HTTP_PROXY / HTTPS_PROXY / ALL_PROXY。','从该会话启动需要代理的软件，并记录软件版本及支持情况。','退出会话并确认用户 .codex 文件、密钥和其他软件配置未被 Swirl 修改。'],'建议明确且可撤销；只影响你选择的启动环境。软件不支持该代理方式时如实记录，不宣称已强制接管。']
];
const key='swirl-local-current-acceptance-v2';let values={};let persistent=true;
try{values=JSON.parse(localStorage.getItem(key)||'{}')}catch{persistent=false}
const text=(tag,content)=>{const e=document.createElement(tag);e.textContent=content;return e};
function save(){values.build=document.querySelector('#build').value;values.environment=document.querySelector('#environment').value;values.updatedAt=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify(values));document.querySelector('#saveState').textContent='已保存到本地浏览器 · 请导出结果留存'}catch{persistent=false;document.querySelector('#saveState').textContent='本地存储不可用，请使用“导出结果 JSON”保存'}update()}
function update(){const counts={'通过':0,'未通过':0,'未测试':0};for(const c of cases){const status=values[c[0]]?.status||'未测试';counts[status]++;document.querySelector('#case-'+c[0]).dataset.status=status}document.querySelector('#progress').textContent=`通过 ${counts['通过']} · 未通过 ${counts['未通过']} · 未测试 ${counts['未测试']}`}
function render(){document.querySelector('#cases').replaceChildren();document.querySelector('#build').value=values.build||'';document.querySelector('#environment').value=values.environment||'';cases.forEach(([id,title,steps,expected],i)=>{const a=document.createElement('article');a.id='case-'+id;a.append(text('h2',`${i+1}. ${title}`));a.append(text('strong','操作步骤'));const ol=document.createElement('ol');steps.forEach(s=>ol.append(text('li',s)));a.append(ol);const ex=text('div','预期结果：'+expected);ex.className='expect';a.append(ex);const record=values[id]||{status:'未测试',actual:'',issue:''};values[id]=record;for(const [field,label] of [['actual','实际结果'],['status','验收状态'],['issue','问题描述']]){const l=text('label',label);const input=document.createElement(field==='status'?'select':'textarea');input.id=id+'-'+field;input.setAttribute('aria-label',title+' · '+label);if(field==='status')for(const status of ['未测试','通过','未通过']){const o=text('option',status);o.value=status;input.append(o)}input.value=record[field];input.addEventListener('input',()=>{record[field]=input.value;save()});l.append(input);a.append(l)}document.querySelector('#cases').append(a)});update();document.querySelector('#saveState').textContent=persistent?'本地记录已载入 · 尚未填写的项目保持未测试':'本地存储不可用，请导出结果留存'}
document.querySelectorAll('.meta input').forEach(e=>e.addEventListener('input',save));
document.querySelector('#export').onclick=()=>{save();const data={schema:'swirl-local-current-acceptance-v2',...values,items:cases.map(([id,title,steps,expected])=>({id,title,steps,expected,...values[id]}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Swirl-人工验收-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelector('#import').onclick=()=>document.querySelector('#file').click();
document.querySelector('#file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.schema!=='swirl-local-current-acceptance-v2')throw Error('文件格式不匹配');const clean={build:String(data.build||''),environment:String(data.environment||'')};for(const [id]of cases){const item=data.items?.find(r=>r.id===id)||data[id]||{};clean[id]={status:['未测试','通过','未通过'].includes(item.status)?item.status:'未测试',actual:String(item.actual||''),issue:String(item.issue||'')}}values=clean;render();save()}catch(error){document.querySelector('#saveState').textContent='导入失败：'+error.message}e.target.value=''};
document.querySelector('#print').onclick=()=>window.print();render();
</script></html>
